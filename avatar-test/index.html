function spec(s,pose,replace){
 const top=item(s.items.top),bottom=item(s.items.bottom),dress=item(s.items.dress);
 const straight=s.items.hair==='nocturne-hair-front',boots=s.items.shoes==='nocturne-boots';

 const foldedPants=!dress&&pose==='lively'&&bottom?.tailored==='pants';

   clean?'fitted:base:'+pose:D.base[pose];

 if(boots)urls.unshift('fitted:boot-back:'+pose);

   const asset=replace?.slot===slot?replace.url:item(s.items[slot])?.variants[pose];
   if(asset){
     const tuck=slot==='bottom'&&boots&&bottom?.tailored==='pants'&&asset.startsWith('fitted:garment:');

     if(slot==='top'&&knit&&pose!=='basic'&&pose!=='mini'&&top.originalVariants&&!replace)
       urls.push(top.originalVariants[pose]);
     if(slot==='shoes'&&boots)urls.push('fitted:boot-front:'+pose);
     else if(slot==='top'&&top?.tailored&&asset.startsWith('fitted:garment:'))
       urls.push(asset.replace('fitted:garment:','fitted:collar:'));
     else urls.push(tuck?asset.replace('fitted:garment:','fitted:tucked:'):asset);
     if(slot==='bottom'&&bottom?.design==='bottom-original'&&skirtOverlap[pose])
       urls.push('fitted:skirt-limb:'+pose);
   }
 };
 if(!straight)append('hair');
 append('expression');
 const hemOverShoe=foldedPants&&!boots;
 if(hemOverShoe)append('shoes');
 for(const slot of (dress?['dress']:top?.tailored?['bottom','top']:['top','bottom']))append(slot);
 if(!hemOverShoe)append('shoes');
 append('outer');append('bag');append('accessory');
 if(straight)append('hair');
 else if(waveLocks[pose]&&(!s.items.hair||s.items.hair==='casual01-hair'||item(s.items.hair)?.variants[pose]?.startsWith('derived:')))
   urls.push('fitted:locks:'+pose+':'+(s.items.hair||'native'));

   if(!covered&&(pose==='cute'||pose==='lively'))urls.push('fitted:forearm:'+pose);

     urls.push('fitted:'+(covered||pose==='chic'&&knit?'hands':'arms')+':'+pose+(straight?':straight':''));
 }
 if(straight&&pose==='mini')urls.push('fitted:mini-hand:mini');
 append('headwear');

}

function thumb(dst,im){let c=canvas(im.width,im.height),ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(im,0,0);let a=ctx.getImageData(0,0,c.width,c.height).data,minx=c.width,miny=c.height,maxx=-1,maxy=-1;for(let y=0;y<c.height;y++)for(let x=0;x<c.width;x++)if(a[(y*c.width+x)*4+3]>32){minx=Math.min(minx,x);maxx=Math.max(maxx,x);miny=Math.min(miny,y);maxy=Math.max(maxy,y)}if(maxx<0)return;let dw=maxx-minx+1,dh=maxy-miny+1,s=Math.min((dst.width-12)/dw,(dst.height-12)/dh);dst.getContext('2d').drawImage(im,minx,miny,dw,dh,(dst.width-dw*s)/2,(dst.height-dh*s)/2,dw*s,dh*s)}
const originalDesigns = {
  top:['골지 니트',{original:'로즈',ivory:'아이보리',lavender:'라벤더',mint:'민트',black:'차콜'}],
  bottom:['클래식 플리츠 스커트',{original:'블랙',navy:'네이비',burgundy:'버건디',cream:'크림'}],
  shoes:['버클 앵클부츠',{original:'블랙',brown:'모카',wine:'와인',cream:'아이보리'}],
};
const casualDesigns = {
  hair:['웨이브 헤어','허니 브라운'],accessory:['하트 주얼리','골드'],
  top:['골지 니트','세이지'],bottom:['클래식 플리츠 스커트','슬레이트 블루'],
  shoes:['클래식 앵클부츠','코코아'],bag:['크로스백','카라멜'],

for (const entry of catalog) {
  const part = entry.category;
  const legacy = originalDesigns[part];
  if (entry.id.startsWith('casual01-')) {
    [entry.designName,entry.colorName] = casualDesigns[part];
    if (legacy) entry.design=part+'-original';
  } else if (legacy && entry.id.startsWith(part+'-')) {
    entry.design = part+'-original';
    entry.designName = legacy[0];
    entry.colorName = legacy[1][entry.id.slice(part.length+1)];
  }
}

function designGroups(part) {
  const groups = new Map();
  for (const entry of catalog.filter(x=>x.category===part)) {
    const id = entry.design || entry.id;
    if (!groups.has(id)) groups.set(id, []);
    groups.get(id).push(entry);
  }
  return [...groups.values()];
}

function renderColors(selectedGroup) {
  const colors = $('wardrobeColors');
  colors.replaceChildren();
  colors.hidden = !selectedGroup || selectedGroup.length < 2;
  if (colors.hidden) return;
  colors.append(make('span','색상','sub'));
  for (const entry of selectedGroup) {
    const b = btn(null,()=>{
      state.items[category] = entry.id;
      refreshArt().catch(e=>toast(e.message));
      for (const button of colors.querySelectorAll('button')) pressed(button,button===b);
      const active = $('items').querySelector('[aria-pressed="true"] canvas');
      if (active) paintItem(active,entry);
    });
    if (entry.swatch) {
      const swatch = make('span',null,'wardrobe-swatch');
      swatch.style.setProperty('--swatch',entry.swatch);
      swatch.setAttribute('aria-hidden','true');
      b.append(swatch);
    }
    b.append(make('span',entry.colorName || entry.name));
    pressed(b,entry.id===state.items[category]);
    colors.append(b);
  }
}

function paintItem(dst,entry){
  const url=entry.preview || entry.variants[state.pose];
  dst.dataset.imageId=entry.id;
  image(url).then(im=>{
    if(dst.dataset.imageId!==entry.id||!dst.isConnected)return;
    dst.getContext('2d').clearRect(0,0,dst.width,dst.height);
    thumb(dst,im);
  }).catch(e=>toast(e.message));
}
function renderItems() {
  const cats = $('cats');
  cats.replaceChildren();
  for (const part of ['top','bottom','shoes',...EXTRA,'bg']) {
    const count = part==='bg' ? D.backgrounds.length : designGroups(part).length;
    if (!count) continue;
    const b = btn(LABEL[part]+' '+count,()=>{category=part;renderItems()});
    pressed(b,category===part);
    cats.append(b);
  }

  const root = $('items');
  root.replaceChildren();
  const background = category==='bg';
  const groups = background ? D.backgrounds.map(entry=>[entry]) : designGroups(category);
  const separatesHidden=state.items.dress&&(category==='top'||category==='bottom');
  const selectedGroup = background||separatesHidden ? null : groups.find(group=>group.some(entry=>entry.id===state.items[category]));
  $('count').textContent = groups.length+(background?'개':'개 디자인');
  if (EXTRA.includes(category)) {
    const b = btn('장착 안 함',()=>{state.items[category]=null;update()},'item');
    b.setAttribute('aria-label','장착 안 함');
    pressed(b,!selectedGroup);
    root.append(b);
  }
  groups.forEach(([entry],index)=>{
    const b = btn(null,()=>{
      if (background) state.bg=index;

        if(category==='top'||category==='bottom')state.items.dress=null;

      im.alt='';

      const c=canvas(200,160);
      b.append(c);

    b.setAttribute('aria-label',entry.designName || entry.name);
    pressed(b,background ? state.bg===index : groups[index]===selectedGroup);
    root.append(b);
  });

}
