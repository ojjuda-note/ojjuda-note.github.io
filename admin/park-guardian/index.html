<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex"><title>공원 보호자 동의 관리</title><link rel="stylesheet" href="/admin/style.css"><style>main{max-width:36rem;margin:2rem auto;padding:1rem}form{display:grid;gap:.85rem}label{display:grid;gap:.25rem}input,select,button{font:inherit;padding:.6rem}textarea{width:100%;font:inherit}#code{overflow-wrap:anywhere}</style><script src="/config.js" defer></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2" defer></script><script src="review.js?v=1" defer></script></head><body><main><a href="/admin/?from=park">관리자 홈</a><h1>공원 보호자 동의</h1><p id="state" role="status">관리자 권한을 확인하고 있어요.</p><section id="review" hidden>
<h2>1. 동의 안내 보내기</h2><p>보호자가 먼저 연락한 주소로 안내를 보내세요. 첫 요청 때는 자녀 정보를 받지 마세요.</p><label>보호자 이메일<input type="email" id="recipient" autocomplete="off"></label><button id="send" type="button">동의 안내 메일 작성</button>
<h2>2. 보호자 회신 확인</h2><p>안내를 보낸 주소에서 돌아온 회신과 법정대리인 관계를 확인하세요. 확인이 어려우면 발급을 보류하세요. 가족관계 서류나 신분증 사본을 이 화면에 올리지 마세요.</p>
<form id="decision" autocomplete="off"><label>처리할 내용<select id="action"><option value="issue">가입 동의 확인 및 코드 발급</option><option value="allow_location">위치 이용 동의 추가</option><option value="withdraw_location">위치 이용 동의 철회</option><option value="withdraw_signup">가입 동의 철회 및 이용 중지</option></select></label><label>회신을 보낸 보호자 이메일<input type="email" id="guardian" required></label><label>보호자가 확인한 자녀 가입 이메일<input type="email" id="child" required></label><label id="birth-label">자녀 생년월일<input type="date" id="birth" required></label><label>확인한 회신의 메일 원본 Message-ID<input id="evidence" minlength="4" maxlength="240" required></label><label id="location-label">위치 수집·이용에 대한 보호자 회신<select id="location" required><option value="">선택해 주세요</option><option value="no">미동의</option><option value="yes">동의</option></select></label><label><span><input type="checkbox" id="verified" required> 안내를 보낸 뒤 받은 보호자의 명시적인 회신과 선택을 확인했어요.</span></label><button type="submit" id="save">회신 기록</button></form><p id="result" role="status"></p><output id="code"></output></section></main></body></html>
