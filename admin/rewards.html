<body><div class="shell">
 <header class="topbar"><a class="brand" href="/">오쭈다 아지트</a><a href="/world.html?admin=referrals">추천인 관리로</a></header>
 <main class="main"><h1>선물 지급 관리</h1>
  <p id="status" role="status" aria-live="polite">관리자 권한을 확인하고 있어요.</p>
  <button id="refresh" type="button" class="action">새로 확인</button>
  <div id="content" hidden>
   <section class="reward-panel"><h2>지급 기준</h2><dl id="policy"></dl><p id="delivery" class="reward-notice"></p></section>
   <section class="reward-panel"><h2>추천 보상 현황</h2><p id="progress"></p><progress id="meter" max="500" value="0" aria-label="추천 회원 인정 현황"></progress><div id="referrers"></div></section>
   <section class="reward-panel"><h2>상품권 지급 내역</h2><div id="awards"></div></section>
   <section class="reward-panel"><h2>월말 순위 마감 기록</h2><p>한국 시간 말일 23:59 기준. 관리자가 1위이면 해당 항목은 미지급하며, 2위로 넘기지 않습니다.</p><div id="monthly"></div></section>
  </div>
