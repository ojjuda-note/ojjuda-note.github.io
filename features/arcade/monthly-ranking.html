<title>이번 달 게임 순위 · 오쭈다 아지트</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./monthly-ranking.css?v=20261108-monthly-personal1">
<script src="/config.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" defer></script>
<script src="/games/sacheonseong/ranking.js?v=20261108-sacheonseong-200-stacks1" defer></script>

<script src="/games/solitaire/rules.js?v=20261106-solitaire-ranking1" defer></script>

<body>
<header class="topbar"><a class="home" href="/world.html?tab=hub" aria-label="오쭈다 아지트로 돌아가기">← 아지트</a><strong>오쭈다 아지트</strong><span>월간 게임 순위</span></header>
<main>
  <section class="intro" aria-labelledby="ranking-title">
    <div class="eyebrow">MONTHLY TOP 10</div>
    <h1 id="ranking-title">이번 달 게임 순위 <span aria-hidden="true">🏆</span></h1>
    <p>매월 1일 오전 1시(한국시간)에 새 순위가 시작돼요. 이전 기록은 그대로 보관해요.</p>
    <label class="chooser" for="ranking-game">게임 선택 <select id="ranking-game" aria-label="순위를 볼 게임"></select></label>
    <p id="ranking-period" class="period" aria-live="polite">순위를 준비하고 있어요…</p>
  </section>
  <section class="board" aria-labelledby="leaders-title">
    <div class="section-head"><div><span class="eyebrow">LEADERBOARD</span><h2 id="leaders-title">현재 1~10위</h2></div><button id="ranking-refresh" type="button">새로고침</button></div>
    <p id="ranking-status" class="status" role="status" aria-live="polite">기록을 불러오는 중…</p>
    <ol id="ranking-leaders" class="rank-list" aria-label="이달 상위 10명"></ol>
  </section>
  <section id="ranking-mine" class="my-rank" aria-labelledby="mine-title" hidden>
    <span class="eyebrow">MY RANK</span><h2 id="mine-title">10위 밖의 내 기록</h2>
    <p>상위 10명 아래에 내 순위와 점수를 따로 표시했어요.</p>
    <div id="ranking-mine-row"></div>
  </section>
  <p class="note">순위는 게임별 기준에 따라 집계돼요. 기록이 같으면 게임에 정해진 우선순위와 달성 시각을 적용해요.</p>
</main>
</body>
</html>
