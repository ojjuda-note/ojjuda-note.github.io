<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f9f7f2">
  <title>파장 · 취향으로 만나는 소개팅 | 오쭈다 아지트</title>
  <meta name="description" content="오늘의 질문으로 시작하는 만남. 예시 레이더에서 마음이 닿는 인연의 답변을 읽어보세요.">
  <link rel="stylesheet" href="./preview.css?v=1">
  <script type="module" src="./preview.mjs?v=1"></script>
</head>
<body>
  <main>
    <div class="eyebrow"><span class="brand">파장</span><span>19+ 소개팅</span></div>
    <h1>취향이 닿는 인연</h1>
    <p class="intro">오늘의 질문에 답하고, 가까운 인연과 첫 만남을 시작해 보세요.</p>
    <section class="panel" aria-label="예시 인연 레이더">
      <div class="radar-head"><strong>인연 레이더</strong><span>예시 프로필 3명</span></div>
      <div class="scope" id="scope">
        <div class="rose" aria-hidden="true"><b>N</b><b>E</b><b>S</b><b>W</b></div>
        <div class="sweep" aria-hidden="true"></div>
        <span class="self">나</span>
        <div id="marks"></div>
      </div>
      <div class="control"><span id="direction">북쪽 고정</span><button type="button" id="compass">휴대폰 방향 켜기</button></div>
      <p id="sensor-note" role="status"></p>
    </section>
    <section class="answer" aria-live="polite"><small>오늘의 질문</small><h2>둘이서 보내는 느긋한 오후, 무엇을 하고 싶나요?</h2><p id="reply">레이더의 점을 눌러 답변을 읽어보세요.</p><b id="by"></b></section>
    <section class="actions" aria-label="내 답변 체험">
      <button id="write" type="button" aria-expanded="false" aria-controls="answer-form">나도 답해보기</button>
      <form id="answer-form" hidden>
        <label for="mine">나의 느긋한 오후는…</label>
        <textarea id="mine" rows="3" maxlength="140" required placeholder="함께하고 싶은 일을 적어주세요." aria-describedby="demo-note"></textarea>
        <button type="submit">내 답변 확인하기</button>
      </form>
      <output id="my-answer" aria-live="polite"></output>
      <small id="demo-note">가상 인연과 만나는 체험이에요. 내 답변은 이 화면에서만 보이며, 위치를 수집하지 않아요.</small>
    </section>
    <a class="home" href="/world.html" target="_top">아지트로 돌아가기</a>
  </main>
</body>
</html>
