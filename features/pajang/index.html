<!doctype html>
<html lang="ko">
<head>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2" defer></script>
<script src="/shared/location/location.js?v=shared1" defer></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbf8f2">
  <title>파장 · 취향으로 만나는 소개팅 | 오쭈다 아지트</title>
  <meta name="description" content="오늘의 질문으로 시작하는 만남. 예시 레이더에서 마음이 닿는 인연의 답변을 읽어보세요.">
  <link rel="preconnect" href="https://ziezbdjofcugznowiuda.supabase.co" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="modulepreload" href="./member.mjs?v=entry3">
  <link rel="modulepreload" href="./load-station.mjs?v=entry3">
  <link rel="preload" href="./station.css?v=letter1" as="style">
  <link id="entry-style" rel="stylesheet" href="./preview.css?v=compass8">
  <link rel="stylesheet" href="./shell.css?v=flight1">
  <link rel="stylesheet" href="./letterroom.css?v=entry2">
  <script type="module" src="./shell.mjs?v=open2"></script>
  <script type="module" src="./entry.mjs?v=answer-policy1"></script>
</head>
<body>
  <header class="pajang-mast"><div class="pajang-mast-inner">
    <a class="agit-return" href="/world.html" target="_top"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10 5-7 7 7 7M3 12h17"/></svg>아지트로</a>
    <span class="pajang-signature"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path fill="currentColor" stroke="none" d="M12 21C8 18 2 13.5 2 8.5A5.5 5.5 0 0 1 12 5a5.5 5.5 0 0 1 10 3.5C22 13.5 16 18 12 21Z"/></svg>파장</span>
    <span class="pajang-members">19+ 회원 전용</span>
  </div></header>
  <main id="gate" aria-live="polite">
    <div class="flight-scene" aria-hidden="true">
      <div class="flight-landscape"></div>
      <div class="flight-across"><div class="flight-lift"><span class="paper-plane"><i></i></span></div></div>
    </div>
    <p class="flight-caption" role="status">파장을 열고 있어요.</p>
  </main>
  <main id="welcome" hidden>
    <div class="entry-intro"><div class="entry-scene" aria-hidden="true"><div class="moon-study"></div></div><span class="entry-slot" id="slot-label">이번 질문</span>
      <h1 id="entry-question">오늘의 질문</h1><p class="intro">파장은 답변으로 인연을 찾는 회원 소개팅이에요. 마음에 닿는 답변에 신호를 보내보세요.</p></div>
    <section class="actions" aria-label="질문에 답하기">
      <button id="write" type="button" aria-expanded="false" aria-controls="answer-form">내 답변 쓰기</button>
      <button class="feed-shortcut" id="browse" type="button">모두의 답변 둘러보기 <span aria-hidden="true">→</span></button>
      <form id="answer-form" hidden>
        <fieldset id="join-fields" hidden disabled>
          <legend>파장 첫 참여</legend>
          <label class="consent"><input name="consent" type="checkbox" required> 만 19세 이상이며 파장 회원에게 닉네임과 내가 선택한 공개 정보를 보여 주는 데 동의해요.</label>
          <details><summary>공개 정보 선택</summary>
            <label>닉네임<input name="name" maxlength="12" autocomplete="nickname" placeholder="오쭈다 닉네임 사용"></label>
            <label>활동 지역 · 시·도<select name="province"><option value="">공개하지 않음</option></select></label>
            <label id="city-field" hidden>시·군 (선택)<select name="city"><option value="">시·도만 공개</option></select></label>
            <label>공개할 취향<select name="interest"><option value="">공개하지 않음</option></select></label>
          </details>
        </fieldset>
        <fieldset id="answer-fields">
        <label for="mine">나의 답변</label>
        <textarea id="mine" rows="3" maxlength="220" required placeholder="이번 질문에 대한 내 생각을 적어 주세요." aria-describedby="publication-note"></textarea>
        <p class="publication-note" id="publication-note">이 답변을 공개하면 다른 파장 회원이 질문과 답변을 작성일을 포함해 최대 365일간 볼 수 있어요(한국 시간 기준).</p>
        </fieldset>
        <button type="submit">365일간 공개하고 파장 메인으로</button>
        <button type="button" class="cancel-form" id="cancel-form">취소</button>
      </form>
      <output id="my-answer" role="status"></output>
      <small id="demo-note">답변은 공개할 때 안내받은 기간에만 다른 파장 회원에게 보여요. 차단한 회원과는 서로 볼 수 없어요.</small>
    </section>
    <details class="sample-radar"><summary>예시 레이더 보기</summary>
    <section class="panel" aria-label="예시 인연 레이더">
      <div class="radar-head"><strong>인연 레이더</strong><span>예시 프로필 3명</span></div>
      <div class="scope" id="scope">
        <div class="rose" aria-hidden="true"></div>
        <div class="sweep" aria-hidden="true"></div>
        <span class="self">나</span>
        <div id="marks"></div>
      </div>
      <div class="control"><span id="direction">북쪽 고정</span><button type="button" id="compass">휴대폰 방향 켜기</button></div>
      <p id="sensor-note" role="status"></p>
    </section>
    <div class="answer" aria-live="polite"><p id="reply">레이더의 점을 눌러 답변을 읽어보세요.</p><b id="by"></b></div>
    </details>
  </main>
  <div id="station" hidden></div>
  <script src="/config.js"></script>
</body>
</html>
