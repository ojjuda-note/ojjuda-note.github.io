<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>우리집 테스트</title><link rel="stylesheet" href="style.css?v=20261002-bookshelf-sliders"></head>
<body><section id="locked"><h1>우리집 테스트</h1><p>월드 관리자 모드에서 열어 주세요.</p><a href="/world.html">월드로 돌아가기</a></section>
<main id="app" hidden>
<header><button id="exit" aria-label="테스트 닫기">‹ <span>월드</span></button><h1>우리집 <small>테스트</small></h1><button id="expand" aria-pressed="false">＋ 집 확장</button></header>
<div class="scene-heading"><span id="room-name">거실</span><span id="period-name">낮</span><span id="room-count">1 / 35개 방</span></div>
<section id="viewport" aria-label="아파트 단면, 드래그로 이동하고 두 손가락으로 확대" tabindex="0"><div id="world"></div><div class="help" id="hint">방을 끌어 둘러보세요</div><div class="camera"><button id="zoom-out" aria-label="축소">−</button><button id="zoom-in" aria-label="확대">＋</button><button id="home-view">현재 방</button><button id="overview">전체 보기</button></div></section>
<section id="panel" aria-label="선택한 기능"><div class="panel-head"><div><small>우리집에서 함께</small><h2 id="panel-title">방 꾸미기</h2></div></div><div id="panel-body"></div></section>
<nav aria-label="우리집 메뉴"><button data-tab="room" aria-pressed="true"><span>▧</span>방 꾸미기</button><button data-tab="diary"><span>▤</span>내 기록</button></nav>
<div id="notice" role="status" aria-live="polite"></div><p id="save-warning" hidden role="status">이 브라우저에서는 테스트 내용을 저장할 수 없어요.</p>
</main><script type="module" src="app.js?v=20261002-bookshelf-sliders"></script></body></html>
