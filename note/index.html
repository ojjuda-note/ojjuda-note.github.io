<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F0679A">
  <title>오쭈다노트 | 오쭈다월드</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="features.css">
  <link rel="stylesheet" href="support.css">
  <link rel="stylesheet" href="notifications.css">
</head>
<body>
  <svg class="icons" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1zM9 21v-7h6v7"/></symbol>
    <symbol id="cards" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1"/><path d="m4 17 5-5 3 3 3-4 5 5"/></symbol>
    <symbol id="search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></symbol>
    <symbol id="plus" viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></symbol>
    <symbol id="heart" viewBox="0 0 24 24"><path d="M20.5 8.5c0 4.7-8.5 10-8.5 10s-8.5-5.3-8.5-10a4.5 4.5 0 0 1 8.5-2 4.5 4.5 0 0 1 8.5 2z"/></symbol>
    <symbol id="reply" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 1-8 8H5l-2 2v-8a8 8 0 1 1 17-2z"/></symbol>
    <symbol id="bookmark" viewBox="0 0 24 24"><path d="M6 4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18l-6-4-6 4z"/></symbol>
    <symbol id="arrow" viewBox="0 0 24 24"><path d="m14 5-7 7 7 7M7 12h14"/></symbol>
    <symbol id="close" viewBox="0 0 24 24"><path d="M5 5 19 19M19 5 5 19"/></symbol>
    <symbol id="pin" viewBox="0 0 24 24"><path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 0 1 14 0z"/><circle cx="12" cy="10" r="2"/></symbol>
  </svg>

  <a class="skip" href="#main">본문으로 건너뛰기</a>
  <div class="shell">
    <aside class="side" aria-label="노트 메뉴">
      <a class="brand" href="./" aria-label="오쭈다노트 홈"><img class="brand-icon" src="/favicon.svg" alt=""><span>오쭈다<b>노트</b></span></a>
      <div class="side-section-label">오쭈다월드의 노트</div>
      <nav class="side-nav">
        <button class="nav-button on" type="button" data-show="feed"><svg><use href="#cards"/></svg>사진 카드</button>
        <button class="nav-button" type="button" disabled title="데이터 연결 후 제공"><svg><use href="#bookmark"/></svg>메모함</button>
      </nav>
      <div class="side-spacer"></div>
      <a class="world-link" href="/world.html"><svg><use href="#home"/></svg>미니홈피 <span aria-hidden="true">↗</span></a>
      <p class="side-caption" id="account-status">계정 확인 중</p>
    </aside>

    <div class="col">
      <header class="mobile-top">
        <a class="brand" href="./" aria-label="오쭈다노트 홈"><img class="brand-icon" src="/favicon.svg" alt=""><span>오쭈다<b>노트</b></span></a>
        <a class="world-small" href="/world.html" aria-label="오쭈다월드로 이동"><svg><use href="#home"/></svg></a>
      </header>

      <main id="main" class="main">
        <div class="preview-banner" id="connection-status" role="status" aria-live="polite"><span class="preview-dot"></span><span id="connection-message">카드를 불러오는 중</span></div>

        <section id="feed" class="screen" aria-labelledby="feed-title">
          <div class="page-heading">
            <div><h1 id="feed-title">사진 카드</h1></div>
            <button class="icon-button search-button" type="button" aria-label="태그 검색" aria-expanded="false" id="search-toggle" disabled title="다음 단계에서 제공"><svg><use href="#search"/></svg></button>
          </div>
          <div class="search-panel" id="search-panel" hidden><label for="tag-search">태그 검색</label><input id="tag-search" type="search" placeholder="태그 입력" disabled></div>
          <div class="feed-layout">
            <div class="feed-column">
              <div class="tabs" role="group" aria-label="카드 순서"><button class="selected" type="button" aria-current="true">최근순</button><button type="button" disabled title="다음 단계에서 제공">인기있는</button><button type="button" disabled title="위치 동의 후 제공">가까운순</button></div>
              <div class="feed-list" id="feed-list" aria-live="polite"><p class="reply-empty">카드를 불러오는 중이에요.</p></div>
            </div>
          </div>
        </section>

        <section id="detail" class="screen detail-screen" aria-label="카드와 답글" hidden>
          <button class="back-button" type="button" data-show="feed"><svg><use href="#arrow"/></svg>카드로 돌아가기</button>
          <div class="detail-layout">
            <div class="detail-card-slot" id="detail-card-slot"></div>
            <div class="replies"><div class="reply-heading"><div><p class="eyebrow">이야기가 이어져요</p><h2>답글 카드 <span id="reply-count">0</span></h2></div><button class="button primary" type="button" data-compose="reply"><svg><use href="#plus"/></svg>답글 쓰기</button></div><div id="reply-list" aria-live="polite"></div></div>
          </div>
        </section>
      </main>

      <button class="write-fab" type="button" data-compose="new" aria-label="새 카드 쓰기"><svg><use href="#plus"/></svg><span>카드 쓰기</span></button>
      <nav class="bottomnav" aria-label="모바일 메뉴"><button type="button" class="on" data-show="feed"><svg><use href="#cards"/></svg>카드</button><button type="button" disabled><svg><use href="#bookmark"/></svg>메모함</button><a href="/world.html"><svg><use href="#home"/></svg>미니홈피</a></nav>
    </div>
  </div>

  <div class="dialog-backdrop" id="composer-backdrop" hidden>
    <section class="composer" role="dialog" aria-modal="true" aria-labelledby="compose-title">
      <header class="composer-head"><button class="icon-button" type="button" id="close-composer" aria-label="작성창 닫기"><svg><use href="#close"/></svg></button><h2 id="compose-title">새 카드 쓰기</h2><span></span></header>
      <div class="composer-body"><p class="compose-context" id="compose-context">사진 위에 마음을 적어 주세요.</p><div class="compose-photo image-lake"><span class="compose-shade"></span><textarea id="compose-text" aria-label="카드 글" maxlength="200" placeholder="지금 떠오르는 마음을 적어 주세요" rows="5"></textarea><div class="compose-tag-display" id="compose-tag-display">#태그는 사진 아래쪽에 보여요</div></div><div class="compose-status"><span>배경 사진 자동 선택</span><span id="compose-count">0 / 200자</span></div><label class="field-label" for="compose-tags">태그 <small>최대 5개</small></label><input id="compose-tags" type="text" placeholder="쉼표로 나눠 적어 주세요" maxlength="120"><div class="identity-row"><span>표시 이름</span><label><input type="radio" name="identity" value="anonymous" checked>익명</label><label class="disabled-choice" title="다음 단계에서 제공"><input type="radio" name="identity" value="nickname" disabled>닉네임</label></div></div>
      <footer class="composer-footer"><span id="compose-message" role="status" aria-live="polite">로그인 확인 중</span><button class="button primary" id="publish-card" type="button" disabled>등록하기</button></footer>
    </section>
  </div>
  <script src="/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="support.js?v=0.43.7-beta" defer></script>
  <script src="drafts.js" defer></script>
  <script src="notifications.js" defer></script>
  <script src="preview.js?v=0.43.7-beta" defer></script>
</body>
</html>
