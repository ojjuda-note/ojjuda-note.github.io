<body>
  <main class="preview-page">
    <header class="page-header"><a href="/park/" class="back-link">← 오쭈다 공원</a><h1>Even G2</h1></header>
    <section class="hud" id="glass-view" aria-label="G2 화면 미리보기">
      <time id="glass-clock" class="clock">--:--</time>
      <span id="glass-battery" class="battery" aria-label="안경 배터리">—%</span>
      <div class="messages">
        <button id="glass-first" disabled aria-label="첫 번째 공원 카드 열기"><span id="glass-first-body" class="message-body"></span><span id="glass-first-distance" class="message-distance"></span></button>

      </div>
      <button type="button" id="glass-full" class="full" aria-label="본문 닫기" hidden><span class="reader-heading" id="glass-reader-heading"></span><span class="reader-body" id="glass-reader-body"></span><span class="message-distance" id="glass-reader-distance"></span></button>
      <span id="glass-weather" class="weather">—° · 날씨 —</span>
      <span id="glass-speed" class="speed">— km/h</span>
    </section>
    <div class="controls">
      <button type="button" id="glass-prev" disabled>이전</button>
      <button type="button" id="glass-next" disabled>다음</button>
      <button type="button" id="glass-locate">내 위치로 보기</button>
      <button type="button" id="glass-sample">예시 보기</button>
    </div>
    <p id="glass-status" class="status" role="status"></p>
    <p id="glass-signin" class="status" hidden><a class="back-link" href="/park/">공원 로그인</a></p>

      <p>Even Realities 앱의 개발자 모드에서 이 QR을 스캔하세요.</p>

    </details>
    <p id="g2-status" class="status" role="status"></p>
