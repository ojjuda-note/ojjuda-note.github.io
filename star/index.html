<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1725">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="별천지 알림">
  <link rel="manifest" href="/star/manifest.webmanifest">
  <link rel="apple-touch-icon" href="https://hanusan-booking-helper.mj830417686850.chatgpt.site/icons/star-180.png">
  <title>한우산 별천지 예약 도우미 · 오쭈다</title>
  <meta name="description" content="앞으로 45일 중 한우산 별천지의 빈방이 있는 날짜를 자동으로 확인하세요.">
  <link rel="canonical" href="https://ojjuda.kr/star/">
  <link rel="icon" type="image/svg+xml" href="https://hanusan-booking-helper.mj830417686850.chatgpt.site/favicon.svg">
  <link rel="stylesheet" href="https://hanusan-booking-helper.mj830417686850.chatgpt.site/star-client/star-app.css?v=20261104-star-members1">
  <link rel="stylesheet" href="/star/browser-guide.css?v=20261103-star-browser-guide1">
  <link rel="stylesheet" href="/star/member-access.css?v=20261104-star-members1">
  <script defer src="/config.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script>
  <script defer src="/star/browser-guide.js?v=20261104-star-members1"></script>
  <script defer src="/star/member-access.js?v=20261104-star-members1"></script>
</head>
<body style="margin:0;background:#0d1725;color:#f5f5ed">
  <main id="star-member-access" aria-busy="true" aria-labelledby="star-access-title">
    <div class="star-access-card">
      <img class="star-access-art" src="/assets/design/games/star.svg" width="140" height="98" alt="">
      <p class="star-access-badge">오쭈다 회원 전용</p>
      <p class="star-access-name">한우산 별천지 예약 도우미</p>
      <h1 id="star-access-title">회원 정보를 확인하고 있어요</h1>
      <p id="star-access-message" role="status" aria-live="polite">로그인한 회원인지 확인한 뒤 예약 도우미를 열어 드릴게요.</p>
      <div id="star-access-actions" class="star-access-actions" hidden>
        <button id="star-access-retry" class="star-access-button" type="button" hidden>다시 확인하기</button>
        <a class="star-access-button" data-star-auth="login" href="/?auth=login&amp;next=star">로그인하고 이용하기</a>
        <a class="star-access-button star-access-secondary" data-star-auth="signup" href="/?auth=signup&amp;next=star">아직 회원이 아니신가요? 회원가입</a>
      </div>
      <a class="star-access-home" href="/world.html?tab=arcade">오락실로 돌아가기</a>
      <noscript><p>회원 정보를 확인하려면 브라우저에서 자바스크립트를 켜 주세요.</p></noscript>
    </div>
  </main>
  <div id="root" hidden></div>
  <dialog id="star-browser-guide" aria-labelledby="star-guide-title" aria-describedby="star-guide-description">
    <p class="star-guide-badge">실행 전 꼭 확인!</p>
    <svg class="star-guide-icon" width="62" height="52" viewBox="0 0 62 52" fill="none" aria-hidden="true">
      <rect x="3" y="3" width="56" height="43" rx="9" stroke="#FFCD70" stroke-width="2.5"/>
      <path d="M4 16h54" stroke="#FFCD70" stroke-width="2"/>
      <circle cx="11" cy="10" r="1.6" fill="#FFCD70"/><circle cx="17" cy="10" r="1.6" fill="#FFCD70"/>
      <path d="M23 31h16m-6-6 6 6-6 6" stroke="#FFCD70" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h2 id="star-guide-title" tabindex="-1">브라우저로 접속해 주세요</h2>
    <p id="star-guide-description" class="star-guide-description">인터넷·크롬·사파리 브라우저를 열고,<br>아래 주소로 접속해 실행해 주세요.</p>
    <ul class="star-guide-browsers" aria-label="이용할 브라우저">
      <li>인터넷 브라우저</li><li>크롬 브라우저</li><li>사파리 브라우저</li>
    </ul>
    <div class="star-guide-address">
      <label for="star-guide-url">별천지 예약 도우미 접속 주소</label>
      <input id="star-guide-url" type="text" value="ojjuda.kr/star" readonly inputmode="none" spellcheck="false">
      <button type="button" class="star-guide-copy" data-star-guide-copy>주소 복사</button>
    </div>
    <p class="star-guide-status" data-star-guide-status role="status" aria-live="polite"></p>
    <button type="button" class="star-guide-confirm" data-star-guide-confirm>확인했어요</button>
  </dialog>
</body>
</html>
