name: Verified automatic backend repair
run-name: Backend repair ${{ github.event.workflow_run.id }} ${{ github.event.workflow_run.head_sha }}

on:
  workflow_run:
    workflows: [Application regression checks]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: ojjuda-production-backend-repair
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'ojjuda-note/ojjuda-note.github.io' && github.run_attempt == 1 && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.head_repository.full_name == github.repository && startsWith(github.event.workflow_run.head_branch, 'codex/feedback-fix-')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      # This is trusted deployment machinery from main. Candidate code is data.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: candidate
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install trusted deployment dependencies
        run: python -m pip install --disable-pip-version-check -r trusted/ops/automatic-repair-requirements.txt
      - name: Verify provenance and deployment prerequisites
        run: python trusted/ops/automatic-repair.py prepare
        env:
          GH_READ_TOKEN: ${{ github.token }}
          SUPABASE_DB_PASSWORD: ${{ secrets.BACKUP_SUPABASE_DB_PASSWORD }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Apply transactional database repair and verified server bundles
        run: python trusted/ops/automatic-repair.py deploy
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.BACKUP_SUPABASE_DB_PASSWORD }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: backend-repair-receipt
          path: backend-repair-receipt.json
          retention-days: 7
          if-no-files-found: ignore
