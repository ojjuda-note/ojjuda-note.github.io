야 쓴 거야?","카페에 있으면 기분 좋아지지. 오늘은 뭐 마셨어?"]},{q:["간식","과자","아이스크림","디저트","케이크"],a:["달콤한 거 먹으면 기분도 달콤해지지!","나도 한 입만! 무슨 맛이야?"]},{q:["다이어트","살쪘어","살 빼야 돼","살쪘다"],a:["너는 지금도 충분히 멋져. 건강하게만 하자, 알았지?","무리하지 말고 천천히! 산책부터 같이 해 볼까?"]},{q:["요리했어","요리 했어","밥 해 먹었어","베이킹"],a:["우와, 요리했어? 대단하다! 뭐 만들었어?","직접 만든 건 더 맛있지. 나도 냄새 맡고 싶다!"]},{q:["졸려","졸리다","잠 와","잠온다"],a:["졸리면 잠깐 눈 붙여도 돼. 내가 지키고 있을게.","하품 옮았어… 우리 같이 쉬자.","많이 졸리구나. 오늘 많이 애썼나 보다."]},{q:["잠이 안 와","잠이 안와","못 자겠어","불면증","밤새웠어"],a:["잠이 안 올 땐 억지로 자려고 하지 말고 천천히 숨 쉬어 봐. 내가 옆에 있을게.","그럴 땐 따뜻한 물 한 잔 어때? 오늘 머릿속에 생각이 많았어?","괜찮아, 누워서 눈만 감고 있어도 쉬는 거래."]},{q:["잘 자","잘자","굿나잇","자러 갈게","이제 잘게"],a:["잘 자! 좋은 꿈 꿔. 내일 또 보자.","오늘도 수고했어. 푹 자!","잘 자, {n}. 꿈에서 만나!"]},{q:["좋은 아침","굿모닝","일어났어","방금 일어났어"],a:["좋은 아침! 잘 잤어?","일어났구나! 오늘도 좋은 하루 보내자.","굿모닝! 아침은 먹을 거야?"]},{q:["머리 아파","두통","배 아파","아파","감기","열나"],a:["아프구나… 무리하지 말고 꼭 쉬어. 약은 먹었어?","많이 아프면 참지 말고 병원에 가 보자. 나는 여기서 기다릴게.","아플 땐 따뜻하게 하고 푹 쉬는 게 최고야."]},{q:["병원 갔다 왔어","병원 다녀왔어","약 먹었어"],a:["잘했어! 얼른 나아야 해.","다녀오느라 고생했어. 오늘은 푹 쉬자."]},{q:["운동했어","운동 갔다 왔어","헬스","달리기 했어","산책했어"],a:["우와, 운동했어? 멋지다! 개운하지?","몸 움직이면 기분도 좋아지지. 오늘 잘했어!","땀 흘린 만큼 푹 쉬어야 해!"]},{q:["뭐해","뭐 해","뭐하고 있어","뭐 하는 중"],a:["너 기다리고 있었지! 너는 뭐 해?","방에서 뒹굴뒹굴 하고 있었어. 너는?","너랑 얘기하고 있잖아. 제일 좋아!"]},{q:["심심해","심심하다","할 게 없어","지루해"],a:["심심하면 나랑 놀자! 끝말잇기 할래?","그럴 땐 새로운 거 해 보자. 방을 꾸며 보는 건 어때?","심심할 땐 좋아하는 노래 틀어 봐! 요즘 뭐 들어?"]},{q:["오늘 어땠어","너는 오늘 어땠어","하루 어땠어"],a:["나는 너 기다리느라 좀 설렜어. 너는 오늘 어땠어?","평화로웠어! 너 오니까 더 좋아졌어. 너는?"]},{q:["다녀왔어","집에 왔어","퇴근했어","하교했어","갔다 왔어"],a:["어서 와! 오늘도 고생 많았어.","왔구나! 기다렸어. 오늘 별일 없었어?","수고했어! 이제 편하게 쉬자."]},{q:["다녀올게","나갔다 올게","출근할게","학교 갈게","갔다 올게"],a:["잘 다녀와! 조심해서 가.","다녀와! 돌아오면 얘기 많이 해 줘.","오늘도 파이팅! 기다리고 있을게."]},{q:["집에 가고 싶다","집에 가고 싶어","퇴근하고 싶다"],a:["조금만 더 버티자! 집에 오면 푹 쉬게 해 줄게.","마음이 벌써 집에 가 있구나. 거의 다 왔어!"]},{q:["청소했어","방 치웠어","빨래했어","설거지했어"],a:["우와, 부지런하다! 깨끗해진 방 보면 기분 좋지?","집안일까지 하다니 대단해. 이제 좀 쉬어!"]},{q:["학교 가기 싫어","학교 싫어","등교하기 싫다"],a:["가기 싫은 날도 있지. 오늘 하루만 같이 버텨 보자!","학교 끝나면 나랑 놀자. 그거 생각하면서 힘내!"]},{q:["시험","시험 봐","시험 기간","시험 공부","중간고사","기말고사"],a:["시험 준비하느라 고생 많아. 너 정말 열심히 하고 있어.","결과보다 네가 애쓴 게 더 중요해. 끝나면 맛있는 거 먹자!","긴장되지? 심호흡 한 번 하고, 너는 할 수 있어."]},{q:["공부하기 싫어","공부 싫어","숙제 하기 싫어","숙제"],a:["딱 10분만 해 보자! 시작이 제일 어렵대.","공부하기 싫은 날도 있어. 조금 하고 쉬는 것도 방법이야.","끝내고 나면 뿌듯할 거야. 옆에서 응원할게!"]},{q:["회사 가기 싫어","출근하기 싫어","일하기 싫어","야근","회사 힘들어"],a:["출근하기 싫은 날 있지… 오늘은 끝나고 꼭 너를 위한 시간 갖자.","일하느라 정말 고생 많아. 너 충분히 잘하고 있어.","야근이라니… 저녁은 꼭 챙겨 먹어!"]},{q:["월요일","월요병"],a:["월요일은 원래 힘들어. 천천히 시작하자!","월요병엔 맛있는 점심이 약이래!"]},{q:["금요일","불금","주말이다","주말"],a:["주말이다! 뭐 하고 놀 거야?","신난다! 이번 주도 정말 수고했어.","주말엔 푹 쉬기! 하고 싶은 거 있어?"]},{q:["합격했어","붙었어","성공했어","해냈어","칭찬 받았어"],a:["우와! 정말 축하해! 네가 애쓴 덕분이야.","대단하다! 오늘은 마음껏 기뻐하자!","역시 너야! 나까지 신나!"]},{q:["떨어졌어","불합격","실패했어","망했어","시험 망했어","시험 못 봤어","시험 망쳤어"],a:["속상하겠다… 그래도 네가 노력한 건 사라지지 않아.","괜찮아, 이번이 끝이 아니야. 오늘은 너를 토닥여 주자.","많이 아쉽지? 나는 여전히 너를 응원해."]},{q:["잘했지","나 잘했지","칭찬해줘","칭찬해 줘"],a:["응! 정말 잘했어. 최고야!","당연하지! 너 오늘 진짜 멋졌어.","잘했어, 잘했어! 쓰담쓰담."]},{q:["응원해줘","응원해 줘","힘내라고 해줘","파이팅 해줘"],a:["{n} 파이팅! 너는 할 수 있어!","내가 제일 크게 응원할게. 힘내!","넌 생각보다 훨씬 강해. 파이팅!"]},{q:["날씨 좋다","날씨 좋아","하늘 예쁘다","맑다"],a:["날씨 좋은 날엔 산책이 딱이지!","하늘 예쁜 날은 기분도 맑아져. 사진 찍었어?"]},{q:["비 와","비 온다","비가 와","비 오네"],a:["비 오는구나. 우산 챙겼어?","빗소리 들으면서 쉬는 것도 좋아. 따뜻하게 있어!"]},{q:["추워","춥다","너무 추워","눈 와","눈 온다"],a:["추우면 따뜻하게 입어! 감기 조심하고.","눈 온다니! 눈사람 만들고 싶다.","추운 날엔 따끈한 거 마시자."]},{q:["더워","덥다","너무 더워"],a:["덥지… 물 많이 마셔!","더울 땐 시원한 아이스크림이 최고야."]},{q:["크리스마스","메리 크리스마스"],a:["메리 크리스마스! 선물 받고 싶은 거 있어?","크리스마스엔 반짝반짝 트리 꾸미고 싶다!"]},{q:["새해","새해 복 많이 받아","해피 뉴이어"],a:["새해 복 많이 받아! 올해도 우리 같이 행복하자.","새해에는 좋은 일만 가득할 거야!"]},{q:["게임","게임했어","게임하자","롤","오락실"],a:["게임 좋지! 이겼어?","오쭈다월드 오락실도 재밌어. 당구 쳐 봤어?","게임할 땐 시간이 순식간에 가지!"]},{q:["영화","영화 봤어","드라마","넷플릭스","유튜브"],a:["재밌었어? 어떤 내용이야?","나도 같이 보고 싶다! 추천해 줘."]},{q:["노래","음악","노래 추천","노래 불러줘","노래 불러 줘"],a:["랄랄라~ 너를 위한 노래야!","음악 들으면 기분이 달라지지. 요즘 뭐 들어?","흥얼흥얼~ 같이 불러 줄래?"]},{q:["춤춰","춤 춰 줘","춤춰 줘"],a:["(빙글빙글) 이렇게? 너도 같이 추자!","신나는 노래 틀어 줘! 춤 출게!"]},{q:["책 읽었어","책","독서"],a:["책 읽는 너 멋지다! 무슨 책이야?","좋은 책은 마음을 따뜻하게 해 주지."]},{q:["그림
