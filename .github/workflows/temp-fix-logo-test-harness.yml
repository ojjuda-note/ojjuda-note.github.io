name: Fix Agit logo test harness

on:
  push:
    branches:
      - fix-agit-home-logo-20261104

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Update selector support
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('tests/festival-entry.test.cjs')
          text=path.read_text(encoding='utf-8')
          old="querySelector(selector){return selector==='iframe'?this.frame:selector==='button'?this.button:null;}"
          new="querySelector(selector){return selector==='iframe'?this.frame:(selector==='button'||selector==='.agit-home-link')?this.button:null;}"
          if text.count(old)!=1:
              raise SystemExit('festival fixture selector anchor not found')
          path.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit harness fix
        shell: bash
        run: |
          rm .github/workflows/temp-fix-logo-test-harness.yml
          git config user.name 'ojjuda-note'
          git config user.email 'mj830417@naver.com'
          git add tests/festival-entry.test.cjs .github/workflows/temp-fix-logo-test-harness.yml
          git commit -m 'Update festival fixture for Agit logo selector'
          git push origin HEAD:fix-agit-home-logo-20261104
