name: Solitaire arcade checks
on:
  pull_request:
    paths: ['games/solitaire/**', 'world-solitaire-game.js', 'world.html', 'world-game-assets.js', 'game-release.json', 'tests/solitaire-*.test.cjs', 'supabase/migrations/*_solitaire*.sql', 'tests/game-ranking-criteria-dom.test.cjs', 'tests/monthly-game-rankings-db.test.cjs', 'guest-game-scores.js', 'world-game-rankings.js', '.github/workflows/solitaire.yml']
  push:
    branches: [main]
    paths: ['games/solitaire/**', 'world-solitaire-game.js', 'world.html', 'world-game-assets.js', 'game-release.json', 'tests/solitaire-*.test.cjs', 'supabase/migrations/*_solitaire*.sql', 'tests/game-ranking-criteria-dom.test.cjs', 'tests/monthly-game-rankings-db.test.cjs', 'guest-game-scores.js', 'world-game-rankings.js', '.github/workflows/solitaire.yml']
permissions:
  contents: read
jobs:
  solitaire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm --prefix tests ci --ignore-scripts
      - run: node --test games/solitaire/test/*.test.mjs tests/solitaire-arcade.test.cjs tests/solitaire-ranking-visibility.test.cjs tests/game-assets-loading.test.cjs
      - run: node tests/solitaire-ranking-db.test.cjs
      - run: node tests/monthly-game-rankings-db.test.cjs
      - run: node tests/game-ranking-criteria-dom.test.cjs
      - run: node tests/game-release-refresh.test.cjs
