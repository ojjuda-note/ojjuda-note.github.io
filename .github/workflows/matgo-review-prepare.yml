name: Prepare reviewed Matgo update
on:
  push:
    branches: [fix/matgo-pibak-eight-20261010]
    paths: [ops/matgo-review-patch.json]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/matgo-pibak-eight-20261010
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply verified edits without retransmitting embedded assets
        run: python ops/apply-matgo-review.py
      - name: Install locked test dependencies
        run: npm --prefix tests ci --ignore-scripts --no-audit --no-fund
      - name: Check scoring, captured views and authoritative settlements
        run: |
          node tests/matgo-multipliers.test.mjs
          node tests/matgo-captured-zoom.test.mjs
          node tests/matgo-bonus.test.mjs
          node tests/matgo-difficulty.test.mjs
          node tests/matgo-first-ppuk.test.mjs
          node tests/matgo-stakes.test.cjs
          node tests/matgo-online.test.cjs
          node tests/matgo-parity.test.cjs
          git diff --check
      - name: Commit the exact reviewed tree to the preparation branch
        run: |
          MATGO_EXPECTED_TREE=$(python -c "import json; print(json.load(open('ops/matgo-review-patch.json'))['expected_tree'])")
          git add -A
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          MATGO_REVIEW_INDEX=$(mktemp)
          cp "$(git rev-parse --git-path index)" "$MATGO_REVIEW_INDEX"
          GIT_INDEX_FILE="$MATGO_REVIEW_INDEX" git update-index --force-remove .github/workflows/matgo-review-prepare.yml ops/apply-matgo-review.py ops/matgo-review-patch.json
          test "$(GIT_INDEX_FILE="$MATGO_REVIEW_INDEX" git write-tree)" = "$MATGO_EXPECTED_TREE"
          rm "$MATGO_REVIEW_INDEX"
          git -c user.name='ojjuda-note' -c user.email='334255691+ojjuda-note@users.noreply.github.com' commit -m 'Apply verified Matgo multipliers and captured-card long press'
          git push origin HEAD:fix/matgo-pibak-eight-20261010
