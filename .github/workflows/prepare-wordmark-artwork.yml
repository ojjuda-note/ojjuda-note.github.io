name: Prepare wordmark artwork on the feature branch

on:
  push:
    branches: ['codex/app-wordmark-icons-20261120']
    paths:
      - '.github/workflows/prepare-wordmark-artwork.yml'
      - 'ops/prepare-wordmark-font.py'
      - 'ops/render-wordmark-app-icons.py'

permissions:
  contents: write

concurrency:
  group: prepare-wordmark-artwork-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    if: github.ref == 'refs/heads/codex/app-wordmark-icons-20261120'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install rendering tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends inkscape imagemagick
          python -m pip install --disable-pip-version-check 'Pillow==13.0.0' 'fonttools==4.61.1'
      - name: Rebuild the reviewed wordmark sources and public icons
        run: |
          python ops/prepare-wordmark-font.py
          python ops/render-wordmark-app-icons.py
          node scripts/sync-section-versions.mjs
          node ops/build-seasonal-app-icons.mjs . --date 2026-11-20
      - name: Commit generated files to this feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- brand/app-icons apple-touch-icon.png icon-192.png icon-512.png icon-maskable-512.png index.html world.html manifest.webmanifest park/index.html park/manifest.webmanifest park/assets features/pajang/index.html features/pajang/station.html features/pajang/manifest.webmanifest features/pajang/assets shared/app-icons/current.json shared/pwa/app-identity.js shared/pwa/pwa-install.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Render seasonal Korean wordmark icons in the build environment'
          git push origin HEAD:refs/heads/codex/app-wordmark-icons-20261120
