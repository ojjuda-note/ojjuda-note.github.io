name: Sync reviewed game release with latest main
on:
  push:
    branches: [codex/shared-game-results-20261103]
    paths: [.github/workflows/game-results-sync.yml]
permissions:
  contents: write
jobs:
  sync:
    if: github.repository == 'ojjuda-note/ojjuda-note.github.io' && github.ref == 'refs/heads/codex/shared-game-results-20261103'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Merge exact reviewed source and verify complete tree
        shell: bash
        run: |
          python - <<'PY'
          import os, subprocess
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(['git',*args],text=True).strip()

          branch='codex/shared-game-results-20261103'
          old_head='a2a9603bbf7c7cb72bbe2de8d6aa80c054fa08b9'
          main='2b906bcb96794d7269b2324269d4e15db2912e46'
          expected_tree='f4bcb0536ebc862a502e2ed4f7bfbc207098d2bf'
          workflow='.github/workflows/game-results-sync.yml'
          assert os.environ['GITHUB_REPOSITORY']=='ojjuda-note/ojjuda-note.github.io'
          assert os.environ['GITHUB_REF']=='refs/heads/'+branch
          assert os.environ['GITHUB_EVENT_NAME']=='push'
          assert git('rev-parse','HEAD')==os.environ['GITHUB_SHA']
          assert git('rev-parse','HEAD^')==old_head
          assert git('ls-remote','origin','refs/heads/main').split()[0]==main
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          merged=subprocess.run(['git','merge','--no-commit','--no-ff',main])
          assert merged.returncode==1
          assert set(git('diff','--name-only','--diff-filter=U').splitlines())=={'game-release.json','world-game-assets.js','world.html'}
          for filename in ['game-release.json','world-game-assets.js','world.html']:
              p=Path(filename)
              lines=p.read_text().splitlines(keepends=True)
              result=[];i=0;count=0
              while i<len(lines):
                  if lines[i].startswith('<<<<<<< HEAD'):
                      divider=next(j for j in range(i+1,len(lines)) if lines[j].startswith('======='))
                      end=next(j for j in range(divider+1,len(lines)) if lines[j].startswith('>>>>>>>'))
                      result.extend(lines[i+1:divider]);count+=1;i=end+1
                  else:
                      result.append(lines[i]);i+=1
              assert count=={'game-release.json':1,'world-game-assets.js':3,'world.html':1}[filename],(filename,count)
              content=''.join(result)
              if filename=='world-game-assets.js':
                  for old,new in [("restaurants:'1.0.0'","restaurants:'1.1.0'"),('/world-restaurant-guide.js?v=20261103-restaurant-guide3','/world-restaurant-guide.js?v=20261103-restaurant-nearby1')]:
                      assert content.count(old)==1
                      content=content.replace(old,new)
              assert not any(line.startswith(('<<<<<<<','=======','>>>>>>>')) for line in content.splitlines())
              p.write_text(content)
          Path(workflow).unlink()
          subprocess.run(['git','add','--','game-release.json','world-game-assets.js','world.html',workflow],check=True)
          subprocess.run(['git','diff','--check','--cached'],check=True)
          assert git('write-tree')==expected_tree,'Merged tree differs from the locally reviewed tree'
          assert git('ls-remote','origin','refs/heads/'+branch).split()[0]==os.environ['GITHUB_SHA']
          subprocess.run(['git','commit','-m','Merge latest restaurant updates into reviewed game results'],check=True)
          assert git('rev-parse','HEAD^{tree}')==expected_tree
          assert git('rev-parse','HEAD^2')==main
          subprocess.run(['git','push','origin','HEAD:refs/heads/'+branch],check=True)
          print('Published reviewed merged tree '+expected_tree)
          PY
