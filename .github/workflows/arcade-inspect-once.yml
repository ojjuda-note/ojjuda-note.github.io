name: Arcade patch verification (temporary)

on:
  push:
    branches: [codex/arcade-exit-confirm-20261004]
    paths: [.github/workflows/arcade-inspect-once.yml]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Prepare isolated latest-main candidate
        run: |
          mkdir -p /tmp/arcade-patch/files/tests /tmp/arcade-tools
          cp tests/arcade-exit-ui.test.cjs .github/arcade-exit-patch.py /tmp/arcade-tools/
          git fetch --depth=1 origin main
          git checkout --detach FETCH_HEAD
          git rev-parse HEAD > /tmp/arcade-patch/base-commit.txt
          git rev-parse HEAD^{tree} > /tmp/arcade-patch/base-tree.txt
          cp /tmp/arcade-tools/arcade-exit-ui.test.cjs tests/
      - name: Install locked browser test dependencies
        run: |
          npm --prefix tests ci --ignore-scripts
          cd tests
          npx playwright install --with-deps chromium
      - name: Reproduce unguarded exit before patching
        run: |
          set +e
          node tests/arcade-exit-ui.test.cjs > /tmp/arcade-patch/baseline.txt 2>&1
          code=$?
          set -e
          cat /tmp/arcade-patch/baseline.txt
          test "$code" -ne 0
          grep -F 'active close asks once' /tmp/arcade-patch/baseline.txt
      - name: Apply only the exit guard and run focused regressions
        run: |
          python /tmp/arcade-tools/arcade-exit-patch.py .
          node tests/inline-scripts.test.cjs | tee /tmp/arcade-patch/syntax.txt
          node tests/arcade-exit-ui.test.cjs | tee /tmp/arcade-patch/focused.txt
      - name: Store immutable candidate blobs without changing any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,subprocess,urllib.request
          root=pathlib.Path('.')
          out=pathlib.Path('/tmp/arcade-patch')
          base=(out/'base-commit.txt').read_text().strip()
          manifest={'base_commit':base,'base_tree':(out/'base-tree.txt').read_text().strip(),'files':[]}
          for name in ['world.html','version.json','tests/package.json','tests/arcade-exit-ui.test.cjs']:
              data=(root/name).read_bytes()
              expected=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              payload=json.dumps({'content':data.decode('utf-8'),'encoding':'utf-8'}).encode()
              request=urllib.request.Request('https://api.github.com/repos/ojjuda-note/ojjuda-note.github.io/git/blobs',data=payload,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(request,timeout=30) as response:
                  result=json.load(response)
              assert result['sha']==expected,(name,result['sha'],expected)
              previous=subprocess.run(['git','rev-parse','--verify',base+':'+name],capture_output=True,text=True)
              manifest['files'].append({'path':name,'sha':expected,'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data),'previous_sha':previous.stdout.strip() if previous.returncode==0 else None})
              (out/'files'/name).write_bytes(data)
          manifest['version']=json.loads((root/'version.json').read_text())['version']
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print(json.dumps(manifest,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arcade-patch-verification
          path: /tmp/arcade-patch/
          retention-days: 1
          if-no-files-found: error
