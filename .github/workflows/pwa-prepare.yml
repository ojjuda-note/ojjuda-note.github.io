name: Prepare PWA entry files

on:
  push:
    branches: [codex/pwa-install-20261104]
    paths:
      - 'scripts/pwa-apply-entry.py'
      - '.github/workflows/pwa-prepare.yml'

permissions:
  contents: write

jobs:
  apply-verified-entry-patch:
    if: github.repository == 'ojjuda-note/ojjuda-note.github.io' && github.ref == 'refs/heads/codex/pwa-install-20261104'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/pwa-install-20261104
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply the checked entry patch without transferring the large HTML as text
        run: python3 scripts/pwa-apply-entry.py .
      - name: Check the resulting files
        run: |
          git diff --check
          node --check pwa-install.js
          node --check sw.js
          node tests/inline-scripts.test.cjs
      - name: Save only the prepared entry files on this work branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add world.html version.json
          git commit -m 'Wire PWA installation into the existing app'
          git push origin HEAD:refs/heads/codex/pwa-install-20261104
