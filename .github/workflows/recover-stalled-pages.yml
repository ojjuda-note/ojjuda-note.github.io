name: Recover stalled Pages deployment
on:
  push:
    branches: ['codex/recover-stalled-pages-20261106']
    paths: ['.github/workflows/recover-stalled-pages.yml']
permissions:
  contents: read
  pages: write
jobs:
  cancel-stale:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancel the superseded stalled Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/$GH_REPO/pages/deployments/4a0d8eb266aec6999b80ba971fadbd74cf66bd3d/status" --jq '.status'
          gh api --method POST "repos/$GH_REPO/pages/deployments/4a0d8eb266aec6999b80ba971fadbd74cf66bd3d/cancel"
          gh api "repos/$GH_REPO/pages/deployments/4a0d8eb266aec6999b80ba971fadbd74cf66bd3d/status" --jq '.status'
