name: Apply and verify adult game resume fix
on:
  push:
    branches: [codex/adult-games-resume-20261013]
    paths: [ops/apply-adult-resume.mjs]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/adult-games-resume-20261013
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply verified source edits
        run: node ops/apply-adult-resume.mjs
      - run: npm --prefix tests ci --ignore-scripts
      - working-directory: tests
        run: npx playwright install --with-deps chromium
      - name: Verify access and actual arcade controls
        run: |
          node tests/matgo-access.test.cjs
          node tests/adult-menu-visibility.test.cjs
          node tests/world-adult-resume.test.cjs
          node tests/world-matgo-visibility-ui.test.cjs
      - name: Commit verified application files
        run: |
          git diff --check
          git add world.html games/matgo.html games/matgo-online.html tests/package.json version.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Restore adult game menus after returning to the app'
          git push origin HEAD:codex/adult-games-resume-20261013
