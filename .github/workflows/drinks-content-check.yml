name: Verify drinking game content management
on:
  push:
    branches: [release/drinks-content-admin-20261114]
permissions:
  contents: read
jobs:
  browser:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        suite: [admin, play, local, hub, truth]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: node scripts/check-source-layout.mjs
      - run: npm ci --prefix tests --ignore-scripts --no-audit --no-fund
      - run: node tests/qa-content-${{ matrix.suite }}.cjs
        env:
          BROWSER_PATH: /usr/bin/google-chrome
