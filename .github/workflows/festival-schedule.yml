name: Festival schedule checks
on:
  pull_request:
    paths:
      - 'games/festival-schedule/**'
      - 'world-festival-schedule.*'
      - 'shared/games/world-game-assets.js'
      - 'game-release.json'
      - 'world.html'
      - 'tests/festival-*'
      - '.github/workflows/festival-schedule.yml'
  push:
    branches: [main]
    paths:
      - 'games/festival-schedule/**'
      - 'world-festival-schedule.*'
      - 'shared/games/world-game-assets.js'
      - 'game-release.json'
      - 'world.html'
      - 'tests/festival-*'
      - '.github/workflows/festival-schedule.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: festival-schedule-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Festival data, calendar and test entry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node games/festival-schedule/validate.mjs
      - run: node tests/festival-core.test.mjs
      - run: npm --prefix tests ci --ignore-scripts
      - run: node --test tests/festival-app-dom.test.cjs
      - run: node tests/festival-entry.test.cjs
      - run: node tests/game-release-refresh.test.cjs
      - run: node --check games/festival-schedule/app.js
