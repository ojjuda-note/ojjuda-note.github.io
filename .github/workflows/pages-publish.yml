name: Publish lightweight Pages site

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!tests/**'
      - '!scripts/**'
      - '!supabase/**'
      - '!ops/**'
      - '!docs/**'
      - '!AGENTS.md'
      - '!README.md'
      - '!.gitignore'
      - '!_config.yml'
      - 'scripts/build-fanpage-hub.mjs'
      - 'scripts/build-park-backgrounds.py'
      - 'scripts/build-park-ink-washes.py'
      - 'scripts/build-short-links.mjs'
      - 'ops/build-seasonal-app-icons.mjs'
  pull_request:
    paths:
      - '.github/workflows/pages-publish.yml'
      - 'note/vendor/**'
      - 'scripts/build-fanpage-hub.mjs'
      - 'tests/fanpage-hub-transfer.cjs'
      - 'scripts/build-short-links.mjs'
      - 'shared/navigation/short-link.js'
      - 'shared/navigation/short-links.json'
      - 'tests/short-links.test.mjs'
      - 'sitemap.html'
      - 'ops/build-seasonal-app-icons.mjs'
      - 'brand/app-icons/seasonal/**'
      - 'shared/app-icons/**'
      - 'shared/pwa/**'
      - 'tests/app-icon-calendar.test.mjs'
      - 'tests/seasonal-app-icons-build.test.mjs'
  schedule:
    # 00:00 Asia/Seoul. GitHub may start scheduled jobs after the requested minute.
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-preview-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify short addresses and complete drinking-game navigation
        run: node --test tests/short-links.test.mjs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Build locked Park video libraries
        run: |
          npm --prefix note/vendor ci --ignore-scripts --no-audit --no-fund
          npm --prefix note/vendor run build
          git diff --exit-code -- note/vendor/manifest.json
      - name: Stage only public website files
        shell: bash
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/ojjuda-public"
          mkdir -p "$site"
          rsync -a \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='node_modules/' \
            --exclude='/tests/' \
            --exclude='/scripts/' \
            --exclude='/supabase/' \
            --exclude='/ops/' \
            --exclude='/docs/' \
            --exclude='/AGENTS.md' \
            --exclude='/README.md' \
            --exclude='/.gitignore' \
            --exclude='/_config.yml' \
            "$GITHUB_WORKSPACE/" "$site/"
          node scripts/sync-section-versions.mjs "$site"
          node scripts/build-short-links.mjs "$site"
          touch "$site/.nojekyll"
          for required in CNAME index.html world.html park/index.html note/index.html sw.js config.js version.json note/vendor/mediabunny-1.66.2.mjs note/vendor/mediabunny-aac-encoder-1.66.2.mjs note/vendor/tus-js-client-4.3.1.mjs; do
            if [[ ! -s "$site/$required" ]]; then
              echo "Missing required public file: $required" >&2
              exit 1
            fi
          done
          if [[ "$(tr -d '\r\n' < "$site/CNAME")" != 'ojjuda.kr' ]]; then
            echo 'Unexpected custom domain in staged site' >&2
            exit 1
          fi
          echo 'Public site size and file count:'
          du -sh "$site"
          find "$site" -type f | wc -l
      - name: Stage gated teen community bundle separately from adult member program
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix features/pajang ci --ignore-scripts --no-audit --no-fund
          npm --prefix features/pajang run build:teen
          site="$RUNNER_TEMP/ojjuda-public/features/pajang/assets"
          test -s features/pajang/assets/teen.js
          test -s features/pajang/assets/teen.css
          mkdir -p "$site"
          cp features/pajang/assets/teen.js "$site/teen.js"
          cp features/pajang/assets/teen.css "$site/teen.css"
      - name: Restore aggregate Janggi opening counts
        id: openings
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ojjuda-public/games/janggi/openings-20261115.json
          key: janggi-openings-${{ hashFiles('scripts/build-janggi-openings.mjs', 'games/janggi/opening-book.mjs', 'games/janggi/worker-rules.mjs', 'games/janggi/search-rules.mjs', 'games/janggi/neural-player.mjs') }}
      - name: Read the pinned source records for the opening statistics
        if: steps.openings.outputs.cache-hit != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: aunsiels/alphazero_janggi
          ref: 5884af5bd94aaade2d078528233349fe2f4205d3
          path: janggi-corpus
          sparse-checkout: data
          persist-credentials: false
      - name: Stage the aggregate opening counts
        if: steps.openings.outputs.cache-hit != 'true'
        run: node scripts/build-janggi-openings.mjs janggi-corpus/data "$RUNNER_TEMP/ojjuda-public/games/janggi"
      - name: Restore pinned Janggi engine files
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ojjuda-public/games/janggi/fairy-4d4b393-9991472750de
          key: janggi-engine-${{ hashFiles('scripts/stage-janggi-engine.py') }}
      - name: Stage the Janggi engine, trained network and corresponding sources
        run: |
          python scripts/stage-janggi-engine.py "$RUNNER_TEMP/ojjuda-public"
          node tests/janggi-engine-smoke.cjs "$RUNNER_TEMP/ojjuda-public"
      - name: Restore freely licensed fan photos
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ojjuda-fan-photo-cache
          key: fan-commons-webp-v1-${{ hashFiles('features/fanpages/artists.js', 'features/fanpages/artists-extra.js') }}
          restore-keys: fan-commons-webp-v1-
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Stage authorized Wikimedia photos as local WebP
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet --disable-pip-version-check 'Pillow==11.3.0'
          python scripts/mirror-fanpage-commons.py \
            --source features/fanpages/artists.js \
            --source features/fanpages/artists-extra.js \
            --cache "$RUNNER_TEMP/ojjuda-fan-photo-cache" \
            --output "$RUNNER_TEMP/ojjuda-public/features/fanpages"
      - name: Build fanpage hub summaries from staged artist data
        run: node scripts/build-fanpage-hub.mjs "$RUNNER_TEMP/ojjuda-public/features/fanpages"
      - name: Build the app icons for today's Korean calendar date
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v magick >/dev/null && ! command -v convert >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends imagemagick
          fi
          node --test tests/app-icon-calendar.test.mjs tests/seasonal-app-icons-build.test.mjs
          node ops/build-seasonal-app-icons.mjs "$RUNNER_TEMP/ojjuda-public"
      - name: Compare cold mobile hub and detail navigation
        if: github.event_name == 'pull_request'
        run: |
          npm --prefix tests ci --ignore-scripts
          node tests/fanpage-hub-transfer.cjs "$RUNNER_TEMP/ojjuda-public"
      - name: Build responsive Park card backgrounds
        run: python scripts/build-park-backgrounds.py "$RUNNER_TEMP/ojjuda-public"
      - name: Package Pages with Android domain association
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/ojjuda-public"
          tar --dereference --hard-dereference --directory "$site" \
            -cf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git --exclude=.github --exclude=".[^/]*" .
          tar --directory "$site" -rf "$RUNNER_TEMP/artifact.tar" .well-known .nojekyll
          tar -tf "$RUNNER_TEMP/artifact.tar" | grep -Fx '.well-known/assetlinks.json'
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy using the supported Pages deadline
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          # deploy-pages@v5 caps larger values to 600000 ms.
          timeout: 600000
