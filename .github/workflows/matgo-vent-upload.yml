name: Transfer verified Matgo artwork and edits
on:
  push:
    branches: [codex/matgo-vent-art-20261013]
    paths: [ops/matgo-vent-v2.patch]
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/matgo-vent-art-20261013
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply text edits and transfer original PNG bytes
        env:
          ART_URL: https://d2ol7oe51mr4n9.cloudfront.net/user_3IxANoqRL1uMNs5GRgxqpniGdas/375c8e5c-076e-4c31-8f81-126c317e62cb.zip
        run: |
          python - <<'PY'
          import os, json, hashlib, urllib.request, zipfile, subprocess
          from pathlib import Path
          manifest=json.loads(Path('ops/matgo-vent-v2-manifest.json').read_text())
          subprocess.run(['git','apply','--check','ops/matgo-vent-v2.patch'],check=True)
          subprocess.run(['git','apply','ops/matgo-vent-v2.patch'],check=True)
          archive=Path('/tmp/matgo-vent-art.zip')
          urllib.request.urlretrieve(os.environ['ART_URL'],archive)
          assert hashlib.sha256(archive.read_bytes()).hexdigest()=='cb64a841574c5a0fbbb8af50c1187d083a01acbdcdbc6dac76f4c9df96b562d0'
          with zipfile.ZipFile(archive) as z:
              expected={f'games/assets/matgo-vent/{name}.png' for name in ['gun','hammer','glove','bomb']}
              assert set(z.namelist())==expected
              for name in sorted(expected):
                  raw=z.read(name)
                  assert hashlib.sha256(raw).hexdigest()==manifest[name]
                  dest=Path(name);dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(raw)
          for name,digest in manifest.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest,name
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--']+[f for f in manifest if not f.startswith('.github/')],check=True)
          subprocess.run(['git','commit','-m','Apply Matgo detailed vent art, original audio and wider card spacing'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/codex/matgo-vent-art-20261013'],check=True)
          PY
      - name: Install locked test dependencies
        run: npm --prefix tests ci --ignore-scripts
      - name: Install test browser
        working-directory: tests
        run: npx playwright install --with-deps chromium
      - name: Verify artwork and actual sound
        run: node tests/matgo-vent-effects-ui.test.cjs
      - name: Verify solo layout and paid controls
        if: ${{ !cancelled() }}
        run: node tests/matgo-ui.test.cjs
      - name: Save actual game screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: matgo-vent-proof
          path: |
            /tmp/matgo-vent-proof
            /tmp/matgo-tazza-controls.png
          retention-days: 3
