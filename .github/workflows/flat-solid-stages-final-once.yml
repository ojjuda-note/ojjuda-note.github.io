name: Finalize flat screw with newest stage selector
on:
  push:
    branches: [fix/flat-visible-fastener-collisions-20261105]
    paths: [.github/workflows/flat-solid-stages-final-once.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Apply and verify large HTML patch
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),{execFileSync}=require('child_process');
          function once(source,needle,replacement,label){
            const n=source.indexOf(needle);if(n<0||source.indexOf(needle,n+needle.length)>=0)throw Error(label+' must appear once');
            return source.replace(needle,replacement);
          }
          let world=fs.readFileSync('world.html','utf8');
          world=once(world,'/world-game-assets.js?v=20261105-screw-stage-top1','/world-game-assets.js?v=20261105-flat-solid-stages2','game revision');
          const anchor='var worldRecommendedRestaurants=null,worldRecommendedClient=null;';
          world=once(world,anchor,'// Flat-screw physics has passed puzzle checks; keep the box variant closed separately.\n_r.screw.maintenance=null;\n'+anchor,'flat entry');
          const oldGate=world.split('\n').find(line=>line.includes('if(t==="screw"&&_r.screw.maintenance&&!worldScrewAdminTestEnabled())'));
          if(!oldGate)throw Error('old maintenance gate missing');
          world=once(world,oldGate,' if(t==="screw"&&options.screwMode==="box"&&!worldScrewAdminTestEnabled()){M(\'나사 풀기 박스형은 공사중이에요. 평면형을 이용해 주세요.\');return;}','mode gate');
          const oldRank="screw_box:{name:'나사풀기 · 박스형',unit:'점',maintenance:_r.screw.maintenance},screw_flat:{name:'나사풀기 · 평면형',unit:'점',maintenance:_r.screw.maintenance},spot:_r.spot,";
          const newRank="screw_box:{name:'나사풀기 · 박스형',unit:'점',maintenance:'공사중'},screw_flat:{name:'나사풀기 · 평면형',unit:'점'},spot:_r.spot,";
          world=once(world,oldRank,newRank,'ranking');
          fs.writeFileSync('world.html',world);
          const sha=execFileSync('git',['hash-object','world.html'],{encoding:'utf8'}).trim();
          if(sha!=='320ce5bebb6018cac50a725df02a75be8f99b367')throw Error('unexpected page hash: '+sha);
          NODE
      - name: Commit HTML release and remove the one-time workflow
        run: |
          git config user.name ojjuda-release
          git config user.email ojjuda-release@users.noreply.github.com
          git add world.html
          git rm .github/workflows/flat-solid-stages-final-once.yml
          git commit -m "Finalize flat screw release alongside newest stage selector"
          git push origin HEAD:refs/heads/fix/flat-visible-fastener-collisions-20261105
