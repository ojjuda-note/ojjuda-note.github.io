name: Backfill private group photo previews once

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Create private WebP sidecars (off = counts only)'
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: ojjuda-private-group-preview-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned server-only dependencies
        run: python -m pip install -r ops/backup-requirements.txt 'Pillow==11.3.0'
      - name: Check preview conversion and storage safety
        run: python -m unittest discover -s tests -p 'test_group_media_preview_backfill.py'
      - name: Preview pending count or perform one-time backfill
        shell: bash
        env:
          SUPABASE_PROJECT_REF: ziezbdjofcugznowiuda
          SUPABASE_REGION: ap-northeast-2
          SUPABASE_DB_URL: ${{ secrets.BACKUP_SUPABASE_DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.BACKUP_SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_POOLER_HOST: aws-0-ap-northeast-2.pooler.supabase.com
          SUPABASE_S3_ACCESS_KEY: ${{ secrets.BACKUP_SUPABASE_S3_ACCESS_KEY }}
          SUPABASE_S3_SECRET_KEY: ${{ secrets.BACKUP_SUPABASE_S3_SECRET_KEY }}
        run: |
          if [[ '${{ inputs.apply }}' == 'true' ]]; then
            python ops/group_media_preview_backfill.py --apply
          else
            python ops/group_media_preview_backfill.py
          fi
