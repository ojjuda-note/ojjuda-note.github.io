name: Stage pinned Pajang member program

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pajang-member-stage.yml'
      - 'supabase/functions/pajang-assets/index.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ojjuda-pajang-member-release
  cancel-in-progress: false

jobs:
  stage:
    if: github.repository == 'ojjuda-note/ojjuda-note.github.io' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build protected program from pinned dependencies
        run: |
          npm --prefix features/pajang ci --ignore-scripts --no-audit --no-fund
          npm --prefix features/pajang run build
      - name: Report digest and check manifest
        id: digest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, os, re
          from pathlib import Path
          program = Path('features/pajang/assets/station.js').read_bytes()
          source = Path('supabase/functions/pajang-assets/index.ts').read_text()
          sha = hashlib.sha256(program).hexdigest()
          match = re.findall(r'^\s*"station\.js"\s*:\s*"([0-9a-f]{64})"\s*,?\s*$', source, re.M)
          if not (0 < len(program) <= 1048576 and len(match) == 1):
              raise SystemExit('Invalid protected program or manifest')
          print('Built protected member program SHA256:', sha)
          pinned = str(sha == match[0]).lower()
          print('Digest pinned in manifest:', pinned)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('pinned=' + pinned + '\n')
          PY
      - name: Install storage client
        if: steps.digest.outputs.pinned == 'true'
        run: python -m pip install --disable-pip-version-check 'boto3==1.39.0'
      - name: Verify current manifest and stage immutable private program
        if: steps.digest.outputs.pinned == 'true'
        shell: bash
        env:
          SUPABASE_S3_ACCESS_KEY: ${{ secrets.BACKUP_SUPABASE_S3_ACCESS_KEY }}
          SUPABASE_S3_SECRET_KEY: ${{ secrets.BACKUP_SUPABASE_S3_SECRET_KEY }}
        run: |
          set -euo pipefail
          manifest='supabase/functions/pajang-assets/index.ts'
          git fetch --depth=1 origin main
          git show "FETCH_HEAD:$manifest" > "$RUNNER_TEMP/pajang-main-manifest.ts"
          if ! cmp -s "$manifest" "$RUNNER_TEMP/pajang-main-manifest.ts"; then
            echo 'A newer release manifest is on main, refusing to stage stale program.'
            exit 1
          fi
          python ops/publish-pajang-program.py
          echo 'Private bytes staged and verified; Edge manifest activation is separate.' >> "$GITHUB_STEP_SUMMARY"
