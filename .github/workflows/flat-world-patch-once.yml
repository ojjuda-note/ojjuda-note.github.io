# Temporary release bridge: apply the small, reviewed HTML patch on GitHub.
# The full 500 KiB page stays in the repository and is never sent as text.
name: Apply flat screw world entry patch
on:
  push:
    branches:
      - fix/flat-visible-fastener-collisions-20261105
    paths:
      - .github/flat-screw-world.patch
permissions:
  contents: write
jobs:
  apply-page-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Apply verified small patch
        run: |
          git apply --check .github/flat-screw-world.patch
          git apply .github/flat-screw-world.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add world.html
          git commit -m "Release verified flat screw entry without changing box preview"
          git push origin "HEAD:${GITHUB_REF_NAME}"
