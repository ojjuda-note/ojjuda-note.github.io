name: Fanpage pending update audit
on:
  push:
    branches: ['fanpages/apply-all-20261114']
    paths: ['.github/workflows/fanpage-apply-all-audit.yml']
permissions:
  contents: write
  actions: read
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: fanpages/apply-all-20261114
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Reconcile verified sponsorship and exact current lobby test contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/poker-arcade-dom.test.cjs');s=p.read_text()
          assert "if(name==='arcade_extra_rooms')" in s
          s=s.replace("if(name==='arcade_extra_rooms')","if(name==='arcade_general_extra_rooms')")
          anchor=' try{\n  const a=world'
          assert anchor in s
          setup=''' try{
            // Exercise the shipped general lobby RPC, not its retired predecessor.
            // This single-game fixture supplies empty neighbouring game feeds;
            // poker room visibility and the complete production wrapper remain real SQL.
            const migration=fs.readFileSync(path.join(root,'supabase/migrations/20261113173134_shared_drinking_room_and_game_handoff.sql'),'utf8');
            const start=migration.indexOf('create function public.arcade_general_extra_rooms()');
            assert.ok(start>=0,'shipped general lobby RPC is present');
            await f.db.exec(`create schema ojjuda_bang_internal;create schema ojjuda_roulette_internal;
              create function ojjuda_bang_internal.arcade_rooms() returns jsonb language sql as $$select '{"rooms":[]}'::jsonb$$;
              create function ojjuda_roulette_internal.arcade_rooms() returns jsonb language sql as $$select '{"rooms":[]}'::jsonb$$;
              grant usage on schema ojjuda_bang_internal,ojjuda_roulette_internal to authenticated;`+migration.slice(start));
            const a=world'''
          p.write_text(s.replace(anchor,setup,1))
          p=Path('features/fanpages/artists-extra.js');s=p.read_text();begin=s.index("id: 'stayc'");end=s.index('\n    },',begin);part=s[begin:end]
          item="{ kind: '콜라보', date: '2025.07.21', title: '태국관광청(TAT) × Kimpton Maa-Lai Bangkok', sub: 'I WANT IT 공식 뮤직비디오 협찬 · 광고 모델 계약과 별개', href: 'https://www.youtube.com/watch?v=W8ml4ryPwic' }"
          assert 'W8ml4ryPwic' not in part or '태국관광청' not in part
          if '      campaigns: [' in part: part=part.replace('      campaigns: [','      campaigns: [\n        '+item+',',1)
          else:
            assert '      news: [' in part
            part=part.replace('      news: [','      campaigns: [\n        '+item+'\n      ],\n      news: [',1)
          p.write_text(s[:begin]+part+s[end:])
          Path('ops/fanpage-integration-20261114.md').write_text('''# Fanpage pending updates integration — 2026-11-14
          
          User explicitly authorized applying all pending fanpage updates. The regular hourly rotation and all automation schedules are unchanged.
          
          ## Reconciled pull requests
          913, 915, 919, 929, 939, 940, 947, 948, 951, 999, 1017, 1019, 1033, 1034, 1035, 1037, 1040, 1043, 1045, 1046, 1051, 1053.
          
          The first nine PRs overlap subsequent main updates. Preserve newer official announcement dates, verified birthdays, complete album track lists, venue corrections, event end dates and closed preorder notices. Do not restore expired Vancouver performances, inferred personal values, or unverified RIIZE DICON notice 14906. Unverified entries are not reported as applied.
          
          The later 13 PR deltas are integrated at their reviewed, pinned heads. Independent SEVENTEEN/RIIZE profile additions are both preserved. The video validator now requires all 30 existing artists, including Stray Kids; ID/duplicate/privacy/source assertions are unchanged.
          
          Missing verified earlier facts retained: KiiiKiii × New Era; BOYNEXTDOOR LG U+ announcement/ambassadorship and Golden Disc awards; STAYC I WANT IT official-video sponsorship by Tourism Authority of Thailand and Kimpton Maa-Lai Bangkok (2025-07-21).
          
          ## Previously blocking tests
          Existing drinking-prompt admin menus were absent from two exact expected-menu lists. Add their existing labels/IDs without dropping any assertion. Poker's World fixture handled the retired arcade_extra_rooms call; update it to the actual arcade_general_extra_rooms RPC and load that exact shipped SQL wrapper. Empty neighbouring-game feeds isolate the poker test; real poker SQL, adult gating, room counts, create/join/cancel and ranking assertions remain intact. No production game/admin logic or version is changed.
          
          ## Source evidence
          - https://www.youtube.com/watch?v=W8ml4ryPwic — official STAYC video sponsorship description and upload date.
          - https://m.lguplus.com/about/ko/corporation/promotion/press-kit/detail?atclNo=2000001561&pageNo=1&srchCond=titCon — official BOYNEXTDOOR LG U+ announcement.
          - https://enews.imbc.com/News/RetrieveNewsInfo/490432 — BOYNEXTDOOR Golden Disc awards.
          - https://www.bntnews.co.kr/article/view/bnt202602130181 — New Era collaboration.
          
          ## Release gate
          Profile/video/syntax/source-layout checks and 160 fanpage tests passed on the integrated data before the final fixture adjustment. All required PR checks, real mobile/photo checks, Pages publishing and deployed-file comparison must pass before reporting deployment complete. The release PR and Actions runs hold final execution evidence.
          ''')
          PY
      - name: Install locked dependencies and browser
        run: |
          npm --prefix tests ci --ignore-scripts
          cd tests && npx playwright install --with-deps chromium
      - name: Verify the exact retained assertions
        run: |
          node features/fanpages/check-profiles.mjs
          node features/fanpages/check-videos.mjs
          node tests/admin-menu-groups.test.cjs
          node tests/admin-navigation-ui.test.cjs
          npm --prefix tests run test:poker
          npm --prefix tests run test:fanpages
          git diff --check
      - name: Save verified changes and remove one-off integration machinery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/poker-arcade-dom.test.cjs features/fanpages/artists-extra.js ops/fanpage-integration-20261114.md
          git rm scripts/fanpage-pending-integration.py .github/workflows/fanpage-apply-all-audit.yml
          git commit -m 'test(fanpages): verify pending integration against current admin and lobby contracts'
          git push origin HEAD:fanpages/apply-all-20261114
