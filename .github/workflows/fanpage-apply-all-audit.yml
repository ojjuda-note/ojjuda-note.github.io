name: Fanpage pending update audit
on:
  push:
    branches: ['fanpages/apply-all-20261114']
    paths: ['.github/workflows/fanpage-apply-all-audit.yml']
permissions:
  contents: write
  pull-requests: read
  actions: read
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: fanpages/apply-all-20261114
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Preserve concurrent main changes and integrate pinned fanpage deltas
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
          python3 scripts/fanpage-pending-integration.py
          node features/fanpages/check-profiles.mjs
          node features/fanpages/check-videos.mjs
          for f in features/fanpages/artists.js features/fanpages/artists-extra.js features/fanpages/profiles.js features/fanpages/profiles-extra.js features/fanpages/videos.js; do node --check "$f"; done
          node scripts/check-source-layout.mjs
          git diff --check
          git add features/fanpages/artists.js features/fanpages/artists-extra.js features/fanpages/profiles.js features/fanpages/profiles-extra.js features/fanpages/videos.js features/fanpages/check-videos.mjs features/fanpages/artist.html features/fanpages/index.html tests/admin-menu-groups.test.cjs tests/admin-navigation-ui.test.cjs
          git commit -m 'feat(fanpages): integrate reviewed pending updates without reverting newer corrections'
          git push origin HEAD:fanpages/apply-all-20261114
      - name: Install locked dependencies and browser
        run: |
          npm --prefix tests ci --ignore-scripts
          cd tests && npx playwright install --with-deps chromium
      - name: Run focused fanpage and baseline blocker checks
        run: |
          node tests/admin-menu-groups.test.cjs
          node tests/admin-navigation-ui.test.cjs
          node tests/multiplayer-ranking-bridges.test.cjs
          node --test tests/admin-fortune-purchases*.test.cjs
          npm --prefix tests run test:fanpages
          npm --prefix tests run test:poker
      - name: Save integration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fanpage-integration-evidence
          path: |
            /tmp/fanpage-integration-report.json
            tests/artifacts/
          retention-days: 7
