name: Verify friend notes and automatic themes
on:
  push:
    branches: [codex/friend-notes-auto-themes]
    paths-ignore: ['world.html']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply reviewed World changes
        run: python ops/apply-friend-messages.py
      - name: Install test dependencies
        run: |
          npm --prefix tests ci --ignore-scripts
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Install test browser
        working-directory: tests
        run: npx playwright install --with-deps chromium
      - name: Verify message permissions and calendar behavior
        run: |
          node tests/friend-messages-db.test.cjs
          node tests/world-themes.test.cjs
          node tests/world-friend-settings.test.cjs
          node tests/world-three-menus.test.cjs
          node tests/inline-scripts.test.cjs
      - name: Verify mobile and desktop behavior
        env:
          FRIEND_MESSAGE_PROOF_DIR: /tmp/friend-message-proof/messages
          WORLD_DESIGN_PROOF_DIR: /tmp/friend-message-proof/world
          OJJUDA_COPY_PROOF_DIR: /tmp/friend-message-proof/park
        run: |
          test_status=0
          for test in friend-messages-ui world-design-ui park-note-chat-ui admin-navigation-ui my-menu-ui world-game-back-ui; do
            node "tests/$test.test.cjs" || test_status=1
          done
          git diff --check
          exit "$test_status"
      - name: Save screenshots for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: friend-message-proof
          path: /tmp/friend-message-proof
          retention-days: 3
      - name: Commit verified sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Add friend notes and administrator review, automate themes and simplify card detail'
            git push origin HEAD:refs/heads/codex/friend-notes-auto-themes
          fi
