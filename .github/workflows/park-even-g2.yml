name: Stage verified Park G2 installation
on:
  push:
    branches: ['build/park-g2-install-1.0.1']
    paths: ['.github/workflows/park-even-g2.yml']
permissions:
  actions: read
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Stage the checked v1.0.1 package on the build branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in {1..80}; do
            state=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/45598730283" --jq '.status')
            if [ "$state" = completed ]; then break; fi
            sleep 3
          done
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/45598730283" --jq '.conclusion')" = success
          mkdir -p park-even-install
          gh run download 45598730283 --name ojjuda-park-even-g2 --dir park-even-install
          (cd park-even-install && sha256sum ojjuda-park.ehpk > SHA256SUMS)
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add park-even-install
          git commit -m 'Stage tested Ojjuda Park beta 1.0.1 for upload'
          git push origin HEAD:build/park-g2-install-1.0.1
