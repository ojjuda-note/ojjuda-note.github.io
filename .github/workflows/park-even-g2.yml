name: Stage verified Park G2 installation
on:
  push:
    branches: ['build/park-g2-install-1.0.0']
    paths: ['.github/workflows/park-even-g2.yml']
permissions:
  actions: read
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Stage the verified v1.0.0 package on this build branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p park-even-install
          gh api repos/"$GITHUB_REPOSITORY"/actions/artifacts/15011921979/zip > "$RUNNER_TEMP/install.zip"
          echo "96b7cc3109e3119dc40fbd35a02fc654016cbfbabb12d442dc7d921f6b1eae79  $RUNNER_TEMP/install.zip" | sha256sum --check
          unzip -j "$RUNNER_TEMP/install.zip" ojjuda-park.ehpk -d park-even-install
          (cd park-even-install && sha256sum ojjuda-park.ehpk > SHA256SUMS)
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add park-even-install
          git commit -m 'Stage verified Ojjuda Park G2 1.0.0 installation'
          git push origin HEAD:build/park-g2-install-1.0.0
