name: Package Park for Even G2
on:
  workflow_dispatch:
  push:
    branches: [build/park-g2-live-1.3.0]
    paths:
      - 'note/even-app/**'
      - 'note/glasses*'
      - 'tests/park-g2-voice.test.mjs'
      - 'tests/park-g2-link.test.mjs'
      - 'park/g2-connect.*'
      - 'supabase/functions/park-g2-voice/**'
      - 'note/rokid-agent/lib/speed.js'
      - 'tests/park-glasses-speed.test.cjs'
      - 'note/vendor/package*.json'
      - 'park/glasses.html'
      - 'shared/location/location.js'
      - 'scripts/build-park-even-app.mjs'
      - '.github/workflows/park-even-g2.yml'
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Build the installable Park app
        run: |
          set -euo pipefail
          npm --prefix note/vendor ci --ignore-scripts --no-audit --no-fund
          npm --prefix note/vendor run build
          tools="$RUNNER_TEMP/even-tools"
          npm install --prefix "$tools" --no-audit --no-fund --save-exact @evenrealities/evenhub-cli@0.2.0 @supabase/supabase-js@2.117.2
          node scripts/build-park-even-app.mjs "$RUNNER_TEMP/even-dist" "$tools"
          node --test tests/park-even-g2.test.cjs tests/park-glasses-speed.test.cjs tests/park-g2-voice.test.mjs tests/park-g2-link.test.mjs
          # Use a real file origin, as on a phone. The SDK must load before any native bridge exists.
          google-chrome --headless --disable-gpu --no-sandbox --disable-dev-shm-usage \
            --host-resolver-rules="MAP * ~NOTFOUND" --virtual-time-budget=14000 --dump-dom \
            "file://$RUNNER_TEMP/even-dist/index.html" > "$RUNNER_TEMP/even-dom.html"
          grep 'id="g2-status"' "$RUNNER_TEMP/even-dom.html"
          grep -Eq 'id="g2-status"[^>]*>[^<]*[(](BRIDGE|DISPLAY(-[0-9]+)?)[)]' "$RUNNER_TEMP/even-dom.html"
          grep -Eq 'id="g2-reconnect"[^>]*>안경 다시 연결' "$RUNNER_TEMP/even-dom.html"
          if grep -Eq 'id="g2-reconnect"[^>]*hidden' "$RUNNER_TEMP/even-dom.html"; then exit 1; fi
          "$tools/node_modules/.bin/evenhub" pack note/even-app/app.json "$RUNNER_TEMP/even-dist" --sdk-ver 0.0.16 -o "$RUNNER_TEMP/ojjuda-park.ehpk"
          test -s "$RUNNER_TEMP/ojjuda-park.ehpk"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ojjuda-park-even-g2
          path: ${{ runner.temp }}/ojjuda-park.ehpk
          compression-level: 0
          if-no-files-found: error
      - name: Stage verified installer and synthetic Korean voice sample
        run: |
          set -euo pipefail
          node scripts/sync-section-versions.mjs
          mkdir -p park-even-install
          cp "$RUNNER_TEMP/ojjuda-park.ehpk" park-even-install/
          (cd park-even-install && sha256sum ojjuda-park.ehpk > SHA256SUMS)
          if ! command -v espeak-ng >/dev/null; then sudo apt-get -qq update && sudo apt-get -qq install -y espeak-ng; fi
          espeak-ng -v ko -s 145 -w "$RUNNER_TEMP/g2-question.wav" "안녕하세요. 저는 지금 공원에서 산책하고 있어요. 산책할 때 물을 얼마나 마시면 좋을까요?"
          /usr/bin/python3 - <<'PY'
          import audioop, wave, pathlib, os
          with wave.open(os.environ['RUNNER_TEMP']+'/g2-question.wav') as wav:
              assert wav.getsampwidth()==2 and wav.getnchannels()==1
              data,_=audioop.ratecv(wav.readframes(wav.getnframes()),2,1,wav.getframerate(),16000,None)
          pathlib.Path('park-even-install/synthetic-ko.pcm').write_bytes(data)
          PY
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -- world.html park-even-install
          git commit -m "Stage tested G2 1.3.0 installer and synthetic speech fixture"
          git push origin HEAD:build/park-g2-live-1.3.0
