name: Fix Byeolcheonji browser guide preference

on:
  push:
    branches:
      - fix-byeolcheonji-browser-guide-preference-20261104

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply browser guide preference behavior
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:120]!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          index = Path('byeolcheonji/index.html')
          html = index.read_text(encoding='utf-8')
          old_controls = '''      <p class="browser-guide-note">카카오톡에서는 우측 상단 ⋮ → 다른 브라우저로 열기를 눌러 주세요.</p>
      <button id="browser-guide-confirm" type="button" class="primary">확인</button>'''
          new_controls = '''      <p class="browser-guide-note">카카오톡에서는 우측 상단 ⋮ → 다른 브라우저로 열기를 눌러 주세요.</p>
      <label class="browser-guide-skip" for="browser-guide-dont-show">
        <input id="browser-guide-dont-show" type="checkbox">
        <span>다시 안 보기</span>
      </label>
      <button id="browser-guide-confirm" type="button" class="primary">확인</button>'''
          if html.count(old_controls) != 1:
              raise SystemExit('byeolcheonji/index.html: browser guide controls changed unexpectedly')
          html = html.replace(old_controls, new_controls, 1)
          replacements = {
              './styles.css?v=20261104-entryguide1': './styles.css?v=20261104-dontshow1',
              './compact.css?v=20261104-compact1': './compact.css?v=20261104-dontshow1',
              './browser-guide.js?v=20261104-entryguide1': './browser-guide.js?v=20261104-dontshow1',
          }
          for old, new in replacements.items():
              if html.count(old) != 1:
                  raise SystemExit(f'byeolcheonji/index.html: expected one asset reference {old!r}, found {html.count(old)}')
              html = html.replace(old, new, 1)
          index.write_text(html, encoding='utf-8')

          Path('byeolcheonji/browser-guide.js').write_text("""const GUIDE_KEY='ojjuda-byeolcheonji-browser-guide-v3';
          const dialog=document.getElementById('browser-guide');
          const confirmButton=document.getElementById('browser-guide-confirm');
          const closeButton=document.getElementById('browser-guide-close');
          const reopenButton=document.getElementById('browser-guide-reopen');
          const dontShowCheckbox=document.getElementById('browser-guide-dont-show');
          let returnFocus=null,guideOpen=false;

          const isGuideHidden=()=>{
           try{return localStorage.getItem(GUIDE_KEY)==='hidden';}catch{return false;}
          };
          const savePreference=()=>{
           try{
            if(dontShowCheckbox?.checked)localStorage.setItem(GUIDE_KEY,'hidden');
            else localStorage.removeItem(GUIDE_KEY);
           }catch{}
          };
          const openGuide=(focusTarget=null)=>{
           if(!dialog||guideOpen)return;
           returnFocus=focusTarget||document.activeElement;
           guideOpen=true;
           if(dontShowCheckbox)dontShowCheckbox.checked=isGuideHidden();
           if(typeof dialog.showModal==='function'){dialog.showModal();}
           else{dialog.setAttribute('open','');}
           confirmButton?.focus({preventScroll:true});
          };
          const closeGuide=()=>{
           if(!dialog||!guideOpen)return;
           savePreference();
           guideOpen=false;
           if(typeof dialog.close==='function'&&dialog.open){dialog.close();}
           else{dialog.removeAttribute('open');}
           const target=returnFocus;returnFocus=null;
           if(target&&typeof target.focus==='function')target.focus({preventScroll:true});
          };
          confirmButton?.addEventListener('click',closeGuide);
          closeButton?.addEventListener('click',closeGuide);
          dialog?.addEventListener('click',event=>{if(event.target===dialog)closeGuide();});
          dialog?.addEventListener('cancel',event=>{event.preventDefault();closeGuide();});
          reopenButton?.addEventListener('click',()=>openGuide(reopenButton));

          if(!isGuideHidden()){
           requestAnimationFrame(()=>openGuide());
          }
          """.replace('          ', ''), encoding='utf-8')

          styles_path = Path('byeolcheonji/styles.css')
          styles = styles_path.read_text(encoding='utf-8')
          if '.browser-guide-skip{' in styles:
              raise SystemExit('byeolcheonji/styles.css: skip styles already exist')
          styles += '''
          .browser-guide-skip{display:flex;align-items:center;gap:9px;width:max-content;max-width:100%;margin-top:14px;color:#31594c;font-weight:700;cursor:pointer;user-select:none}
          .browser-guide-skip input{width:18px;height:18px;margin:0;accent-color:#247060;cursor:pointer}
          .browser-guide-skip span{line-height:1.2}
          '''.replace('          ', '')
          styles_path.write_text(styles, encoding='utf-8')

          compact_path = Path('byeolcheonji/compact.css')
          compact = compact_path.read_text(encoding='utf-8')
          if '.browser-guide-skip{' in compact:
              raise SystemExit('byeolcheonji/compact.css: skip styles already exist')
          compact += '''
          .browser-guide-skip{margin-top:9px}
          .browser-guide .primary{margin-top:10px}
          '''.replace('          ', '')
          compact_path.write_text(compact, encoding='utf-8')

          Path('tests/byeolcheonji-browser-guide.test.cjs').write_text(r'''const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const vm=require('node:vm');

          const source=fs.readFileSync('byeolcheonji/browser-guide.js','utf8');
          const index=fs.readFileSync('byeolcheonji/index.html','utf8');
          const styles=fs.readFileSync('byeolcheonji/styles.css','utf8');
          const KEY='ojjuda-byeolcheonji-browser-guide-v3';

          class Element{
            constructor(id,document){this.id=id;this.document=document;this.listeners=new Map();this.checked=false;this.open=false;this.attributes=new Set();}
            addEventListener(type,handler){const list=this.listeners.get(type)||[];list.push(handler);this.listeners.set(type,list);}
            emit(type,event={}){event.target??=this;event.preventDefault??=()=>{event.defaultPrevented=true;};for(const handler of this.listeners.get(type)||[])handler(event);return event;}
            click(){this.emit('click');}
            focus(){this.document.focused=this;}
            showModal(){this.open=true;this.attributes.add('open');}
            close(){this.open=false;this.attributes.delete('open');}
            setAttribute(name){this.attributes.add(name);if(name==='open')this.open=true;}
            removeAttribute(name){this.attributes.delete(name);if(name==='open')this.open=false;}
          }

          function createHarness(initial={}){
            const values=new Map(Object.entries(initial));
            const raf=[];
            const document={focused:null,activeElement:null};
            const ids=['browser-guide','browser-guide-confirm','browser-guide-close','browser-guide-reopen','browser-guide-dont-show'];
            const elements=Object.fromEntries(ids.map(id=>[id,new Element(id,document)]));
            document.getElementById=id=>elements[id]||null;
            const localStorage={
              getItem:key=>values.has(key)?values.get(key):null,
              setItem:(key,value)=>values.set(key,String(value)),
              removeItem:key=>values.delete(key),
            };
            vm.runInNewContext(source,{document,localStorage,requestAnimationFrame:callback=>raf.push(callback)});
            return {
              ...elements,
              localStorage,
              flush(){while(raf.length)raf.shift()();},
            };
          }

          assert.match(index,/id="browser-guide-dont-show"[^>]*type="checkbox"/);
          assert.match(index,/다시 안 보기/);
          assert.match(index,/browser-guide\.js\?v=20261104-dontshow1/);
          assert.match(styles,/\.browser-guide-skip\{/);

          const first=createHarness();
          first.flush();
          assert.equal(first['browser-guide'].open,true,'first entry opens the guide');
          assert.equal(first['browser-guide-dont-show'].checked,false);
          assert.equal(first['browser-guide-confirm'],first['browser-guide-confirm'].document.focused);
          first['browser-guide-confirm'].click();
          assert.equal(first['browser-guide'].open,false);
          assert.equal(first.localStorage.getItem(KEY),null,'closing unchecked does not suppress future guides');

          const second=createHarness();
          second.flush();
          assert.equal(second['browser-guide'].open,true,'unchecked close shows again on the next entry');
          second['browser-guide-dont-show'].checked=true;
          second['browser-guide-confirm'].click();
          assert.equal(second.localStorage.getItem(KEY),'hidden','checked close saves the preference');

          const hidden=createHarness({[KEY]:'hidden'});
          hidden.flush();
          assert.equal(hidden['browser-guide'].open,false,'saved preference suppresses automatic entry guide');
          hidden['browser-guide-reopen'].click();
          assert.equal(hidden['browser-guide'].open,true,'help button always reopens the guide');
          assert.equal(hidden['browser-guide-dont-show'].checked,true,'saved preference is reflected in the checkbox');
          hidden['browser-guide-dont-show'].checked=false;
          hidden['browser-guide-close'].click();
          assert.equal(hidden.localStorage.getItem(KEY),null,'unchecking from help restores entry guide');

          const afterReset=createHarness();
          afterReset.flush();
          assert.equal(afterReset['browser-guide'].open,true,'guide returns after preference removal');
          afterReset['browser-guide-dont-show'].checked=true;
          afterReset['browser-guide'].emit('click',{target:afterReset['browser-guide']});
          assert.equal(afterReset.localStorage.getItem(KEY),'hidden','backdrop close follows the checkbox');

          const cancel=createHarness({[KEY]:'hidden'});
          cancel['browser-guide-reopen'].click();
          cancel['browser-guide-dont-show'].checked=false;
          const cancelEvent=cancel['browser-guide'].emit('cancel');
          assert.equal(cancelEvent.defaultPrevented,true);
          assert.equal(cancel.localStorage.getItem(KEY),null,'Escape close follows the checkbox');

          console.log('byeolcheonji browser guide preference checks passed');
          '''.replace(/^          /gm,''),encoding='utf-8')
          PY
      - name: Validate change
        run: |
          node --check byeolcheonji/browser-guide.js
          node tests/byeolcheonji-browser-guide.test.cjs
          node tests/byeolcheonji-ui.test.cjs
      - name: Commit verified change
        shell: bash
        run: |
          rm .github/workflows/temp-fix-byeolcheonji-browser-guide.yml
          git config user.name 'ojjuda-note'
          git config user.email 'mj830417@naver.com'
          git add -A
          git commit -m 'Fix Byeolcheonji browser guide preference'
          git push origin HEAD:fix-byeolcheonji-browser-guide-preference-20261104
