name: Integrate and verify friend search
on:
  push:
    branches: [codex/friend-search-state-20261004]
    paths: [.github/workflows/friend-search-integration.yml]
permissions:
  contents: write
concurrency:
  group: friend-search-integration
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      START_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Combine the selected fix with current main
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main 465158e3a78cbfddbfd3f18fdb2b914cd5a7257e 9fce353d72356929e73d4b1f09a8a8dc19207004
          git checkout --detach origin/main
          python3 - <<'PY'
          import subprocess,pathlib,json
          read=lambda rev,path:subprocess.check_output(['git','show',rev+':'+path],text=True)
          base=read('9fce353d72356929e73d4b1f09a8a8dc19207004','world.html')
          source='465158e3a78cbfddbfd3f18fdb2b914cd5a7257e'
          ours=read(source,'world.html')
          main=pathlib.Path('world.html').read_text()
          def span(s,start,end):
           a=s.index(start);return s[a:s.index(end,a)]
          pairs=[
           (span(base,'async function vd(t){','async function Ed(t){'),span(ours,'function syncWorldFriendOwner(){','async function Ed(t){')),
           (span(base,'function Of(){','return P.loaded?'),span(ours,'function Of(){','return P.loaded?')),
           ('value="${w(P.q)}" aria-label="닉네임 검색"','value="${w(P.searchDraft??P.q)}" aria-label="닉네임 검색"'),
           (span(base,'document.addEventListener("submit",t=>{if(t.target.id!=="fr-search-form")','function Dg(){'),span(ours,'document.addEventListener("input",event=>{if(event.target.id!=="fr-q")','function Dg(){')),
           (span(base,'function jg(){','e+=`<div class="fr-list">'),span(ours,'function jg(){','e+=`<div class="fr-list">')),
           ('function H(){','function H(){captureWorldFriendState();')
          ]
          for i,(old,new) in enumerate(pairs,1):
           assert main.count(old)==1, f'Original code for change {i} moved; review before retrying'
           main=main.replace(old,new,1)
          pathlib.Path('world.html').write_text(main)
          pathlib.Path('tests/world-friend-search-ui.test.cjs').write_text(read(source,'tests/world-friend-search-ui.test.cjs'))
          p=pathlib.Path('tests/package.json');pkg=json.loads(p.read_text());name='node world-friend-search-ui.test.cjs'
          assert name not in pkg['scripts']['test:ui']
          pkg['scripts']['test:ui']=name+' && '+pkg['scripts']['test:ui']
          p.write_text(json.dumps(pkg,ensure_ascii=False,indent=2)+'\n')
          print('Applied six focused friend-search changes to current main; all existing test commands preserved.')
          PY
          git diff --check
      - name: Install locked test tools
        run: npm --prefix tests ci --ignore-scripts
      - name: Install test browser
        working-directory: tests
        run: npx playwright install --with-deps chromium
      - name: Verify syntax, friend interactions and account transitions
        working-directory: tests
        run: |
          node inline-scripts.test.cjs
          node world-friend-search-ui.test.cjs
          node world-wallet-response-ui.test.cjs
      - name: Save only the verified fix to its existing branch
        run: |
          git add world.html tests/package.json tests/world-friend-search-ui.test.cjs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          tree=$(git write-tree)
          main_sha=$(git rev-parse origin/main)
          commit=$(git commit-tree "$tree" -p "$START_SHA" -p "$main_sha" -m 'Integrate current World into verified friend search fix')
          git push origin "$commit:refs/heads/codex/friend-search-state-20261004"
          echo "CHECKED_HEAD=$commit"
          echo "CHECKED_TREE=$tree"
          echo "BASE_MAIN=$main_sha"
          sha256sum world.html tests/package.json tests/world-friend-search-ui.test.cjs
