name: Saju readings and billing
on:
  push:
    branches: [main]
    paths:
      - 'games/starlit-saju/**'
      - 'shared/games/admin-preview.js'
      - 'supabase/migrations/*saju*'
      - 'tests/saju-*'
      - 'tests/package*.json'
      - '.github/workflows/saju.yml'
  pull_request:
    paths:
      - 'games/starlit-saju/**'
      - 'shared/games/admin-preview.js'
      - 'supabase/migrations/*saju*'
      - 'tests/saju-*'
      - 'tests/package*.json'
      - '.github/workflows/saju.yml'
permissions:
  contents: read
concurrency:
  group: saju-${{ github.ref }}
  cancel-in-progress: true
jobs:
  saju:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm --prefix tests ci --ignore-scripts
      - run: npm --prefix tests run test:saju
