name: Apply verified tan probability update
on:
  push:
    branches: [codex/matgo-tan-five-percent-20261014]
    paths: [ops/tan-probability.patch]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/matgo-tan-five-percent-20261014
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply reviewed text patch and verify hashes
        run: |
          git apply --check ops/tan-probability.patch
          git apply ops/tan-probability.patch
          python - <<'PYVERIFY'
          import hashlib,json,subprocess
          from pathlib import Path
          files=json.loads(Path('ops/tan-probability-manifest.json').read_text())
          for p,sha in files.items():
              assert not p.startswith('.github/') and hashlib.sha256(Path(p).read_bytes()).hexdigest()==sha,p
          subprocess.run(['git','add','--',*files],check=True)
          PYVERIFY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Set tan probability to five percent per paid round'
          git push origin HEAD:codex/matgo-tan-five-percent-20261014
      - name: Install locked test dependencies
        run: npm --prefix tests ci --ignore-scripts
      - name: Verify probability, retries and payment rollback
        run: |
          node tests/matgo-purchases.test.cjs
          node tests/matgo-wallet-purchases.test.mjs
