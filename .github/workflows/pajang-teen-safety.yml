name: Pajang teen-only safety
on:
  pull_request:
    paths:
      - 'features/pajang/content/teen-questions.json'
      - 'features/pajang/src/app/teen-*'
      - 'supabase/migrations/*pajang_teen*'
      - 'tests/pajang-teen-*'
      - 'admin/pajang-teen*'
      - '.github/workflows/pajang-teen-safety.yml'
  push:
    branches: [main]
    paths:
      - 'features/pajang/content/teen-questions.json'
      - 'features/pajang/src/app/teen-*'
      - 'supabase/migrations/*pajang_teen*'
      - 'tests/pajang-teen-*'
      - 'admin/pajang-teen*'
      - '.github/workflows/pajang-teen-safety.yml'
permissions:
  contents: read
jobs:
  teen-access:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm --prefix tests ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix features/pajang ci --ignore-scripts --no-audit --no-fund
      - name: Enforce youth age boundary, peer feed, moderation, and UI
        run: node --test tests/pajang-teen-questions.test.cjs tests/pajang-teen-private-drafts-db.test.cjs tests/pajang-teen-draft-ui.test.cjs tests/pajang-teen-admin-ui.test.cjs
