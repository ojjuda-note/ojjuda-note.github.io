name: Verify and stage party vote games
on:
  push:
    branches: [release/party-vote-multiplayer-stage]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Integrate verified room entry
        shell: bash
        run: |
          set -euo pipefail
          git apply --unidiff-zero --check .release/party-vote.patch
          git apply --unidiff-zero .release/party-vote.patch
          test "$(git hash-object world.html)" = 'a4e7837903d9bed11be71abd9bd48265160a8bc9'
          node --check games/party-vote/room.js
          node --check features/arcade/arcade-rooms.js
          node scripts/check-source-layout.mjs
      - run: npm ci --prefix tests --ignore-scripts --no-audit --no-fund
      - run: node tests/staged-party-vote.cjs
      - name: Stage verified king integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- world.html
          git commit -m 'Update arcade cache for party voting rooms'
          git push origin HEAD:refs/heads/release/party-vote-multiplayer-stage
