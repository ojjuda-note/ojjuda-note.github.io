name: Festival live browser smoke

on:
  pull_request:
    paths:
      - 'tests/festival-live-ui.cjs'
      - '.github/workflows/festival-live-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Actual deployed schedule and arcade display
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm --prefix tests ci --ignore-scripts
      - run: node --check tests/festival-live-ui.cjs
      - run: npx playwright install --with-deps chromium
        working-directory: tests
      - run: node tests/festival-live-ui.cjs
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: festival-live-ui-screenshots
          path: /tmp/festival-live-ui/
          retention-days: 3
          if-no-files-found: ignore
