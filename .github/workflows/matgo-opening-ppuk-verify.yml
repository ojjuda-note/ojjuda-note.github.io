name: Verify Matgo opening ppuk
on:
  push:
    branches: [codex/matgo-opening-ppuk-20261014]
    paths: ['ops/matgo-opening-ppuk.patch']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/matgo-opening-ppuk-20261014
      - name: Apply and verify source changes
        run: |
          git apply --check ops/matgo-opening-ppuk.patch
          git apply ops/matgo-opening-ppuk.patch
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess
          rows=json.loads(pathlib.Path('ops/matgo-opening-ppuk-manifest.json').read_text())
          for row in rows:
              data=pathlib.Path(row['path']).read_bytes()
              assert len(data)==row['size'] and hashlib.sha256(data).hexdigest()==row['sha256'],row['path']
          subprocess.run(['git','add','--']+[r['path'] for r in rows],check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Fix pi reward for opening triples and pin round compatibility"
          git push origin HEAD:codex/matgo-opening-ppuk-20261014
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm --prefix tests ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
        working-directory: tests
      - name: Verify opening rules and game screens
        run: |
          node tests/matgo-engine.test.cjs
          node tests/matgo-adaptive.test.cjs
          node tests/matgo-ui.test.cjs
          node tests/matgo-stakes-ui.test.cjs
          node tests/matgo-online-effects-ui.test.cjs
          node tests/matgo-online-ui.test.cjs
      - name: Retain opening triple proof temporarily
        if: success()
        run: |
          mkdir -p ops/matgo-opening-ppuk-proof
          cp /tmp/matgo-opening-proof/before.png ops/matgo-opening-ppuk-proof/before.png
          cp /tmp/matgo-opening-proof/after.png ops/matgo-opening-ppuk-proof/after.png
          git add ops/matgo-opening-ppuk-proof
          git commit -m "Retain opening triple mobile verification"
          git push origin HEAD:codex/matgo-opening-ppuk-20261014
