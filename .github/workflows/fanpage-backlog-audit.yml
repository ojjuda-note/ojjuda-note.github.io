name: Fanpage backlog audit
on:
  push:
    branches: ['audit/fanpage-backlog-20261113']
permissions:
  contents: read
concurrency:
  group: fanpage-backlog-audit
  cancel-in-progress: true
jobs:
  resource-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fanpages/recovery-eight-20261113
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Correct the four independently verified link destinations
        run: |
          python3 - <<'PY'
          import pathlib,subprocess,re,json
          expected='47f49a535734a64a8b8942e758fcfdd3336ce0af'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==expected,'Branch moved; review before patching'
          p=pathlib.Path('features/fanpages/artists-extra.js');s=p.read_text()
          def edit(group,fn):
              global s
              start=s.index("      id: '"+group+"'");end=s.index('\n    }',start)
              old=s[start:end];new=fn(old);assert old!=new;s=s[:start]+new+s[end:]
          def kii(x):
              x,n=re.subn(r"(title: 'WhyKiiiKiii',[^\n]+href: )'[^']+'",r"\1'https://music.apple.com/us/album/whykiiikiii-ep/6796609538'",x);assert n==1
              old="title: '미니 3집 WhyKiiiKiii · Pop Off Pop Off 발매', href: 'https://www.starship-ent.com/musician/kiiikiii'"
              assert old in x
              return x.replace(old,"title: '미니 3집 WhyKiiiKiii · Pop Off Pop Off 발매', href: 'https://music.apple.com/us/album/whykiiikiii-ep/6796609538'")
          def kiss(x):
              old="title: 'KISS OF LIFE 일본 공식 사이트', sub: '공식 소식 및 공연 안내', href: 'https://kissoflife.jp/'"
              assert old in x
              return x.replace(old,"title: '일본 공식 공연·행사', sub: '컬럼비아 공식 공연·발매 이벤트 안내', href: 'https://columbia.jp/artist-info/kissoflife/live/'")
          def stay(x):
              x,n=re.subn(r"(title: 'STAY ALIVE',[^\n]+href: )'https://store-annex.universal-music.co.jp/product/upch29482/'",r"\1'https://www.universal-music.co.jp/stayc/news/2025-11-11/'",x);assert n==1
              return x
          edit('kiiikiii',kii);edit('kissoflife',kiss);edit('stayc',stay);p.write_text(s)
          out=pathlib.Path('recovery-fix-evidence');out.mkdir()
          (out/'resource-fix.diff').write_text(subprocess.check_output(['git','diff','--',str(p)],text=True))
          record=pathlib.Path('ops/fanpage-recovery-20261113.json');r=json.loads(record.read_text())
          r['resourceCorrections']=['KiiiKiii album and release news: Apple official distribution, separate from merchandise','KISS OF LIFE schedule: Columbia live/events, not artist landing page','STAYC album: Universal detailed release notice, separate from store']
          r['releaseTargetCorrection']='Infer all changed groups from data; shared-only changes verify all groups. Never interpret branch recovery as an artist.'
          record.write_text(json.dumps(r,ensure_ascii=False,indent=2)+'\n')
          PY
      - run: npm --prefix tests ci --ignore-scripts
      - name: Run unchanged controls, links, profiles, videos and manager checks
        run: |
          set -o pipefail
          node --test tests/fanpage-changed-groups.test.cjs | tee recovery-fix-evidence/target-tests.log
          npm --prefix tests run test:fanpages | tee recovery-fix-evidence/fanpage-tests.log
      - name: Commit only reviewed source corrections to the existing recovery branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- features/fanpages/artists-extra.js ops/fanpage-recovery-20261113.json
          git commit -m '팬페이지: 음반·판매·뉴스·일정의 실제 공식 목적지 분리'
          git push origin HEAD:refs/heads/fanpages/recovery-eight-20261113
          git rev-parse HEAD > recovery-fix-evidence/head.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fanpage-recovery-resource-fix
          path: recovery-fix-evidence/
          retention-days: 7
          if-no-files-found: error
  published-backlog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        group: [tws, nctdream, ateez, treasure, nctwish, andteam]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 8e5d0ea576cf09a1da4ac63dd8aae92f0c009c3b
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm --prefix tests ci --ignore-scripts
      - name: Verify the actual already published group before closing its old proposal
        env:
          FANPAGE_GROUP: ${{ matrix.group }}
          FANPAGE_LIVE: 'true'
        run: node tests/fanpage-release-ui.test.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fanpage-existing-public-${{ matrix.group }}
          path: tests/artifacts/fanpage-release/
          retention-days: 7
          if-no-files-found: error
