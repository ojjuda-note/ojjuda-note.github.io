name: Fanpage backlog audit
on:
  push:
    branches: ['audit/fanpage-backlog-20261113']
permissions:
  contents: read
concurrency:
  group: fanpage-backlog-audit
  cancel-in-progress: true
jobs:
  source-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Build candidate without publishing and query original media metadata
        run: |
          python3 scripts/audit-fanpage-recovery.py
          python3 scripts/audit-fanpage-albums.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fanpage-recovery-source-review
          path: recovery-evidence/
          retention-days: 7
          if-no-files-found: error
