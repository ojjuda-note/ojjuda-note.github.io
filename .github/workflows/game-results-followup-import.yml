name: Import reviewed result layout and regression fixes

on:
  push:
    branches: ['codex/game-result-mobile-fix-20261103']
    paths: ['.github/workflows/game-results-followup-import.yml']

permissions:
  contents: write

concurrency:
  group: game-results-followup-file-import
  cancel-in-progress: false

jobs:
  import:
    if: github.repository == 'ojjuda-note/ojjuda-note.github.io' && github.ref == 'refs/heads/codex/game-result-mobile-fix-20261103'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true
      - name: Verify fixed archive and import only reviewed files
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, io, os, pathlib, stat, subprocess, tempfile, urllib.request, zipfile

          repository = "ojjuda-note/ojjuda-note.github.io"
          branch = "codex/game-result-mobile-fix-20261103"
          base = "de923a5728d866fc15953434b56767ba345bea42"
          url = "https://d2ol7oe51mr4n9.cloudfront.net/user_3IxANoqRL1uMNs5GRgxqpniGdas/b2dcccf8-3e16-4036-abc9-ba56fb720d03.zip"
          expected_sha256 = "8ac1425d6435572b24af6561ff01ae4ee1112ebd6a731213e2e8970538926741"
          expected_bytes = 515337
          expected_uncompressed_bytes = 1188286
          allowed = set(['game-release.json', 'games/matgo-online.html', 'games/matgo-online.mjs', 'games/matgo-viewport.css', 'games/matgo.html', 'matgo-bridge.js', 'tests/archery-entry.test.cjs', 'tests/breakout-items-ui.test.cjs', 'tests/festival-entry.test.cjs', 'tests/game-results-multiplayer-ui.test.cjs', 'tests/matgo-ui.test.cjs', 'tests/ojjuda-tour-ui.test.cjs', 'tests/photo-ttang-trial-ui.test.cjs', 'tests/solo-fresh-entry.test.cjs', 'tests/spot-end-levels.test.cjs', 'tests/spot-order.test.cjs', 'world-game-assets.js', 'world.html'])
          expected_tree = 'd32d1798e4d256fc36c9fcf7fb312c3fb7f2d1a3'
          workflow_path = ".github/workflows/game-results-followup-import.yml"
          transforms = [{'path': 'world-game-assets.js', 'replacements': [["restaurants:'1.1.0'", "restaurants:'1.1.1'"], ['/world-restaurant-guide.js?v=20261103-restaurant-nearby1', '/world-restaurant-guide.js?v=20261103-restaurants-blue3-complete1']], 'sha256': '9741ceef1085b9623d0a69465a3f6b3674ee38e7a395d342a03d749a5c011e0d'}]
          assert 8 <= len(allowed) <= 24
          assert os.environ["GITHUB_REPOSITORY"] == repository
          assert os.environ["GITHUB_REF"] == "refs/heads/" + branch
          assert os.environ["GITHUB_EVENT_NAME"] == "push"

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          initial = os.environ["GITHUB_SHA"]
          assert git("rev-parse", "HEAD") == initial
          assert git("rev-parse", "HEAD^") == base, "Bootstrap parent changed"
          assert not git("status", "--porcelain"), "Checkout must be clean"
          assert git("ls-remote", "--exit-code", "origin", "refs/heads/" + branch).split()[0] == initial

          with urllib.request.urlopen(url, timeout=60) as response:
              assert response.status == 200
              data = response.read(expected_bytes + 1)
          assert len(data) == expected_bytes
          assert hashlib.sha256(data).hexdigest() == expected_sha256

          checkout = pathlib.Path.cwd().resolve()
          prepared = {}
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              entries = archive.infolist()
              assert len(entries) == len(allowed)
              assert {entry.filename for entry in entries} == allowed
              assert sum(entry.file_size for entry in entries) == expected_uncompressed_bytes
              for entry in entries:
                  name = entry.filename
                  assert not entry.is_dir() and not (entry.flag_bits & 1)
                  assert stat.S_ISREG(entry.external_attr >> 16)
                  assert entry.file_size <= 2_000_000
                  path = pathlib.PurePosixPath(name)
                  assert not path.is_absolute() and ".." not in path.parts
                  target = checkout.joinpath(*path.parts)
                  assert target.resolve().is_relative_to(checkout)
                  assert not target.is_symlink()
                  for parent in target.parents:
                      if parent == checkout:
                          break
                      assert not parent.is_symlink()
                  prepared[name] = archive.read(entry)
              assert archive.testzip() is None

          for name, content in prepared.items():
              target = checkout / name
              target.parent.mkdir(parents=True, exist_ok=True)
              with tempfile.NamedTemporaryFile(dir=target.parent, delete=False) as handle:
                  handle.write(content)
                  temporary = pathlib.Path(handle.name)
              temporary.chmod(0o644)
              temporary.replace(target)

          for transform in transforms:
              assert transform["path"] in allowed
              target = checkout / transform["path"]
              text = target.read_text()
              for old, new in transform["replacements"]:
                  assert text.count(old) == 1, "Exact reviewed transform anchor changed"
                  text = text.replace(old, new)
              target.write_text(text)
              assert hashlib.sha256(target.read_bytes()).hexdigest() == transform["sha256"]

          (checkout / workflow_path).unlink()
          subprocess.run(["git", "add", "--", *sorted(allowed), workflow_path], check=True)
          staged = subprocess.check_output(["git", "diff", "--cached", "--name-only", "-z"]).decode().strip("\0").split("\0")
          assert set(staged) == allowed | {workflow_path} and len(staged) == len(allowed) + 1
          assert git("write-tree") == expected_tree, "Imported tree differs from reviewed files"
          subprocess.run(["git", "diff", "--cached", "--check"], check=True)
          assert git("rev-parse", "HEAD") == initial
          assert git("ls-remote", "--exit-code", "origin", "refs/heads/" + branch).split()[0] == initial
          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "commit", "-m", "Keep all Matgo result actions visible and align result regressions"], check=True)
          subprocess.run(["git", "push", "origin", "HEAD:refs/heads/" + branch], check=True)
          print("Imported", len(allowed), "verified files; commit", git("rev-parse", "HEAD"))
          PY
