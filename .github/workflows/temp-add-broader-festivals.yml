          events.sort(key=lambda item: (item.get('start') is None, item.get('start') or '9999-12-31', item.get('title', '')))
          data['events'] = events
          data['updatedAt'] = '2026-11-04'
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          actual = {item.get('id') for item in events}
          missing = ids - actual
          if missing:
              raise SystemExit(f'missing inserted event ids: {sorted(missing)}')
          if len(actual) != len(events):
              raise SystemExit('duplicate event ids after update')
