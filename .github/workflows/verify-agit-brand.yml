name: Verify shared Agit logo
on:
  push:
    branches: [codex/agit-logo-20261022]
    paths: ['ops/agit-brand-edits.json', 'ops/apply-agit-brand.py', 'ops/render-brand.py', '.github/workflows/verify-agit-brand.yml']
permissions:
  contents: write
concurrency:
  group: agit-shared-logo
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply checked sharing metadata
        run: python ops/apply-agit-brand.py
      - name: Render every installation icon from the approved SVG
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk librsvg2-bin
          python ops/render-brand.py
      - name: Verify application entry and script syntax
        run: |
          node tests/inline-scripts.test.cjs
          node tests/portal-auth-entry.test.cjs
      - name: Keep rendered logo evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agit-logo-proof
          path: |
            favicon.svg
            icon-192.png
            icon-512.png
            icon-maskable-512.png
            apple-touch-icon.png
            og-image.png
            brand/share.svg
          retention-days: 3
      - name: Commit verified artwork and source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m 'Use the approved note logo for all Agit share and install assets'
          git push origin HEAD:codex/agit-logo-20261022
