name: Import verified Pajang avatar artwork
on:
  push:
    branches: [pajang-hd-art-20261126]
    paths: ['.github/workflows/import-pajang-avatar-art.yml']
permissions:
  contents: write
jobs:
  artwork:
    if: github.repository == 'ojjuda-note/ojjuda-note.github.io' && github.ref == 'refs/heads/pajang-hd-art-20261126'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Initialize the temporary artwork branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          gh auth setup-git
          git -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none origin "${GITHUB_REF}"
          git sparse-checkout init --cone
          git sparse-checkout set features/pajang/assets/hd
          git checkout -q -b pajang-hd-art-20261126 FETCH_HEAD
