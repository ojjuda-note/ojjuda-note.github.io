name: Billiards controls

on:
  push:
    paths:
      - 'world.html'
      - 'game-controls.js'
      - 'game-controls.css'
      - 'tests/billiards-controls-ui.test.cjs'
      - '.github/workflows/billiards-controls.yml'
  pull_request:
    paths:
      - 'world.html'
      - 'game-controls.js'
      - 'game-controls.css'
      - 'tests/billiards-controls-ui.test.cjs'
      - '.github/workflows/billiards-controls.yml'

permissions:
  contents: read

concurrency:
  group: billiards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  billiards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked test dependencies
        run: npm --prefix tests ci --ignore-scripts
      - name: Install the test browser
        working-directory: tests
        run: npx playwright install --with-deps chromium
      - name: Check table-only zoom, fixed controls and shot interactions
        run: node tests/billiards-controls-ui.test.cjs
