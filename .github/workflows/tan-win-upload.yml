name: Apply and verify Matgo guaranteed tan wins
on:
  push:
    branches: [codex/matgo-gentle-difficulty-20261014]
    paths: [ops/tan-win.patch]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/matgo-gentle-difficulty-20261014
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply reviewed text patch
        run: |
          git apply --check ops/tan-win.patch
          git apply ops/tan-win.patch
          python - <<'PYVERIFY'
          import hashlib,json,subprocess
          from pathlib import Path
          files=json.loads(Path('ops/tan-win-manifest.json').read_text())
          for p,sha in files.items():
              assert not p.startswith('.github/') and hashlib.sha256(Path(p).read_bytes()).hexdigest()==sha,p
          subprocess.run(['git','add','--',*files],check=True)
          PYVERIFY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Guarantee paid tan wins while preserving earned scores and ordinary rounds'
          git push origin HEAD:codex/matgo-gentle-difficulty-20261014
      - run: npm --prefix tests ci --ignore-scripts
      - working-directory: tests
        run: npx playwright install --with-deps chromium
      - name: Verify complete rounds and live browser interactions
        run: |
          node tests/matgo-difficulty.test.mjs
          node tests/matgo-tazza.test.mjs
          node tests/matgo-purchases.test.cjs
          node tests/matgo-gold.test.cjs
          node tests/matgo-special-rules.test.mjs
          node tests/matgo-ui.test.cjs
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: matgo-tan-win-proof
          path: |
            /tmp/matgo-vent-proof
            /tmp/matgo-gold-verified.png
            /tmp/matgo-triple-ppuk-gobak.png
          retention-days: 3
