name: Tank solo and multiplayer
on:
  push:
    paths: ['games/tank/**', 'world-tank-game.*', 'world-game-rankings.js', 'supabase/functions/tank/**', 'supabase/migrations/*_tank_*.sql', 'tests/tank-*', 'tests/world-board-tank.test.cjs', '.github/workflows/tank.yml']
  pull_request:
    paths: ['games/tank/**', 'world-tank-game.*', 'world-game-rankings.js', 'supabase/functions/tank/**', 'supabase/migrations/*_tank_*.sql', 'tests/tank-*', 'tests/world-board-tank.test.cjs', '.github/workflows/tank.yml']
permissions:
  contents: read
jobs:
  tank:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm --prefix tests ci --ignore-scripts
      - run: node tests/tank-engine.test.mjs
      - run: node tests/tank-online-db.test.cjs
      - run: node tests/tank-solo.test.cjs
      - run: node tests/world-board-tank.test.cjs
      - run: node tests/tank-local.test.cjs
      - run: node --experimental-vm-modules tests/tank-client.test.cjs
      - run: node --experimental-vm-modules tests/tank-entry-recovery.test.cjs
      - run: node tests/arcade-catalog.test.cjs
      - run: node tests/arcade-entry-flows.test.cjs
