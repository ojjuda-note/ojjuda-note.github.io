name: Navigation history regression
on:
  push:
    branches: [main]
    paths:
      - 'world.html'
      - 'app/world/world-navigation.js'
      - 'app/portal/portal.js'
      - 'shared/navigation/**'
      - 'park/**'
      - 'note/navigation.js'
      - 'note/preview.js'
      - 'groups/**'
      - 'features/pajang/**'
      - 'features/guide/**'
      - 'features/fanpages/fan.js'
      - 'tests/*navigation*'
      - 'tests/public-dialog-navigation.test.cjs'
      - '.github/workflows/navigation-history.yml'
  pull_request:
    paths:
      - 'world.html'
      - 'app/world/world-navigation.js'
      - 'app/portal/portal.js'
      - 'shared/navigation/**'
      - 'park/**'
      - 'note/navigation.js'
      - 'note/preview.js'
      - 'groups/**'
      - 'features/pajang/**'
      - 'features/guide/**'
      - 'features/fanpages/fan.js'
      - 'tests/*navigation*'
      - 'tests/public-dialog-navigation.test.cjs'
      - '.github/workflows/navigation-history.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  navigation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm --prefix tests ci --ignore-scripts
      - run: npm --prefix features/pajang ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix features/pajang run build
      - name: Verify history state, authentication return and embedded screens
        run: |
          node --test tests/section-back-navigation.test.cjs tests/public-dialog-navigation.test.cjs tests/world-navigation-departure.test.cjs tests/admin-back-navigation.test.cjs tests/park-settings-navigation.test.cjs tests/park-frame-cache.test.cjs tests/admin-service-scope.test.cjs tests/group-navigation-history.test.cjs tests/pajang-navigation.test.mjs tests/pajang-navigation-dom.test.cjs tests/pajang-account.test.mjs
          node --test tests/group-invitations-db.test.cjs
          node tests/portal-auth-entry.test.cjs
          node --test tests/service-document-return.test.cjs
          node tests/inline-scripts.test.cjs
      - name: Install Chromium
        working-directory: tests
        run: |
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          npx playwright install --with-deps chromium
      - name: Verify Back and Forward in Chromium
        shell: bash
        run: |
          export PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH="$(node -e 'process.stdout.write(require("./tests/node_modules/playwright").chromium.executablePath())')"
          export CHROMIUM_PATH="$PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH"
          navigation_test_failed=0
          node tests/public-navigation-history-ui.test.cjs || navigation_test_failed=1
          node tests/group-navigation-history-ui.test.cjs || navigation_test_failed=1
          node --test tests/agit-group-navigation-ui.test.cjs tests/group-password-ui.test.cjs || navigation_test_failed=1
          PAJANG_NAVIGATION_ONLY=1 node tests/pajang-discovery-browser.cjs || navigation_test_failed=1
          node tests/world-game-back-ui.test.cjs || navigation_test_failed=1
          node tests/arcade-exit-ui.test.cjs || navigation_test_failed=1
          node tests/admin-navigation-ui.test.cjs || navigation_test_failed=1
          exit "$navigation_test_failed"
