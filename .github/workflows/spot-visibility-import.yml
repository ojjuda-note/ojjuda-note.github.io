name: Import reviewed spot visibility and unobscured zoom status

on:
  push:
    branches: ['codex/spot-status-outside-20261103']
    paths: ['.github/workflows/spot-visibility-import.yml']

permissions:
  contents: write

concurrency:
  group: spot-visibility-file-import
  cancel-in-progress: false

jobs:
  import:
    if: github.repository == 'ojjuda-note/ojjuda-note.github.io' && github.ref == 'refs/heads/codex/spot-status-outside-20261103'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true
      - name: Verify fixed archive and import only reviewed files
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, io, os, pathlib, stat, subprocess, tempfile, urllib.request, zipfile

          repository = "ojjuda-note/ojjuda-note.github.io"
          branch = "codex/spot-status-outside-20261103"
          base = "a0d286e12430e578041f6acd0258e319713c50d4"
          url = "https://d2ol7oe51mr4n9.cloudfront.net/user_3IxANoqRL1uMNs5GRgxqpniGdas/57e1219a-397a-4885-8948-2e91fa3f1916.zip"
          expected_sha256 = "12c50d4d68c2c6f5841db0c774a69e725e700d175dc05e0d417bb337dfc1a480"
          expected_bytes = 8917126
          expected_uncompressed_bytes = 10298049
          allowed = set(['game-release.json', 'games/spot-difference/app.js', 'games/spot-difference/assets/fairytale-pets/01-detail-07-v2.webp', 'games/spot-difference/assets/fairytale-pets/08-detail-09-v2.webp', 'games/spot-difference/assets/fairytale-pets/09-detail-10-v2.webp', 'games/spot-difference/assets/fairytale-pets/12-detail-08-v2.webp', 'games/spot-difference/assets/fairytale-pets/23-detail-09-v2.webp', 'games/spot-difference/assets/fairytale-pets/37-detail-03-v2.webp', 'games/spot-difference/assets/fairytale-pets/41-detail-01-v2.webp', 'games/spot-difference/assets/fairytale-pets/58-detail-07-v2.webp', 'games/spot-difference/assets/fairytale-pets/62-detail-09-v2.webp', 'games/spot-difference/fairytale-pets-assets.json', 'games/spot-difference/fairytale-pets-puzzles.js', 'games/spot-difference/index.html', 'games/spot-difference/style.css', 'games/spot-difference/visibility-audit-20261103.json', 'tests/spot-celebration-ui.test.cjs', 'tests/spot-fairytale-pets.test.cjs', 'tests/spot-masterpieces-runtime.test.cjs', 'world-game-assets.js', 'world-spot-game.js', 'world.html'])
          expected_tree = '2710cd402c0bb806c75861adae814b36ae04068a'
          workflow_path = ".github/workflows/spot-visibility-import.yml"
          transforms = []
          assert 12 <= len(allowed) <= 40
          assert os.environ["GITHUB_REPOSITORY"] == repository
          assert os.environ["GITHUB_REF"] == "refs/heads/" + branch
          assert os.environ["GITHUB_EVENT_NAME"] == "push"

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          initial = os.environ["GITHUB_SHA"]
          assert git("rev-parse", "HEAD") == initial
          assert git("rev-parse", "HEAD^") == base, "Bootstrap parent changed"
          assert not git("status", "--porcelain"), "Checkout must be clean"
          assert git("ls-remote", "--exit-code", "origin", "refs/heads/" + branch).split()[0] == initial

          with urllib.request.urlopen(url, timeout=60) as response:
              assert response.status == 200
              data = response.read(expected_bytes + 1)
          assert len(data) == expected_bytes
          assert hashlib.sha256(data).hexdigest() == expected_sha256

          checkout = pathlib.Path.cwd().resolve()
          prepared = {}
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              entries = archive.infolist()
              assert len(entries) == len(allowed)
              assert {entry.filename for entry in entries} == allowed
              assert sum(entry.file_size for entry in entries) == expected_uncompressed_bytes
              for entry in entries:
                  name = entry.filename
                  assert not entry.is_dir() and not (entry.flag_bits & 1)
                  assert stat.S_ISREG(entry.external_attr >> 16)
                  assert entry.file_size <= 2_000_000
                  path = pathlib.PurePosixPath(name)
                  assert not path.is_absolute() and ".." not in path.parts
                  target = checkout.joinpath(*path.parts)
                  assert target.resolve().is_relative_to(checkout)
                  assert not target.is_symlink()
                  for parent in target.parents:
                      if parent == checkout:
                          break
                      assert not parent.is_symlink()
                  prepared[name] = archive.read(entry)
              assert archive.testzip() is None

          for name, content in prepared.items():
              target = checkout / name
              target.parent.mkdir(parents=True, exist_ok=True)
              with tempfile.NamedTemporaryFile(dir=target.parent, delete=False) as handle:
                  handle.write(content)
                  temporary = pathlib.Path(handle.name)
              temporary.chmod(0o644)
              temporary.replace(target)

          for transform in transforms:
              assert transform["path"] in allowed
              target = checkout / transform["path"]
              text = target.read_text()
              for old, new in transform["replacements"]:
                  assert text.count(old) == 1, "Exact reviewed transform anchor changed"
                  text = text.replace(old, new)
              target.write_text(text)
              assert hashlib.sha256(target.read_bytes()).hexdigest() == transform["sha256"]

          (checkout / workflow_path).unlink()
          subprocess.run(["git", "add", "--", *sorted(allowed), workflow_path], check=True)
          staged = subprocess.check_output(["git", "diff", "--cached", "--name-only", "-z"]).decode().strip("\0").split("\0")
          assert set(staged) == allowed | {workflow_path} and len(staged) == len(allowed) + 1
          assert git("write-tree") == expected_tree, "Imported tree differs from reviewed files"
          subprocess.run(["git", "diff", "--cached", "--check"], check=True)
          assert git("rev-parse", "HEAD") == initial
          assert git("ls-remote", "--exit-code", "origin", "refs/heads/" + branch).split()[0] == initial
          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "commit", "-m", "Clarify spot differences and keep zoom status below pictures"], check=True)
          subprocess.run(["git", "push", "origin", "HEAD:refs/heads/" + branch], check=True)
          print("Imported", len(allowed), "verified files; commit", git("rev-parse", "HEAD"))
          PY
