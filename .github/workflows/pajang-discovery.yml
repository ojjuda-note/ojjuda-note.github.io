name: Pajang discovery interaction
on:
  push:
    branches: [main]
    paths:
      - 'features/pajang/**'
      - 'supabase/functions/pajang-assets/index.ts'
      - '.github/workflows/pajang-discovery.yml'
  pull_request:
    paths:
      - 'features/pajang/**'
      - 'tests/pajang-discovery-browser.cjs'
      - '.github/workflows/pajang-discovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm --prefix tests ci --ignore-scripts
      - run: npm --prefix features/pajang install --no-package-lock --no-audit --no-fund
      - run: npm --prefix features/pajang run build
      - run: node --test tests/pajang-discovery-gender.test.mjs
      - name: Install Chromium and Korean fonts
        working-directory: tests
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - run: node tests/pajang-discovery-browser.cjs
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pajang-discovery-screens
          path: tests/artifacts/pajang-discovery/
          retention-days: 3
          if-no-files-found: ignore
      - name: Verify member program manifest
        run: |
          python - <<'PYVERIFY'
          import hashlib, re
          from pathlib import Path

          digest = hashlib.sha256(Path("features/pajang/assets/station.js").read_bytes()).hexdigest()
          source = Path("supabase/functions/pajang-assets/index.ts").read_text()
          assert re.search(r'"station.js": "' + digest + '"', source), "Program differs from the release manifest"
          print("Verified member program", digest)
          PYVERIFY
