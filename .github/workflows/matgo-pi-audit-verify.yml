name: Verify Matgo pi claims and rule interactions
on:
  push:
    branches: [codex/matgo-pi-audit-20261014]
    paths: ['ops/matgo-pi-audit.patch']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/matgo-pi-audit-20261014
      - name: Apply and verify source changes
        run: |
          git apply --check ops/matgo-pi-audit.patch
          git apply ops/matgo-pi-audit.patch
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess
          rows=json.loads(pathlib.Path('ops/matgo-pi-audit-manifest.json').read_text())
          for row in rows:
              data=pathlib.Path(row['path']).read_bytes()
              assert len(data)==row['size'] and hashlib.sha256(data).hexdigest()==row['sha256'],row['path']
          subprocess.run(['git','add','--']+[r['path'] for r in rows],check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Clarify Matgo pi claims and verify combined capture rules"
          git push origin HEAD:codex/matgo-pi-audit-20261014
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm --prefix tests ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
        working-directory: tests
      - name: Verify rules, replay and both game screens
        run: |
          node tests/matgo-engine.test.cjs
          node tests/matgo-special-rules.test.mjs
          node tests/matgo-bonus.test.mjs
          node tests/matgo-multipliers.test.mjs
          node tests/matgo-first-ppuk.test.mjs
          node tests/matgo-ui.test.cjs
          node tests/matgo-online-effects-ui.test.cjs
          node tests/matgo-online-ui.test.cjs
