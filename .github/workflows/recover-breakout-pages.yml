name: Recover stalled breakout Pages deployment
on:
  push:
    branches: ['ops/recover-breakout-pages-20261106']
    paths: ['.github/workflows/recover-breakout-pages.yml']
permissions:
  contents: read
  pages: write
jobs:
  cancel-stalled-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Cancel only the timed-out breakout deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          base = 'https://api.github.com/repos/ojjuda-note/ojjuda-note.github.io/pages/deployments/4a0d8eb266aec6999b80ba971fadbd74cf66bd3d'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          def status():
              with urllib.request.urlopen(urllib.request.Request(base + '/status', headers=headers), timeout=20) as r:
                  value = json.load(r).get('status')
              print('Deployment status:', value, flush=True)
              return value
          if status() != 'succeed':
              req = urllib.request.Request(base + '/cancel', data=b'', headers=headers, method='POST')
              with urllib.request.urlopen(req, timeout=20) as r:
                  print('Cancel response:', r.status, flush=True)
              for _ in range(5):
                  time.sleep(5)
                  if status() in ('cancelled', 'canceled', 'failed', 'succeed'):
                      break
          PY
