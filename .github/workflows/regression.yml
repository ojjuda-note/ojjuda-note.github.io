name: Application regression checks

on:
  push:
    branches: [main]
    paths:
      - '**/*.js'
      - '**/*.html'
      - '**/*.cjs'
      - '**/*.mjs'
      - '**/*.css'
      - 'supabase/**'
      - 'tests/**'
      - 'ops/**'
      - '.github/workflows/regression.yml'
  pull_request:
    paths:
      - '**/*.js'
      - '**/*.html'
      - '**/*.cjs'
      - '**/*.mjs'
      - '**/*.css'
      - 'supabase/**'
      - 'tests/**'
      - 'ops/**'
      - '.github/workflows/regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install locked test dependencies
        run: npm --prefix tests ci --ignore-scripts
      - name: Install the test browser
        working-directory: tests
        run: npx playwright install --with-deps chromium
      - name: Check account, card, administrator and RPC regressions
        run: npm --prefix tests test
      - name: Check dependency vulnerabilities
        run: npm --prefix tests audit --audit-level=high

  recovery:
    name: Encrypted recovery regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install recovery dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends age
          python -m pip install -r ops/backup-requirements.txt
      - name: Test encryption, restoration, tampering and target isolation
        run: python tests/backup-restore.test.py
