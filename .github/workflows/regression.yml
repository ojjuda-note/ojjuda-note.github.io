name: Application regression checks

on:
  push:
    branches: [main]
    paths:
      - '**/*.js'
      - '**/*.html'
      - '**/*.cjs'
      - '**/*.mjs'
      - '**/*.css'
      - 'supabase/**'
      - 'tests/**'
      - '.github/workflows/regression.yml'
  pull_request:
    paths:
      - '**/*.js'
      - '**/*.html'
      - '**/*.cjs'
      - '**/*.mjs'
      - '**/*.css'
      - 'supabase/**'
      - 'tests/**'
      - '.github/workflows/regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install locked test dependencies
        run: npm --prefix tests ci --ignore-scripts
      - name: Install the test browser
        working-directory: tests
        run: npx playwright install --with-deps chromium
      - name: Check account, card, administrator and RPC regressions
        run: npm --prefix tests test
      - name: Check dependency vulnerabilities
        run: npm --prefix tests audit --audit-level=high
