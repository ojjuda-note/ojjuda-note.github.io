name: Application regression checks

on:
  push:
    branches: [main]
    paths:
      - '**/*.js'
      - '**/*.html'
      - '**/*.cjs'
      - '**/*.mjs'
      - '**/*.css'
      - 'supabase/**'
      - 'tests/**'
      - 'ops/**'
      - '.github/workflows/regression.yml'
  pull_request:
    paths:
      - '**/*.js'
      - '**/*.html'
      - '**/*.cjs'
      - '**/*.mjs'
      - '**/*.css'
      - 'supabase/**'
      - 'tests/**'
      - 'ops/**'
      - '.github/workflows/regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fresh_games:
    name: Fresh entries, computer handoff and preserved purchases
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked test dependencies
        run: npm --prefix tests ci --ignore-scripts
      - name: Install the test browser
        working-directory: tests
        run: npx playwright install --with-deps chromium
      - name: Verify fresh sessions, settlement and the Saetbyeol exception
        run: npm --prefix tests run test:fresh-games

  performance:
    name: Shared reads, idle games and server replay
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked test dependencies
        run: npm --prefix tests ci --ignore-scripts
      - name: Install the test browser
        working-directory: tests
        run: npx playwright install --with-deps chromium
      - name: Verify read reduction, visibility and account isolation
        run: npm --prefix tests run test:performance

  automatic_repair:
    name: Automatic repair deployment boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r ops/automatic-repair-requirements.txt
      - run: python tests/automatic-repair.test.py

  matgo:
    name: Matgo pi rules and settlement regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked test dependencies
        run: npm --prefix tests ci --ignore-scripts
      - name: Install the test browser
        working-directory: tests
        run: npx playwright install --with-deps chromium
      - name: Check pi rules, legacy settlement and online replay
        run: |
          node tests/matgo-tazza.test.mjs
          node tests/matgo-purchases.test.cjs
          node tests/matgo-deck-tools.test.mjs
          node tests/matgo-wallet-purchases.test.mjs
          node tests/matgo-engine.test.cjs
          node tests/matgo-multipliers.test.mjs
          node tests/matgo-refill.test.cjs
          node tests/matgo-captured-zoom.test.mjs
          node tests/matgo-bonus.test.mjs
          node tests/matgo-difficulty.test.mjs
          node tests/matgo-adaptive.test.cjs
          node tests/matgo-first-ppuk.test.mjs
          node tests/matgo-stakes.test.cjs
          node tests/matgo-parity.test.cjs
          node tests/matgo-online.test.cjs
          node tests/matgo-replay-reuse.test.mjs
      - name: Check solo and online game screens
        run: |
          node tests/matgo-ui.test.cjs
          node tests/matgo-stakes-ui.test.cjs
          node tests/matgo-online-ui.test.cjs
          node tests/matgo-online-effects-ui.test.cjs
          node tests/matgo-vent-effects-ui.test.cjs
      - name: Save vent artwork and sound verification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: matgo-vent-proof
          path: /tmp/matgo-vent-proof
          retention-days: 3

  friend_invites:
    name: Friend invitation popup and response
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked test dependencies
        run: npm --prefix tests ci --ignore-scripts
      - name: Install the test browser
        working-directory: tests
        run: npx playwright install --with-deps chromium
      - name: Check invitation permissions and popup lifecycle
        run: |
          node tests/game-friend-invites-db.test.cjs
          node tests/game-friend-invites-ui.test.cjs
          node tests/game-entry-ui.test.cjs
          node tests/multiplayer-entry-ui.test.cjs
          node tests/arcade-promotions-ui.test.cjs
          node tests/arcade-promotions-db.test.cjs
          node tests/arcade-rooms-db.test.cjs
          node tests/arcade-rooms-ui.test.cjs
          node tests/service-notice-ui.test.cjs

  territory:
    name: Territory capture and collision regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked test dependencies
        run: npm --prefix tests ci --ignore-scripts
      - name: Install the test browser
        working-directory: tests
        run: npx playwright install --with-deps chromium
      - name: Check territory collisions, capture and embedded game screens
        run: |
          node tests/photo-ttang-entry.test.cjs
          node tests/ttang-collision.test.cjs
          node tests/photo-ttang-collision.test.cjs
          node tests/ttang-corners.test.cjs
          node tests/ttang-ui.test.cjs
          node tests/photo-ttang-capture-ui.test.cjs
          node tests/photo-ttang-trial-ui.test.cjs

  security:
    name: Account and data access security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked test dependencies
        run: npm --prefix tests ci --ignore-scripts
      - name: Check XSS, account recovery and database authorization
        run: npm --prefix tests run test:security
      - name: Check dependency vulnerabilities
        if: ${{ !cancelled() }}
        run: npm --prefix tests audit --audit-level=high

  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install locked test dependencies
        run: npm --prefix tests ci --ignore-scripts
      - name: Install the test browser
        working-directory: tests
        run: npx playwright install --with-deps chromium
      - name: Check purchased coupon messages and recipient privacy
        run: node --test tests/reward-coupon-ui.test.cjs
      - name: Check account, card, administrator and RPC regressions
        run: npm --prefix tests test
  recovery:
    name: Encrypted recovery regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install recovery dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends age
          python -m pip install -r ops/backup-requirements.txt
      - name: Test encryption, restoration, tampering and target isolation
        run: python tests/backup-restore.test.py
