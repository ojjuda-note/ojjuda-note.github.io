name: Application regression checks

on:
  push:
    branches: [main]
    paths:
      - '**/*.js'
      - '**/*.html'
      - '**/*.cjs'
      - '**/*.mjs'
      - '**/*.css'
      - 'house-test/assets/*.runtime.json'
      - 'supabase/**'
      - 'tests/**'
      - 'ops/**'
      - '.github/workflows/regression.yml'
  pull_request:
    paths:
      - '**/*.js'
      - '**/*.html'
      - '**/*.cjs'
      - '**/*.mjs'
      - '**/*.css'
      - 'house-test/assets/*.runtime.json'
      - 'supabase/**'
      - 'tests/**'
      - 'ops/**'
      - '.github/workflows/regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  room_defaults:
    name: Room reference placement
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked test dependencies
        run: npm --prefix tests ci --ignore-scripts
      - name: Install the test browser
        working-directory: tests
        run: npx playwright install --with-deps chromium
      - name: Check default positions and saved room preservation
        run: node tests/house-default-placement-ui.test.cjs
      - name: Check plants resting on moved wall shelves
        run: node tests/shelf-support-ui.test.cjs
      - name: Check existing catalog and placement controls
        run: |
          node tests/item-catalog-ui.test.cjs
          node tests/desk-lamp-built-in-ui.test.cjs
          node tests/house-placement-actions-ui.test.cjs
      - name: Save actual room screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: room-default-placement
          path: |
            /tmp/room-default-proof
            /tmp/shelf-support-proof
          retention-days: 3

  matgo:
    name: Matgo pi rules and settlement regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked test dependencies
        run: npm --prefix tests ci --ignore-scripts
      - name: Install the test browser
        working-directory: tests
        run: npx playwright install --with-deps chromium
      - name: Check pi rules, legacy settlement and online replay
        run: |
          node tests/matgo-engine.test.cjs
          node tests/matgo-bonus.test.mjs
          node tests/matgo-difficulty.test.mjs
          node tests/matgo-first-ppuk.test.mjs
          node tests/matgo-stakes.test.cjs
          node tests/matgo-parity.test.cjs
          node tests/matgo-online.test.cjs
      - name: Check solo and online game screens
        run: |
          node tests/matgo-ui.test.cjs
          node tests/matgo-online-ui.test.cjs
          node tests/matgo-online-effects-ui.test.cjs

  territory:
    name: Territory capture and collision regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked test dependencies
        run: npm --prefix tests ci --ignore-scripts
      - name: Install the test browser
        working-directory: tests
        run: npx playwright install --with-deps chromium
      - name: Check territory collisions, capture and embedded game screens
        run: |
          node tests/ttang-collision.test.cjs
          node tests/photo-ttang-collision.test.cjs
          node tests/ttang-corners.test.cjs
          node tests/ttang-ui.test.cjs
          node tests/photo-ttang-capture-ui.test.cjs
          node tests/photo-ttang-trial-ui.test.cjs

  security:
    name: Account and data access security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked test dependencies
        run: npm --prefix tests ci --ignore-scripts
      - name: Check XSS, account recovery and database authorization
        run: npm --prefix tests run test:security
      - name: Check dependency vulnerabilities
        if: ${{ !cancelled() }}
        run: npm --prefix tests audit --audit-level=high

  furniture:
    name: Furniture registration and artwork cache
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check artwork revisions and deformation regressions
        run: npm --prefix tests run test:furniture
      - name: Install locked test dependencies
        run: npm --prefix tests ci --ignore-scripts
      - name: Install the test browser
        working-directory: tests
        run: npx playwright install --with-deps chromium
      - name: Check registration rejection, valid application and warm cache
        run: npm --prefix tests run test:furniture-ui

  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install locked test dependencies
        run: npm --prefix tests ci --ignore-scripts
      - name: Install the test browser
        working-directory: tests
        run: npx playwright install --with-deps chromium
      - name: Check account, card, administrator and RPC regressions
        run: npm --prefix tests test
  recovery:
    name: Encrypted recovery regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install recovery dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends age
          python -m pip install -r ops/backup-requirements.txt
      - name: Test encryption, restoration, tampering and target isolation
        run: python tests/backup-restore.test.py
