name: Transfer Matgo character and verify mobile screens
on:
  push:
    branches: [codex/matgo-cpu-character-20261013]
    paths: [ops/matgo-cpu-v1.patch]
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/matgo-cpu-character-20261013
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply reviewed code and transfer original PNG bytes
        env:
          ART_URL: https://sdmntprjapaneast.oaiusercontent.com/files/00000000-23a0-8209-ae8c-249bdefb75d7/raw?se=2026-10-13T07%3A25%3A01Z&sp=r&sv=2026-02-06&sr=b&scid=4b85c18a-ab7b-4eca-87a1-354733ca4565&skoid=03727f49-62d3-42ac-8350-1c0e6559d238&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-13T00%3A16%3A02Z&ske=2026-10-14T00%3A16%3A02Z&sks=b&skv=2026-02-06&sig=/WyA%2Bq0K3A7nmHk3ryaA%2BKm1nd1EmmoLIgECUz72mDI%3D
        run: |
          python - <<'PY'
          import os,json,hashlib,urllib.request,zipfile,subprocess
          from pathlib import Path
          manifest=json.loads(Path('ops/matgo-cpu-v1-manifest.json').read_text())
          subprocess.run(['git','apply','--check','ops/matgo-cpu-v1.patch'],check=True)
          subprocess.run(['git','apply','ops/matgo-cpu-v1.patch'],check=True)
          archive=Path('/tmp/matgo-cpu-art.zip')
          urllib.request.urlretrieve(os.environ['ART_URL'],archive)
          assert len(archive.read_bytes())==3391937
          assert hashlib.sha256(archive.read_bytes()).hexdigest()=='b061f6c5644ea80ae1e7ea637201624a3ebf96f7fafa6aa085a8f65227515a9f'
          with zipfile.ZipFile(archive) as z:
              expected={f'games/assets/matgo-opponent/{name}-v1.png' for name in ['normal','surprised']}
              assert set(z.namelist())==expected
              for name in sorted(expected):
                  raw=z.read(name)
                  assert hashlib.sha256(raw).hexdigest()==manifest[name]
                  dest=Path(name);dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(raw)
          for name,digest in manifest.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest,name
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--']+list(manifest),check=True)
          subprocess.run(['git','commit','-m','Apply photo-inspired computer portraits and score-side tazza benefit'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/codex/matgo-cpu-character-20261013'],check=True)
          PY
      - name: Install locked test dependencies
        run: npm --prefix tests ci --ignore-scripts
      - name: Install test browser
        working-directory: tests
        run: npx playwright install --with-deps chromium
      - name: Check solo layout and active benefit
        run: node tests/matgo-ui.test.cjs
      - name: Check opponent expressions and effects
        if: ${{ !cancelled() }}
        run: node tests/matgo-vent-effects-ui.test.cjs
      - name: Save actual game screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: matgo-cpu-proof
          path: /tmp/matgo-vent-proof
          retention-days: 3
