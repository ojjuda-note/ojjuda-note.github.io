name: Daily checks and encrypted offsite backup

on:
  schedule:
    - cron: '0 3 * * *'
      timezone: Asia/Seoul
  workflow_dispatch:
    inputs:
      backup_only:
        description: 'Run backup only for a manual retry'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/nightly-backup.yml'

permissions:
  contents: read

concurrency:
  group: ojjuda-nightly-backup
  cancel-in-progress: false

jobs:
  checks:
    name: Error and dependency security checks
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.backup_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check tracked JavaScript and Python syntax
        run: |
          python3 - <<'PY'
          import pathlib
          import subprocess
          import sys

          paths = subprocess.check_output(
              ["git", "ls-files", "-z"], text=True
          ).split("\0")
          failed = []
          checked = 0
          for name in paths:
              if not name:
                  continue
              path = pathlib.Path(name)
              if path.suffix in (".js", ".cjs", ".mjs"):
                  checked += 1
                  if subprocess.run(["node", "--check", name]).returncode:
                      failed.append(name)
              elif path.suffix == ".py":
                  checked += 1
                  try:
                      compile(path.read_text(encoding="utf-8"), name, "exec")
                  except SyntaxError:
                      failed.append(name)
          print(f"Syntax checked: {checked} files; failures: {len(failed)}")
          for name in failed:
              print(f"Syntax error: {name}", file=sys.stderr)
          sys.exit(bool(failed))
          PY
      - name: Install locked regression test dependencies
        if: ${{ !cancelled() }}
        run: npm --prefix tests ci --ignore-scripts
      - name: Install Chromium for real interface checks
        if: ${{ !cancelled() }}
        working-directory: tests
        run: npx playwright install --with-deps chromium
      - name: Run signup, login, database and browser regression tests
        if: ${{ !cancelled() }}
        run: npm --prefix tests test
      - name: Audit locked dependency vulnerabilities
        if: ${{ !cancelled() }}
        run: npm --prefix tests audit --audit-level=high
      - name: Check public portal, world and note HTTPS responses
        if: ${{ !cancelled() }}
        run: |
          failed=0
          for url in https://ojjuda.kr/ https://ojjuda.kr/world.html https://ojjuda.kr/note/; do
            if ! curl --fail --silent --show-error --location --retry 2 --max-time 30 --output /dev/null "$url"; then
              failed=1
            fi
          done
          exit "$failed"

  backup:
    needs: checks
    # Preserve recovery snapshots even when a check detects a problem.
    if: ${{ always() && !cancelled() && github.event_name != 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_PROJECT_REF: ziezbdjofcugznowiuda
      SUPABASE_REGION: ap-northeast-2
      SUPABASE_DB_URL: ${{ secrets.BACKUP_SUPABASE_DB_URL }}
      SUPABASE_DB_PASSWORD: ${{ secrets.BACKUP_SUPABASE_DB_PASSWORD }}
      # Confirmed in this project's Dashboard > Connect > Session pooler.
      SUPABASE_DB_POOLER_HOST: aws-0-ap-northeast-2.pooler.supabase.com
      SUPABASE_S3_ACCESS_KEY: ${{ secrets.BACKUP_SUPABASE_S3_ACCESS_KEY }}
      SUPABASE_S3_SECRET_KEY: ${{ secrets.BACKUP_SUPABASE_S3_SECRET_KEY }}
      BACKUP_S3_ENDPOINT: https://kr.object.ncloudstorage.com
      BACKUP_S3_REGION: kr-standard
      BACKUP_S3_BUCKET: ojjuda-backup-ziezbdjofcugznowiuda
      BACKUP_S3_ACCESS_KEY: ${{ secrets.BACKUP_S3_ACCESS_KEY }}
      BACKUP_S3_SECRET_KEY: ${{ secrets.BACKUP_S3_SECRET_KEY }}
      BACKUP_AGE_RECIPIENT: age18j7evc6kwmzau3373zpc7zq0eapmqnw2q5jetzeh4czvdlut0ekqn0yr5z
      BACKUP_RETENTION_DAYS: '30'
      BACKUP_KEY_PREFIX: ojjuda-disaster-recovery/v1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: 2.118.0
      - name: Install backup dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends age postgresql-client
          python -m pip install -r ops/backup-requirements.txt
      - name: Back up, encrypt, upload and verify
        run: python ops/backup.py
