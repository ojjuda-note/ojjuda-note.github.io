name: Verify studio undo history fixture
on:
  push:
    branches: [fix/studio-history-fixture-20261005]
    paths: [.github/workflows/studio-history-fixture-verify.yml]
permissions:
  contents: write
jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      START_SHA: ${{ github.sha }}
      BASE_SHA: d13f862ea436682b15afef7ff287d76bb16176ba
      EXPECTED_BLOB: bcfc84b171232a41189d32f366469f26e7c76a19
      BRANCH_NAME: fix/studio-history-fixture-20261005
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Apply the isolated regression fixture repair
        run: |
          git fetch --no-tags origin "$BASE_SHA"
          git checkout --detach "$BASE_SHA"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/studio-history-performance-ui.test.cjs')
          text = p.read_text()
          import_line = "const {loadValidStudioItem}=require('./furniture-studio-fixture.cjs');\n"
          old = "  await frame.locator('#studio-side-table').click();await frame.waitForFunction(()=>document.querySelector('#set-summary').textContent.includes('원본 그림 3/3'));"
          new = "  await frame.locator('#studio-editor').waitFor({state:'visible'});await loadValidStudioItem(frame);await frame.waitForFunction(()=>!document.querySelector('#studio-apply').disabled);"
          assert import_line not in text
          assert text.count(old) == 1
          p.write_text(import_line + text.replace(old, new, 1))
          PY
          test "$(git hash-object tests/studio-history-performance-ui.test.cjs)" = "$EXPECTED_BLOB"
          node --check tests/studio-history-performance-ui.test.cjs
          git diff --check
      - name: Install test dependencies
        run: npm --prefix tests ci --ignore-scripts
      - name: Install Chromium
        working-directory: tests
        run: npx playwright install --with-deps chromium
      - name: Check complete undo history and draft preservation
        run: node tests/studio-history-performance-ui.test.cjs
      - name: Publish only the verified test change
        run: |
          git config user.name 'ojjuda-note'
          git config user.email '334255691+ojjuda-note@users.noreply.github.com'
          git add tests/studio-history-performance-ui.test.cjs
          checked_tree=$(git write-tree)
          checked_head=$(printf '%s\n' 'Use a registered studio fixture for undo history regression' | git commit-tree "$checked_tree" -p "$START_SHA" -p "$BASE_SHA")
          git push origin "$checked_head:refs/heads/$BRANCH_NAME"
          echo "CHECKED_HEAD=$checked_head"
          echo "CHECKED_TREE=$checked_tree"
          echo "BASE_MAIN=$BASE_SHA"
          git diff --stat "$BASE_SHA" "$checked_head"
