name: Verify shared drinking rooms and synchronized game selection
on:
  push:
    branches: [release/drinks-hub-stage]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Integrate verified room entry
        shell: bash
        run: |
          set -euo pipefail
          git apply --unidiff-zero --check .release/drinks-hub.patch
          git apply --unidiff-zero .release/drinks-hub.patch
          test "$(git hash-object world.html)" = '5c7f4291b566aad5200c7e09640073cd8192414c'
          for module in games/drinking/*.js games/party-live/*.js; do node --check "$module"; done
          node --check features/arcade/arcade-rooms.js
          node scripts/check-source-layout.mjs
      - run: npm ci --prefix tests --ignore-scripts --no-audit --no-fund
      - run: node --test tests/arcade-rooms-polling.test.cjs
      - run: node tests/staged-drinks-hub.cjs
      - name: Stage verified multiplayer integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- world.html
          git commit -m 'Group drinking games behind one shared room'
          git push origin HEAD:refs/heads/release/drinks-hub-stage
