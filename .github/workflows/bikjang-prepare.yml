name: Prepare verified Bikjang draw
on:
  push:
    branches: [codex/janggi-bikjang-draw-20261106]
    paths: ['.github/workflows/bikjang-prepare.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: python3 scripts/prepare-bikjang-update.py
      - run: npm --prefix tests ci --ignore-scripts
      - run: node --test tests/janggi-bikjang.test.cjs tests/janggi-setup-repetition.test.cjs tests/board-menu-async.test.cjs tests/board-availability.test.cjs tests/game-release-refresh.test.cjs tests/game-assets-loading.test.cjs
      - run: node tests/game-verification.test.cjs && node tests/board-computer-takeover.test.cjs && node tests/inline-scripts.test.cjs
      - name: Commit verified sources
        run: |
          git rm .github/workflows/bikjang-prepare.yml scripts/prepare-bikjang-update.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add world.html shared/games/world-game-assets.js game-release.json supabase/functions/game-action/engines.mjs tests/package.json
          git commit -m "Apply verified threefold Bikjang draw"
          git push origin HEAD:codex/janggi-bikjang-draw-20261106
