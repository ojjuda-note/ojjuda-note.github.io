name: Restaurant recommendation map smoke checks

on:
  pull_request:
    paths:
      - 'games/certified-restaurants/recommended-restaurants.js'
      - 'games/certified-restaurants/app.js'
      - 'tests/recommended-restaurants-dom.test.cjs'
      - 'tests/restaurant-guide-ui.test.cjs'
      - 'shared/games/world-game-assets.js'
      - '.github/workflows/restaurant-map-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'games/certified-restaurants/recommended-restaurants.js'
      - 'games/certified-restaurants/app.js'
      - 'tests/recommended-restaurants-dom.test.cjs'
      - 'tests/restaurant-guide-ui.test.cjs'
      - 'shared/games/world-game-assets.js'
      - '.github/workflows/restaurant-map-smoke.yml'

permissions:
  contents: read

jobs:
  location_guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm --prefix tests ci --ignore-scripts
      - name: Check client code syntax
        run: |
          node --check games/certified-restaurants/recommended-restaurants.js
          node --check games/certified-restaurants/app.js
      - name: Check recommendation editing and coordinate safeguards without browser download
        run: node --test tests/recommended-restaurants-dom.test.cjs
