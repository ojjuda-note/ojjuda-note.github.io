name: Validate Byeolcheonji browser guide fix

on: [push]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply patch
        run: python3 scripts/apply-byeolcheonji-browser-guide-fix.py
      - name: Install isolated UI test dependency
        run: npm install --prefix /tmp/byeolcheonji-ui --no-save --no-package-lock jsdom@25.0.1
      - name: Run checks
        run: |
          node --check byeolcheonji/browser-guide.js
          node tests/byeolcheonji-browser-guide.test.cjs
          NODE_PATH=/tmp/byeolcheonji-ui/node_modules node tests/byeolcheonji-ui.test.cjs
      - name: Commit verified patch
        run: |
          rm .github/workflows/temp-validate-byeolcheonji-browser-guide.yml
          rm scripts/apply-byeolcheonji-browser-guide-fix.py
          git config user.name 'ojjuda-note'
          git config user.email 'mj830417@naver.com'
          git add -A
          git commit -m 'Fix Byeolcheonji browser guide preference'
          git push origin HEAD:fix-byeolcheonji-browser-guide-preference-20261104
