name: Admin fortune purchase history

on:
  push:
    branches: [main]
    paths:
      - 'admin/**'
      - 'world.html'
      - 'note/operations.js'
      - 'note/operations.css'
      - 'supabase/migrations/*admin_fortune*'
      - 'supabase/migrations/*pajang_admin*'
      - 'supabase/migrations/*pajang_question_suggestions_admin*'
      - 'tests/admin-fortune-purchases*'
      - 'tests/admin-pajang*'
      - 'tests/fixtures/admin-pajang-question-suggestions.cjs'
      - 'tests/admin-service-scope.test.cjs'
      - 'tests/admin-navigation-ui.test.cjs'
      - 'tests/package*.json'
      - '.github/workflows/admin-fortune-purchases.yml'
  pull_request:
    paths:
      - 'admin/**'
      - 'world.html'
      - 'note/operations.js'
      - 'note/operations.css'
      - 'supabase/migrations/*admin_fortune*'
      - 'supabase/migrations/*pajang_admin*'
      - 'supabase/migrations/*pajang_question_suggestions_admin*'
      - 'tests/admin-fortune-purchases*'
      - 'tests/admin-pajang*'
      - 'tests/fixtures/admin-pajang-question-suggestions.cjs'
      - 'tests/admin-service-scope.test.cjs'
      - 'tests/admin-navigation-ui.test.cjs'
      - 'tests/package*.json'
      - '.github/workflows/admin-fortune-purchases.yml'

permissions:
  contents: read

concurrency:
  group: admin-fortune-purchases-${{ github.ref }}
  cancel-in-progress: true

jobs:
  purchase_history:
    name: Purchase history permissions, totals and navigation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm --prefix tests ci --ignore-scripts
      - name: Check purchase history and administrator integration
        run: |
          node --check admin/fortune-purchases.js
          node --check admin/pajang-moderation.js
          node --check note/operations.js
          node --test tests/admin-fortune-purchases*.test.cjs
          node --test tests/admin-pajang-moderation*.test.cjs tests/admin-service-scope.test.cjs tests/admin-back-navigation.test.cjs
          node --test tests/admin-pajang-question-suggestions.test.cjs tests/admin-pajang-question-suggestions-db.test.cjs
          node tests/admin-menu-groups.test.cjs
          node tests/admin-current-features.test.cjs
          node --test tests/admin-service-workspace.test.cjs
          node tests/inline-scripts.test.cjs
          node scripts/check-source-layout.mjs
      - name: Install browser and Korean fonts
        working-directory: tests
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Check administrator menu navigation
        run: node tests/admin-navigation-ui.test.cjs
      - name: Check Pajang moderation on mobile and desktop
        run: node tests/admin-pajang-ui.test.cjs
      - name: Check Pajang question suggestions and administrator entry
        run: node tests/admin-pajang-question-suggestions-ui.test.cjs
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: admin-pajang-screens
          path: tests/artifacts/admin-pajang/
          retention-days: 3
          if-no-files-found: ignore
