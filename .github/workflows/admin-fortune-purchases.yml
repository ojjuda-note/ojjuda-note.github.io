name: Admin fortune purchase history

on:
  push:
    branches: [main]
    paths:
      - 'admin/**'
      - 'world.html'
      - 'supabase/migrations/*admin_fortune*'
      - 'tests/admin-fortune-purchases*'
      - 'tests/admin-navigation-ui.test.cjs'
      - 'tests/package*.json'
      - '.github/workflows/admin-fortune-purchases.yml'
  pull_request:
    paths:
      - 'admin/**'
      - 'world.html'
      - 'supabase/migrations/*admin_fortune*'
      - 'tests/admin-fortune-purchases*'
      - 'tests/admin-navigation-ui.test.cjs'
      - 'tests/package*.json'
      - '.github/workflows/admin-fortune-purchases.yml'

permissions:
  contents: read

concurrency:
  group: admin-fortune-purchases-${{ github.ref }}
  cancel-in-progress: true

jobs:
  purchase_history:
    name: Purchase history permissions, totals and navigation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm --prefix tests ci --ignore-scripts
      - name: Check purchase history and administrator integration
        run: |
          node --check admin/fortune-purchases.js
          node --test tests/admin-fortune-purchases*.test.cjs
          node tests/admin-menu-groups.test.cjs
          node tests/admin-current-features.test.cjs
          node tests/inline-scripts.test.cjs
          node scripts/check-source-layout.mjs
      - name: Install browser
        run: cd tests && npx playwright install --with-deps chromium
      - name: Check administrator menu navigation
        run: node tests/admin-navigation-ui.test.cjs
