name: Ojjuda Tour
on:
  push:
    paths:
      - 'games/ojjuda-tour/**'
      - 'world-tour-game.*'
      - 'supabase/migrations/*_tour_game_rankings.sql'
      - 'supabase/migrations/*_marble_online_rooms.sql'
      - 'supabase/functions/marble/**'
      - 'tests/ojjuda-tour-*.cjs'
      - '.github/workflows/ojjuda-tour.yml'
  pull_request:
    paths:
      - 'games/ojjuda-tour/**'
      - 'world-tour-game.*'
      - 'supabase/migrations/*_tour_game_rankings.sql'
      - 'supabase/migrations/*_marble_online_rooms.sql'
      - 'supabase/functions/marble/**'
      - 'tests/ojjuda-tour-*.cjs'
      - '.github/workflows/ojjuda-tour.yml'
permissions:
  contents: read
concurrency:
  group: ojjuda-tour-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tour:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm --prefix tests ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
        working-directory: tests
      - run: node tests/ojjuda-tour-dom.test.cjs
      - run: node tests/ojjuda-tour-ranking-db.test.cjs
      - run: node tests/ojjuda-tour-online-engine.test.cjs
      - run: node tests/ojjuda-tour-online-db.test.cjs
      - run: node tests/ojjuda-tour-ui.test.cjs
      - run: node tests/ojjuda-tour-online-ui.test.cjs
      - name: Save actual Tour board screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ojjuda-tour-board
          path: /tmp/ojjuda-tour-proof
          retention-days: 3
