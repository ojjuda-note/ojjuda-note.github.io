name: Apply and verify random vent actions
on:
  push:
    branches: [codex/matgo-random-vent-20261014]
    paths: [ops/random-vent.patch]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/matgo-random-vent-20261014
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply reviewed code and original artwork
        run: |
          git apply --check ops/random-vent.patch
          git apply ops/random-vent.patch
          python - <<'PYVERIFY'
          import hashlib,json,subprocess,urllib.request
          from pathlib import Path
          for asset in json.loads(Path('ops/random-vent-assets.json').read_text()):
              path=Path('games/assets/matgo-vent')/asset['name']
              if not path.exists():
                  assert asset['download_url'].startswith('https://ziezbdjofcugznowiuda.supabase.co/storage/')
                  data=urllib.request.urlopen(asset['download_url'],timeout=60).read()
                  assert len(data)==asset['bytes'] and hashlib.sha256(data).hexdigest()==asset['sha256']
                  path.write_bytes(data)
          files=json.loads(Path('ops/random-vent-manifest.json').read_text())
          for p,sha in files.items():
              assert not p.startswith('.github/') and hashlib.sha256(Path(p).read_bytes()).hexdigest()==sha,p
          subprocess.run(['git','add','--',*files],check=True)
          PYVERIFY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add ten random vent actions with new artwork and sound'
          git push origin HEAD:codex/matgo-random-vent-20261014
      - name: Install locked test dependencies
        run: npm --prefix tests ci --ignore-scripts
      - name: Install test browser
        working-directory: tests
        run: npx playwright install --with-deps chromium
      - name: Check random actions and atomic purchases
        run: |
          node tests/matgo-deck-tools.test.mjs
          node tests/matgo-purchases.test.cjs
          node tests/matgo-wallet-purchases.test.mjs
          node tests/matgo-edge.test.cjs
      - name: Check all animations, audio and phone layouts
        run: |
          node tests/matgo-vent-effects-ui.test.cjs
          node tests/matgo-ui.test.cjs
      - name: Publish temporary visual proof for review
        if: always()
        run: |
          python - <<'PYPROOF'
          from pathlib import Path
          import subprocess,shutil
          selected=[Path('/tmp/matgo-vent-proof')/(name+'.png') for name in ['burst','slash','tomato','bat','burst-small-phone','slash-small-phone','tomato-small-phone','bat-small-phone']]
          files=[]
          for source in selected:
              if source.exists():
                  destination=Path('ops/vent-proof')/source.name
                  destination.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copyfile(source,destination)
                  files.append(str(destination))
          if files:
              subprocess.run(['git','add','--',*files],check=True)
              if subprocess.run(['git','diff','--cached','--quiet']).returncode:
                  subprocess.run(['git','commit','-m','Temporary phone animation proof'],check=True)
                  subprocess.run(['git','push','origin','HEAD:codex/matgo-random-vent-20261014'],check=True)
          PYPROOF
