name: Check Matgo automatic online stakes
on:
  push:
    branches: [codex/matgo-auto-stakes-online-tests-20261014]
    paths: ['tests/matgo-online-ui.test.cjs']
permissions:
  contents: read
jobs:
  online:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm --prefix tests ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
        working-directory: tests
      - run: node tests/matgo-online-ui.test.cjs
