name: Remove Byeolcheonji preview artifact

on:
  push:
    branches:
      - compact-byeolcheonji-ui-20261104

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Remove generated preview from source
        shell: bash
        run: |
          rm -f artifacts/byeolcheonji-compact-mobile.png
          rm .github/workflows/temp-remove-byeolcheonji-preview.yml
          git config user.name 'ojjuda-note'
          git config user.email 'mj830417@naver.com'
          git add -A
          git commit -m 'Remove generated Byeolcheonji preview artifact'
          git push origin HEAD:compact-byeolcheonji-ui-20261104
