name: Refresh fanpage PR test provenance
on:
  push:
    branches: ['fanpages/ci-source-audit-20261114']
    paths: ['.github/workflows/fanpage-ci-refresh.yml']
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fanpages/apply-all-20261114
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Merge the reviewed main commit without overwriting concurrent changes
        run: |
          test "$(git rev-parse HEAD)" = '22c6905a40c269003ab8094a1bf9d48719f01fa2'
          git fetch --quiet origin ac7a93a723fdcdb81176a55ea41bae21e6f8ff55
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-ff --no-commit ac7a93a723fdcdb81176a55ea41bae21e6f8ff55
      - name: Add source provenance without changing or skipping any assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/regression.yml');s=p.read_text()
          anchor='      - name: Check account, card, administrator and RPC regressions\n'
          assert s.count(anchor)==1
          extra=('      - name: Verify exact regression source identity\n'
                 '        run: |\n'
                 '          git rev-parse HEAD\n'
                 '          git diff --exit-code HEAD -- tests/package.json tests/admin-fortune-purchases.test.cjs\n'
                 '          git hash-object tests/package.json tests/admin-fortune-purchases.test.cjs\n'
                 '          git status --short -- tests/run.cjs\n'
                 '          node -p "require(\'./tests/package.json\').scripts[\'test:unit\']"\n')
          p.write_text(s.replace(anchor,extra+anchor))
          PY
          node features/fanpages/check-profiles.mjs
          node features/fanpages/check-videos.mjs
          node scripts/check-source-layout.mjs
          git diff --check
          git add .github/workflows/regression.yml
          git commit -m 'ci(fanpages): sync reviewed main and record regression source identity'
          git push origin HEAD:fanpages/apply-all-20261114
          git log -1 --format='REFRESHED_PR_HEAD=%H'
