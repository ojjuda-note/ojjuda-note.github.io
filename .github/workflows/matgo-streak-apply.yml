name: Prepare Matgo streak update
on:
  push:
    branches: [codex/matgo-streak-auto-stakes-20261014]
    paths: ['ops/matgo-streak.patch']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/matgo-streak-auto-stakes-20261014
      - name: Apply and verify reviewed source delta
        run: |
          git apply --check ops/matgo-streak.patch
          git apply ops/matgo-streak.patch
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess
          rows=json.loads(pathlib.Path('ops/matgo-streak-manifest.json').read_text())
          for row in rows:
              data=pathlib.Path(row['path']).read_bytes()
              assert len(data)==row['size'] and hashlib.sha256(data).hexdigest()==row['sha256'],row['path']
          subprocess.run(['git','add','--']+[r['path'] for r in rows],check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Apply five-win/three-loss levels and automatic Matgo stakes"
          git push origin HEAD:codex/matgo-streak-auto-stakes-20261014
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm --prefix tests ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
        working-directory: tests
      - name: Check account progression and mobile game
        env:
          MATGO_STAKE_SCREENSHOT: /tmp/matgo-streak-proof.png
        run: |
          node tests/matgo-adaptive.test.cjs
          node tests/matgo-stakes-ui.test.cjs
          node tests/matgo-ui.test.cjs
      - name: Retain mobile proof temporarily
        if: success()
        run: |
          mkdir -p ops/matgo-streak-proof
          cp /tmp/matgo-streak-proof.png ops/matgo-streak-proof/mobile.png
          git add ops/matgo-streak-proof/mobile.png
          git commit -m "Retain mobile progression verification"
          git push origin HEAD:codex/matgo-streak-auto-stakes-20261014
