name: Apply verified Matgo score patch
on:
  push:
    branches: [codex/matgo-current-score-20261005]
    paths: [.github/workflows/matgo-score-transfer.yml, .github/matgo-score-transfer.py]
permissions:
  contents: write
concurrency:
  group: matgo-score-transfer
  cancel-in-progress: false
jobs:
  patch:
    if: github.repository == 'ojjuda-note/ojjuda-note.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Apply verified patch while preserving embedded media
        run: python3 .github/matgo-score-transfer.py
      - name: Commit file bytes through authenticated Git
        run: |
          git add -- games/matgo.html
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Move the small solo score beside the player hand'
          git push origin HEAD:refs/heads/codex/matgo-current-score-20261005
