name: Finish Byeolcheonji browser guide preference

on:
  push:
    branches:
      - fix-byeolcheonji-browser-guide-preference-20261104

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Merge latest main and finish release metadata
        shell: bash
        run: |
          git config user.name 'ojjuda-note'
          git config user.email 'mj830417@naver.com'
          git fetch origin main
          git merge --no-edit origin/main
          python3 - <<'PY'
          import json
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'byeolcheonji/index.html',
              '<span class="browser-guide-label">도움말</span>',
              '<span class="browser-guide-label">브라우저 안내</span>'
          )
          replace_once(
              'tests/byeolcheonji-browser-guide.test.cjs',
              "assert.match(index, /다시 안 보기/);",
              "assert.match(index, /다시 안 보기/);\nassert.match(index, /<span class=\"browser-guide-label\">브라우저 안내<\\/span>/);"
          )
          replace_once(
              'tests/package.json',
              '"test:byeolcheonji": "node --test byeolcheonji-model.test.mjs byeolcheonji-provider.test.mjs byeolcheonji-security.test.mjs && node byeolcheonji-ui.test.cjs && node byeolcheonji-db.test.cjs && node byeolcheonji-compact-layout.test.cjs"',
              '"test:byeolcheonji": "node --test byeolcheonji-model.test.mjs byeolcheonji-provider.test.mjs byeolcheonji-security.test.mjs && node byeolcheonji-ui.test.cjs && node byeolcheonji-db.test.cjs && node byeolcheonji-compact-layout.test.cjs && node byeolcheonji-browser-guide.test.cjs"'
          )
          replace_once(
              'world-game-assets.js',
              "const revision='20261104-byeolcheonji-compact1';",
              "const revision='20261104-byeolcheonji-browser-choice1';"
          )
          replace_once(
              'world-game-assets.js',
              "byeolcheonji:'1.0.2'",
              "byeolcheonji:'1.0.3'"
          )
          release = Path('game-release.json')
          data = json.loads(release.read_text(encoding='utf-8'))
          if data.get('revision') != '20261104-byeolcheonji-compact1':
              raise SystemExit(f"unexpected game release revision: {data.get('revision')}")
          data['revision'] = '20261104-byeolcheonji-browser-choice1'
          release.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')
          replace_once(
              'world.html',
              '<script src="/world-game-assets.js?v=20261104-byeolcheonji-compact1" defer></script>',
              '<script src="/world-game-assets.js?v=20261104-byeolcheonji-browser-choice1" defer></script>'
          )
          PY
      - name: Install focused test dependencies
        run: npm --prefix tests ci --ignore-scripts
      - name: Run Byeolcheonji regressions
        run: |
          node --check byeolcheonji/browser-guide.js
          npm --prefix tests run test:byeolcheonji
          node tests/game-release-refresh.test.cjs
      - name: Commit verified update and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/temp-finish-byeolcheonji-browser-guide.yml
          git add -A
          git commit -m 'Complete Byeolcheonji browser guide preference'
          git push origin HEAD:fix-byeolcheonji-browser-guide-preference-20261104
