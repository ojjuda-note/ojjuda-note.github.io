name: Verify multiplayer rooms for five party games
on:
  push:
    branches: [release/remaining-party-live-stage]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Integrate verified room entry
        shell: bash
        run: |
          set -euo pipefail
          git apply --unidiff-zero --check .release/party-live.patch
          git apply --unidiff-zero .release/party-live.patch
          test "$(git hash-object world.html)" = '18e876c603aba112c9905408b455067e0cdb0f0f'
          for module in games/party-live/*.js; do node --check "$module"; done
          node --check features/arcade/arcade-rooms.js
          node scripts/check-source-layout.mjs
      - run: npm ci --prefix tests --ignore-scripts --no-audit --no-fund
      - run: node tests/staged-party-live.cjs
      - name: Stage verified multiplayer integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- world.html
          git commit -m 'Integrate five multiplayer party rooms with the arcade lobby'
          git push origin HEAD:refs/heads/release/remaining-party-live-stage
