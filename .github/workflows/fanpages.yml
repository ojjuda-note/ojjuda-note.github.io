name: Fanpage button regressions

on:
  workflow_dispatch:
    inputs:
      live:
        description: Verify the deployed public site against this checkout
        type: boolean
        default: false
  pull_request:
    paths:
      - 'features/fanpages/**'
      - 'shared/navigation/section-back.js'
      - 'tests/fanpage*.cjs'
      - 'tests/section-back-navigation.test.cjs'
      - 'tests/package*.json'
      - '.github/workflows/fanpages.yml'
  push:
    branches: [main]
    paths:
      - 'features/fanpages/**'
      - 'shared/navigation/section-back.js'
      - 'tests/fanpage*.cjs'
      - 'tests/section-back-navigation.test.cjs'
      - 'tests/package*.json'
      - '.github/workflows/fanpages.yml'

permissions:
  contents: read

concurrency:
  group: fanpages-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  buttons:
    name: Fanpage buttons and navigation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked test dependencies
        run: npm --prefix tests ci --ignore-scripts
      - name: Check all fanpage controls and in-page navigation
        run: npm --prefix tests run test:fanpages
      - name: Verify urgent fanpage schedules in mobile Chromium
        run: node tests/fanpage-urgent-events-ui.test.cjs
      - name: Save fanpage mobile verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fanpage-urgent-events-mobile
          path: tests/artifacts/fanpage-urgent-events/
          if-no-files-found: ignore
          retention-days: 7
  release-screen:
    name: Fanpage release screen and images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FANPAGE_LIVE: ${{ inputs.live || 'false' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked test dependencies
        run: npm --prefix tests ci --ignore-scripts
      - name: Check profiles, video IDs and JavaScript syntax
        run: |
          node features/fanpages/check-profiles.mjs
          node features/fanpages/check-videos.mjs
          for file in features/fanpages/*.js; do node --check "$file"; done
      - name: Verify release data, mobile layouts, original photos and lazy video dialogs
        run: node tests/fanpage-release-ui.test.cjs
      - name: Save release screen evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fanpage-release-screen
          path: tests/artifacts/fanpage-release/
          if-no-files-found: error
          retention-days: 14
