name: Fanpage button regressions

on:
  pull_request:
    paths:
      - 'features/fanpages/**'
      - 'shared/navigation/section-back.js'
      - 'tests/fanpage*.cjs'
      - 'tests/section-back-navigation.test.cjs'
      - 'tests/package*.json'
      - '.github/workflows/fanpages.yml'
  push:
    branches: [main]
    paths:
      - 'features/fanpages/**'
      - 'shared/navigation/section-back.js'
      - 'tests/fanpage*.cjs'
      - 'tests/section-back-navigation.test.cjs'
      - 'tests/package*.json'
      - '.github/workflows/fanpages.yml'

permissions:
  contents: read

concurrency:
  group: fanpages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  buttons:
    name: Fanpage buttons and navigation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked test dependencies
        run: npm --prefix tests ci --ignore-scripts
      - name: Check all fanpage controls and in-page navigation
        run: npm --prefix tests run test:fanpages
