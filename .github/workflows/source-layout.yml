name: Game and feature source layout
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node scripts/check-source-layout.mjs
      - run: node features/fanpages/check-profiles.mjs
      - run: node features/fanpages/check-videos.mjs
