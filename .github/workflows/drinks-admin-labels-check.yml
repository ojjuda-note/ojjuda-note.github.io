name: Verify drinking admin card labels
on:
  push:
    branches: [release/drinks-admin-labels-20261114]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check the updated admin entry
        run: |
          python - <<'PY'
          from pathlib import Path
          entry=Path('world.html')
          src=entry.read_text()
          old='world-admin-loader.js?v=20261114-drinks-content1'
          assert src.count(old)==1
          entry.write_text(src.replace(old,'world-admin-loader.js?v=20261114-drinks-list2'))
          PY
          test "$(git hash-object world.html)" = d1e297baf0d0296a34371d945cd91ab5c600338f
          node scripts/check-source-layout.mjs
      - run: npm ci --prefix tests --ignore-scripts --no-audit --no-fund
      - run: node tests/qa-admin-card-labels.cjs
        env:
          BROWSER_PATH: /usr/bin/google-chrome
      - name: Record verified admin entry
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add world.html
          git commit -m 'Verify admin catalog card labels in the arcade'
          git push origin HEAD:refs/heads/release/drinks-admin-labels-20261114
