name: Automatically purge retired card photos
on:
  schedule:
    - cron: '8,23,38,53 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['ops/trash-cleanup.py', '.github/workflows/trash-cleanup.yml']
permissions:
  contents: read
concurrency:
  group: ojjuda-trash-photo-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r ops/backup-requirements.txt
      - name: Remove only files already retired by the database
        run: python ops/trash-cleanup.py --apply
        env:
          SUPABASE_PROJECT_REF: ziezbdjofcugznowiuda
          SUPABASE_REGION: ap-northeast-2
          SUPABASE_DB_URL: ${{ secrets.BACKUP_SUPABASE_DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.BACKUP_SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_POOLER_HOST: aws-0-ap-northeast-2.pooler.supabase.com
          SUPABASE_S3_ACCESS_KEY: ${{ secrets.BACKUP_SUPABASE_S3_ACCESS_KEY }}
          SUPABASE_S3_SECRET_KEY: ${{ secrets.BACKUP_SUPABASE_S3_SECRET_KEY }}
