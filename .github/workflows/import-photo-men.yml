name: Import approved Photo Ttang portraits

on:
  push:
    branches: [codex/photo-men-import-20261021]
    paths: [.github/workflows/import-photo-men.yml]

permissions:
  contents: write

concurrency:
  group: photo-men-import-20261021
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/photo-men-import-20261021
          fetch-depth: 0
          sparse-checkout: |
            .github
            assets/photo-ttang
            games
            supabase
            tests
      - name: Import the verified, approved update into this review branch
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/photo-men.bundle"
          curl --fail --show-error --location --retry 3 --max-time 180 \
            'https://place-memo-walk.mj830417686850.chatgpt.site/updates/photo-men-fa886d02.bundle' \
            --output "$bundle"
          printf '%s  %s\n' '405354977ca7e409e9a8000524b75fed645f5a001777b0dc1e26dd380e9919be' "$bundle" | sha256sum --check --strict
          git bundle verify "$bundle"
          git fetch "$bundle" HEAD
          test "$(git rev-parse FETCH_HEAD)" = 'fa886d02b8234e9e4be121455ab525c43aafb642'
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo 'The approved photo update is already imported.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit FETCH_HEAD
          git diff --check origin/main..HEAD
          git push origin HEAD:refs/heads/codex/photo-men-import-20261021
