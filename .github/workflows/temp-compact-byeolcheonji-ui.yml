          replace_once('world.html', '<script src="/world-game-assets.js?v=20261104-archery-reset5" defer></script>', '<script src="/world-game-assets.js?v=20261104-byeolcheonji-compact1" defer></script>')

          release = Path('game-release.json')
          value = json.loads(release.read_text(encoding='utf-8'))
          if value.get('revision') != '20261104-archery-reset5':
