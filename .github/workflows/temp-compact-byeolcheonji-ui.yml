          Path('byeolcheonji/browser-guide.js').write_text(r'''(() => {
            'use strict';
            const dialog = document.getElementById('browser-guide');
            const openButton = document.getElementById('browser-guide-open');
            const confirmButton = document.getElementById('browser-guide-confirm');
            const copyButton = document.getElementById('browser-guide-copy');
            const address = document.getElementById('browser-guide-address');
            const feedback = document.getElementById('browser-guide-feedback');
            const shell = document.querySelector('.page-shell');
            const storageKey = 'ojjuda-byeolcheonji-browser-guide-v2';
            let previousFocus = null;
            let previousOverflow = '';

            function open() {
              if (dialog.open) return;
              previousFocus = document.activeElement;
              previousOverflow = document.body.style.overflow;
              feedback.textContent = '';
              document.body.style.overflow = 'hidden';
              if (typeof dialog.showModal === 'function') dialog.showModal();
              else {
                dialog.setAttribute('open', '');
                dialog.classList.add('is-fallback');
                shell.inert = true;
              }
              confirmButton.focus({ preventScroll: true });
            }

            function finish() {
              document.body.style.overflow = previousOverflow;
              shell.inert = false;
              dialog.classList.remove('is-fallback');
              try { localStorage.setItem(storageKey, 'seen'); } catch { /* The notice can still be closed. */ }
              const focusTarget = previousFocus instanceof HTMLElement && previousFocus !== document.body ? previousFocus : openButton;
              focusTarget.focus({ preventScroll: true });
            }

            function close() {
              if (typeof dialog.close === 'function') dialog.close();
              else { dialog.removeAttribute('open'); finish(); }
            }

            openButton.addEventListener('click', open);
            confirmButton.addEventListener('click', close);
            dialog.addEventListener('close', finish);
            dialog.addEventListener('keydown', event => {
              if (!dialog.classList.contains('is-fallback')) return;
              if (event.key === 'Escape') { event.preventDefault(); close(); }
              if (event.key === 'Tab') {
                if (event.shiftKey && document.activeElement === address) { event.preventDefault(); confirmButton.focus(); }
                else if (!event.shiftKey && document.activeElement === confirmButton) { event.preventDefault(); address.focus(); }
              }
            });
            copyButton.addEventListener('click', async () => {
              try {
                await navigator.clipboard.writeText('https://ojjuda.kr/star');
                feedback.textContent = '주소를 복사했어요.';
              } catch {
                address.focus();
                address.select();
                feedback.textContent = '주소를 길게 눌러 복사해 주세요.';
              }
            });
            let seen = false;
            try { seen = localStorage.getItem(storageKey) === 'seen'; } catch { /* Show it once when storage is unavailable. */ }
            const standalone = Boolean(navigator.standalone) || window.matchMedia?.('(display-mode: standalone)').matches;
            if (!seen && !standalone) open();
          })();
          ''', encoding='utf-8')

          Path('tests/byeolcheonji-compact-layout.test.cjs').write_text(r'''const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const path=require('node:path');
          const root=path.join(__dirname,'..');
          const html=fs.readFileSync(path.join(root,'byeolcheonji/index.html'),'utf8');
          const css=fs.readFileSync(path.join(root,'byeolcheonji/compact.css'),'utf8');
          const guide=fs.readFileSync(path.join(root,'byeolcheonji/browser-guide.js'),'utf8');
          assert.match(html,/compact\.css\?v=20261104-compact1/);
          assert.match(html,/>도움말<\/button>/);
          assert.match(html,/<h2 id="preferences-title">알림 조건<\/h2>/);
          assert.match(html,/<details class="compact-help"><summary>알림 사용 안내<\/summary>/);
          assert.match(html,/<details class="compact-help booking-help"><summary>예약 안내<\/summary>/);
          assert.doesNotMatch(html,/주말은 금·토 입실/);
          assert.doesNotMatch(html,/선택한 인원이 함께 묵을 수 있는 방을 찾아요/);
          assert.match(css,/@media\(max-height:700px\) and \(max-width:760px\)/);
          assert.match(css,/\.room-card-bottom p\{display:none\}/);
          assert.match(css,/\.result-state\{min-height:128px/);
          assert.match(guide,/localStorage\.getItem\(storageKey\)/);
          assert.doesNotMatch(guide,/sessionStorage/);
          console.log('PASS: compact copy, collapsed help and mobile control-first layout');
          ''', encoding='utf-8')

          replace_once(
