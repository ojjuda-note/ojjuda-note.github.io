      - name: Install test dependencies
        run: npm --prefix tests ci --ignore-scripts
      - name: Install Chromium for compact viewport check
        working-directory: tests
        run: npx playwright install --with-deps chromium
      - name: Run Byeolcheonji regressions
        run: |
          npm --prefix tests run test:byeolcheonji
          node tests/game-release-refresh.test.cjs
      - name: Check phone layout and create preview
        shell: bash
        run: |
          mkdir -p artifacts
          cat > /tmp/byeolcheonji-compact-preview.cjs <<'NODE'
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const {chromium}=require(process.cwd()+'/tests/node_modules/playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
            let html=fs.readFileSync('byeolcheonji/index.html','utf8');
            const css=fs.readFileSync('byeolcheonji/styles.css','utf8')+'\n'+fs.readFileSync('byeolcheonji/compact.css','utf8');
            html=html.replace(/<link[^>]+rel="stylesheet"[^>]*>/g,'').replace(/<script[\s\S]*?<\/script>/g,'').replace('</head>',`<style>${css}</style></head>`);
            await page.setContent(html,{waitUntil:'domcontentloaded'});
            await page.evaluate(()=>{
              document.querySelector('#member-gate').hidden=true;
              document.querySelector('#member-content').hidden=false;
              document.querySelector('#alarm-enable').disabled=false;
              document.querySelector('#alarm-status').textContent='알림을 켜면 알려드려요.';
              document.querySelector('#results-caption').textContent='전체 날짜 · 인원 전체 · 11.4~1.3';
              const count=document.querySelector('#match-count');count.hidden=false;count.textContent='1건';
              document.querySelector('#results').innerHTML='<section class="date-group"><h3 class="date-heading">11월 6일 (금)<small>입실</small></h3><div class="room-cards"><article class="room-card"><div class="room-card-main"><div class="room-details"><div class="room-topline"><h4 class="room-name">101호</h4></div><p class="room-capacity">기준 2인 · 최대 4인</p><p class="room-stay">11.6 입실 → 11.7 퇴실</p></div><div class="room-price">80,000원<small>1박 · 추가요금 별도</small></div></div><div class="room-card-bottom"><p>예약 상태를 확인해 주세요</p><a class="booking-link" href="#">예약 확인 ↗</a></div></article></div></section>';
            });
            const metrics=await page.evaluate(()=>{
              const box=s=>{const r=document.querySelector(s).getBoundingClientRect();return{top:r.top,bottom:r.bottom,height:r.height}};
              return{overflow:document.documentElement.scrollWidth-innerWidth,topbar:box('.topbar'),intro:box('.intro'),preferences:box('.preferences'),availability:box('.availability'),room:box('.room-card')};
            });
            assert.ok(metrics.overflow<=1,`horizontal overflow ${metrics.overflow}`);
            assert.ok(metrics.topbar.height<=55,`topbar ${metrics.topbar.height}`);
            assert.ok(metrics.preferences.height<310,`preferences ${metrics.preferences.height}`);
            assert.ok(metrics.availability.top<470,`availability starts ${metrics.availability.top}`);
            assert.ok(metrics.room.bottom<844,`first room ends ${metrics.room.bottom}`);
            await page.screenshot({path:'artifacts/byeolcheonji-compact-mobile.png',fullPage:true});
            await browser.close();
            console.log(JSON.stringify(metrics));
          })().catch(error=>{console.error(error);process.exit(1)});
