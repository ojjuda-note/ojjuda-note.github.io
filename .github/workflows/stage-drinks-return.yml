name: Verify direct arcade return from single-phone games
on:
  push:
    branches: [release/drinks-return-stage]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Integrate verified room entry
        shell: bash
        run: |
          set -euo pipefail
          git apply --unidiff-zero --check .release/drinks-return.patch
          git apply --unidiff-zero .release/drinks-return.patch
          test "$(git hash-object world.html)" = '7ab82ef2ea1ec51c5691272b6985a7a3ca9a59cd'
          for module in games/drinking/*.js games/party-live/*.js; do node --check "$module"; done
          node --check features/arcade/arcade-rooms.js
          node scripts/check-source-layout.mjs
      - run: npm ci --prefix tests --ignore-scripts --no-audit --no-fund
      - run: node --test tests/arcade-rooms-polling.test.cjs tests/adult-menu-visibility.test.cjs tests/matgo-access.test.cjs tests/world-adult-resume.test.cjs
      - run: node tests/staged-drinks-return.cjs
      - name: Stage verified multiplayer integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- world.html
          git commit -m 'Update the arcade return release revision'
          git push origin HEAD:refs/heads/release/drinks-return-stage
