name: Stage crocodile multiplayer release
on:
  push:
    branches: [release/croc-multiplayer-stage]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Apply reviewed source patch and copy verified game assets
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .release/croc.patch
          git apply .release/croc.patch
          mkdir -p games/croc/art games/croc/audio
          for file in art/croc.webp art/croc-board.webp audio/croc-laugh.wav audio/switch-click.wav; do
            curl --proto '=https' --fail --silent --show-error --retry 2 --max-time 30 "https://ojjuda-croc-rooms.mj830417686850.chatgpt.site/$file" -o "games/croc/$file"
          done
          sha256sum --check .release/croc-assets.sha256
          node --check games/croc/room.js
          node --check features/arcade/arcade-rooms.js
          node scripts/check-source-layout.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- world.html game-release.json features/arcade/arcade-rooms.js shared/games/world-game-assets.js games/croc/art games/croc/audio
          git commit -m 'Stage verified arcade integration and crocodile assets'
          git push origin HEAD:refs/heads/release/croc-multiplayer-stage
