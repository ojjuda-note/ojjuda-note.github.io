name: Verify Ojjuda brand copy and card prompt
on:
  push:
    branches: [feat/ojjuda-brand-copy-20261005]
    paths: [.github/workflows/ojjuda-brand-copy-verify.yml]
permissions:
  contents: write
jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      START_SHA: ${{ github.sha }}
      BASE_SHA: 862c225946a0b6ef845042c8b978c8a0cf929572
      BRANCH_NAME: feat/ojjuda-brand-copy-20261005
      OJJUDA_COPY_PROOF_DIR: /tmp/ojjuda-copy-proof
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Apply the scoped brand copy update
        run: |
          git fetch --no-tags origin "$BASE_SHA"
          git checkout --detach "$BASE_SHA"
          python3 - <<'COPY_PY'
          from pathlib import Path
          
          COPY = '오늘 하루 어땠나요? 괜찮았나요'
          CSS_LINK = '<link rel="stylesheet" href="/brand-copy.css?v=20261005-copy1">\n'
          changed = {}
          
          def replace(file, old, new):
              p = Path(file)
              source = changed.get(file, p.read_text())
              assert source.count(old) == 1, (file, old[:100], source.count(old))
              changed[file] = source.replace(old, new, 1)
          
          def stylesheet(file):
              replace(file, '</head>', CSS_LINK + '</head>')
          
          replace('index.html', '<title>오쭈다 월드 | 일상과 친구, 놀이가 만나는 곳</title>', f'<title>오쭈다 월드 | {COPY}</title>')
          replace('index.html', '<meta property="og:title" content="오쭈다 월드 | 일상과 친구, 놀이가 만나는 곳">', f'<meta property="og:title" content="오쭈다 월드 | {COPY}">')
          replace('index.html', 'content="나만의 우리집, 익명카드가 모이는 공원, 친구와 즐기는 게임과 생활 도구.', f'content="{COPY}. 나만의 우리집, 익명카드가 모이는 공원, 친구와 즐기는 게임과 생활 도구.')
          replace('index.html', 'content="방을 꾸미고, 공원에서 이야기하고, 친구와 게임을 즐겨요.', f'content="{COPY}. 방을 꾸미고, 공원에서 이야기하고, 친구와 게임을 즐겨요.')
          replace('index.html', '<h1 id="front-title">일상도, 친구도, 놀이도.<br><em>오쭈다 월드에서.</em></h1>', '<h1 id="front-title" class="ojjuda-copy">오늘 하루 어땠나요?<br><em>괜찮았나요</em></h1>')
          replace('index.html', '<h2 id="auth-title">오쭈다 월드</h2>', f'<h2 id="auth-title">오쭈다 월드</h2><p class="ojjuda-copy ojjuda-copy--auth">{COPY}</p>')
          stylesheet('index.html')
          
          replace('world.html', '<title>오쭈다월드</title>', f'<title>오쭈다 월드 | {COPY}</title>')
          replace('world.html', 'content="나만의 작은 방을 꾸미고, 친구 방에 놀러 가고, 동네 카페에서 새 친구를 만나요."', f'content="{COPY}. 나만의 방을 꾸미고 친구와 일상을 나누는 오쭈다 월드."')
          replace('world.html', '<meta property="og:title" content="오쭈다월드 베타">', f'<meta property="og:title" content="오쭈다 월드 | {COPY}">')
          replace('world.html', 'content="나만의 작은 방을 꾸미고 친구 방에 놀러 가요."', f'content="{COPY}. 나만의 방, 익명카드와 친구의 하루가 모이는 오쭈다 월드."')
          replace('world.html', 'manifest.webmanifest?v=20260929-logo1', 'manifest.webmanifest?v=20261005-copy1')
          replace('world.html', 'Oo=(t=!1,e="div")=>t?', 'Oo=(t=!1,e="div")=>(t?')
          replace('world.html', '<span class="logo-word">오쭈다<em>월드</em></span></${e}>`;function fo', '<span class="logo-word">오쭈다<em>월드</em></span></${e}>`)+`<p class="ojjuda-copy ojjuda-copy--world">'+COPY+'</p>`;function fo')
          stylesheet('world.html')
          
          replace('park/index.html', '<title>오쭈다 월드 · 공원 | 익명카드로 나누는 오늘</title>', f'<title>오쭈다 월드 · 공원 | {COPY}</title>')
          replace('park/index.html', '<meta property="og:title" content="오쭈다 월드 · 공원 | 익명카드로 나누는 오늘">', f'<meta property="og:title" content="오쭈다 월드 · 공원 | {COPY}">')
          replace('park/index.html', 'content="오늘의 생각을 짧은 익명카드로 남기고 다른 카드에 공감해 보세요.', f'content="{COPY}. 오늘의 마음을 익명카드로 나누고 서로 공감해 보세요.')
          replace('park/index.html', 'content="길게 쓰지 않아도 괜찮아요. 오늘의 한마디를 익명카드에 담고 다른 카드에 공감해 보세요."', f'content="{COPY}. 길게 쓰지 않아도 괜찮아요. 오늘의 마음을 익명카드에 담아 주세요."')
