          replace('park/index.html', '        <p class="compose-context" id="compose-context" hidden>', '        <p class="ojjuda-copy ojjuda-copy--composer" id="compose-brand-copy">'+COPY+'</p>\n        <p class="compose-context" id="compose-context" hidden>')
          replace('park/index.html', '<textarea id="compose-text" aria-label="카드 글"', '<textarea id="compose-text" aria-label="카드 글" aria-describedby="compose-brand-copy"')
          replace('park/index.html', '/note/preview.js?v=20261005-cleanup1', '/note/preview.js?v=20261005-copy1')
          stylesheet('park/index.html')
          
          replace('note/preview.js', "  if (kind === 'event') $('.composer-body').scrollTop = 0;\n  text.focus();", "  $('.composer-body').scrollTop = 0;\n  text.focus({ preventScroll: true });")
          replace('note/preview.js', 'if (!backdrop.hidden) text.focus();', 'if (!backdrop.hidden) text.focus({ preventScroll: true });')
          
          replace('guide.html', 'content="오쭈다 우리집과 공원의 가입,', f'content="{COPY}. 오쭈다 우리집과 공원의 가입,')
          replace('guide.html', '오쭈다 사용 안내 — 나를 닮은 방, 오늘을 담는 카드', f'오쭈다 사용 안내 | {COPY}')
          replace('guide.html', 'content="미니홈피 월드와 공원 익명카드.', f'content="{COPY}. 월드와 공원 익명카드.')
          replace('guide.html', '<h1 id="guide-title">우리집에<br><em>오늘을 담아요.</em></h1>', '<h1 id="guide-title" class="ojjuda-copy">오늘 하루 어땠나요?<br><em>괜찮았나요</em></h1>')
          replace('guide.html', '<strong>+ 버튼을 눌러 글을 적어요.</strong>본문은 200자까지 쓸 수 있어요.', '<strong>+ 버튼을 누르면 “'+COPY+'”가 보여요.</strong>오늘의 마음을 적어 주세요. 본문은 200자까지 쓸 수 있어요.')
          stylesheet('guide.html')
          
          replace('sitemap.html', 'content="오쭈다 월드 전체 메뉴.', f'content="{COPY}. 오쭈다 월드 전체 메뉴.')
          replace('sitemap.html', '<h1 id="map-title">월드 전체 메뉴</h1>', '<h1 id="map-title">월드 전체 메뉴</h1><p class="ojjuda-copy ojjuda-copy--map">'+COPY+'</p>')
          stylesheet('sitemap.html')
          replace('manifest.webmanifest', '"description": "나만의 작은 방을 꾸미고 친구 방에 놀러 가는 곳"', f'"description": "{COPY}. 일상과 마음을 나누는 오쭈다 월드."')
          
          css = Path('brand-copy.css')
          assert not css.exists()
          changed['brand-copy.css'] = '''/* Ojjuda's shared greeting, including the prompt before writing a card. */
          .ojjuda-copy{font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;word-break:keep-all;overflow-wrap:anywhere}
          .ojjuda-copy--world{margin:0;color:var(--ink-2,#626894);font-size:16px;line-height:1.55}
          .topbar{flex-wrap:wrap;row-gap:6px}
          .topbar>.ojjuda-copy--world{flex:1 0 100%;order:1;text-align:center;padding-top:4px}
          .side>.ojjuda-copy--world{margin:-8px 0 -4px}
          .auth-body>.ojjuda-copy--world,.auth-loading>.ojjuda-copy--world{text-align:center}
          .ojjuda-copy--auth{margin:0 0 14px;text-align:center;color:var(--muted,#626894);font-size:16px;line-height:1.6}
          .ojjuda-copy--feed{margin:0 0 14px;color:var(--ink);font-size:clamp(17px,2.5vw,20px);line-height:1.6}
          .ojjuda-copy--composer{margin:0 0 12px;padding:10px 12px;border-radius:12px;background:var(--accent-soft,#fceaf1);color:var(--ink,#23264a);font-size:18px;line-height:1.55}
          .front-heading>.ojjuda-copy--map{font-size:20px;line-height:1.6;color:var(--pink-ink,#a93263);margin:14px 0}
          @media(max-width:380px){.ojjuda-copy--composer{font-size:16px}}
          '''
          for file, content in changed.items():
              Path(file).write_text(content)
              print(file)
          COPY_PY
          git apply <<'COPY_TEST_PATCH'
