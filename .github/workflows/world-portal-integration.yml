name: Integrate and verify unified World portal
on:
  push:
    branches: [codex/world-unified-portal-20261005]
    paths: [.github/workflows/world-portal-integration.yml]
permissions:
  contents: write
concurrency:
  group: world-portal-integration
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      START_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Combine the World portal with current main
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git checkout --detach origin/main
          python3 - <<'PYTHON'
          import os,subprocess,json
          from pathlib import Path
          files=['sitemap.html','world-portal.css','sitemap-search.js','tests/world-portal-ui.test.cjs']
          for name in files:
              p=Path(name);p.parent.mkdir(parents=True,exist_ok=True)
              p.write_bytes(subprocess.check_output(['git','show',os.environ['START_SHA']+':'+name]))
          patch=Path(os.environ['RUNNER_TEMP'])/'world-portal-patch.py'
          patch.write_bytes(subprocess.check_output(['git','show',os.environ['START_SHA']+':.github/scripts/world-portal-patch.py']))
          subprocess.run(['python3',str(patch)],check=True)
          p=Path('tests/package.json');d=json.loads(p.read_text());command='node world-portal-ui.test.cjs'
          assert command not in d['scripts']['test:ui']
          d['scripts']['test:ui']=command+' && '+d['scripts']['test:ui']
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PYTHON
          git diff --check
      - name: Check directory destinations and static resources
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlsplit
          import xml.etree.ElementTree as ET
          class Page(HTMLParser):
           def __init__(self,name):
            super().__init__();self.ids=set();self.links=[];self.assets=[];self.destinations=[];self.groups=0;self.items=0;self.feed(Path(name).read_text())
           def handle_starttag(self,tag,attrs):
            a=dict(attrs)
            if 'id' in a:assert a['id'] not in self.ids,'Duplicate ID '+a['id'];self.ids.add(a['id'])
            if tag=='a' and 'href' in a:self.links.append(a['href'])
            if tag in ['script','img'] and 'src' in a:self.assets.append(a['src'])
            if tag=='link' and a.get('rel')=='stylesheet':self.assets.append(a['href'])
            if 'data-destination' in a:self.destinations.append(a['data-destination'])
            if 'data-map-group' in a:self.groups+=1
            if 'data-map-item' in a:self.items+=1
          pages={name:Page(name) for name in ['index.html','guide.html','sitemap.html']}
          assert pages['index.html'].destinations==['world']
          assert pages['sitemap.html'].items==49 and pages['sitemap.html'].groups==8
          for name in ['index.html','sitemap.html']:
           for href in pages[name].links+pages[name].assets:
            u=urlsplit(href)
            if u.scheme or u.netloc:continue
            target=u.path.lstrip('/') or (name if u.fragment else 'index.html')
            if target.endswith('/'):target+='index.html'
            assert Path(target).is_file(),'Missing destination: '+href
            if u.fragment:
             assert u.fragment in pages[target].ids,'Missing fragment: '+href
          xml=ET.parse('sitemap.xml').getroot();urls=[node.text for node in xml.findall('{*}url/{*}loc')]
          assert len(urls)==len(set(urls))==7
          assert all(url.startswith('https://ojjuda.kr/') and '#' not in url for url in urls)
          print('PASS: one World entrance, eight groups and 49 real guide links; unique IDs, existing assets and public XML destinations.')
          PYTHON
          node --check portal.js
          node --check sitemap-search.js
      - name: Install locked browser tools
        run: npm --prefix tests ci --ignore-scripts
      - name: Install Chromium for real layout and navigation checks
        working-directory: tests
        run: npx playwright install --with-deps chromium
      - name: Check entry, old links, directory search and guide navigation
        working-directory: tests
        run: |
          node inline-scripts.test.cjs
          node portal-auth-entry.test.cjs
          node world-portal-ui.test.cjs
      - name: Save only the checked World portal changes
        run: |
          git add index.html portal.js guide.html sitemap.html world-portal.css sitemap-search.js tests/world-portal-ui.test.cjs tests/package.json
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          tree=$(git write-tree)
          main_sha=$(git rev-parse origin/main)
          commit=$(git commit-tree "$tree" -p "$START_SHA" -p "$main_sha" -m 'Integrate the unified World entrance and searchable feature directory')
          git push origin "$commit:refs/heads/codex/world-unified-portal-20261005"
          echo "CHECKED_HEAD=$commit"
          echo "CHECKED_TREE=$tree"
          echo "BASE_MAIN=$main_sha"
          sha256sum index.html portal.js guide.html sitemap.html world-portal.css sitemap-search.js
