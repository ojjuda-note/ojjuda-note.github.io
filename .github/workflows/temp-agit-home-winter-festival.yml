name: Update directory home links and winter festival

on:
  push:
    branches:
      - fix-agit-home-logo-winter-festival-20261104

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply UI, data and test updates
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          def rep(path, old, new):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one match for {old[:90]!r}, found {text.count(old)}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          home = '<a class="agit-home-link" href="/world.html" aria-label="오쭈다 아지트 홈으로 이동"><img src="/favicon.svg?v=20261022-agit-logo2" alt="" width="24" height="24"><span>오쭈다 <strong>아지트</strong></span></a>'

          # Festival directory header: brand link goes directly to Agit home.
          festival_path = Path('world-festival-schedule.js')
          festival = festival_path.read_text(encoding='utf-8')
          old = '<header class="tour-game-header"><button type="button" aria-label="게임 목록으로 돌아가기">← 게임 목록</button><span>축제일정 <small>테스트</small></span></header>'
          new = f'<header class="tour-game-header">{home}<span>축제일정 <small>테스트</small></span></header>'
          if festival.count(old) != 1:
              raise SystemExit('festival header source changed')
          festival = festival.replace(old, new, 1)
          festival = festival.replace("   dialog.querySelector('button').addEventListener('click',close);\n", '', 1)
          festival = festival.replace("dialog.querySelector('button').focus({preventScroll:true})", "dialog.querySelector('.agit-home-link').focus({preventScroll:true})", 1)
          festival = festival.replace('index.html?v=20261104-directory-share1&embedded=1', 'index.html?v=20261104-agit-home1&embedded=1', 1)
          festival_path.write_text(festival, encoding='utf-8')

          # Restaurant directory header: same brand link and home behavior.
          restaurant_path = Path('world-restaurant-guide.js')
          restaurant = restaurant_path.read_text(encoding='utf-8')
          old = '<header class="restaurant-guide-header"><button type="button" aria-label="오락실 목록으로 돌아가기">← 오락실</button><span>인증맛집 <small>테스트</small></span></header>'
          new = f'<header class="restaurant-guide-header">{home}<span>인증맛집 <small>테스트</small></span></header>'
          if restaurant.count(old) != 1:
              raise SystemExit('restaurant header source changed')
          restaurant = restaurant.replace(old, new, 1)
          restaurant = restaurant.replace("   dialog.querySelector('button').addEventListener('click',()=>{void close();});\n", '', 1)
          restaurant = restaurant.replace("dialog.querySelector('button').focus({preventScroll:true})", "dialog.querySelector('.agit-home-link').focus({preventScroll:true})", 1)
          restaurant = restaurant.replace('index.html?v=20261104-directory-share1&embedded=1', 'index.html?v=20261104-agit-home1&embedded=1', 1)
          restaurant_path.write_text(restaurant, encoding='utf-8')

          styles = {
              'world-festival-schedule.css': '''
          .festival-schedule-dialog>.tour-game-header .agit-home-link{display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:4px 6px 4px 2px;border-radius:8px;color:#245a48;text-decoration:none;font:800 14px/1 system-ui,sans-serif;letter-spacing:-.03em;white-space:nowrap}
          .festival-schedule-dialog>.tour-game-header .agit-home-link img{display:block;width:24px;height:24px}
          .festival-schedule-dialog>.tour-game-header .agit-home-link strong{font-weight:800}
          .festival-schedule-dialog>.tour-game-header .agit-home-link:focus-visible{outline:2px solid #247060;outline-offset:1px}
          ''',
              'world-restaurant-guide.css': '''
          .restaurant-guide-header .agit-home-link{display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:4px 6px 4px 2px;border-radius:8px;color:#245a48;text-decoration:none;font:800 14px/1 system-ui,sans-serif;letter-spacing:-.03em;white-space:nowrap}
          .restaurant-guide-header .agit-home-link img{display:block;width:24px;height:24px}
          .restaurant-guide-header .agit-home-link strong{font-weight:800}
          .restaurant-guide-header .agit-home-link:focus-visible{outline:2px solid #247060;outline-offset:1px}
          '''
          }
          for filename, addition in styles.items():
              file = Path(filename)
              text = file.read_text(encoding='utf-8')
              if '.agit-home-link{' in text:
                  raise SystemExit(f'{filename}: home-link CSS unexpectedly exists')
              file.write_text(text.rstrip() + '\n' + addition.strip() + '\n', encoding='utf-8')

          rep('world-game-assets.js', "const revision='20261104-directory-share1';", "const revision='20261104-agit-home-winter1';")
          rep('world-game-assets.js', "festival:'1.2.0'", "festival:'1.2.1'")
          rep('world-game-assets.js', "restaurants:'1.9.0'", "restaurants:'1.9.1'")
          rep('world-game-assets.js', "festival:['/world-festival-schedule.css?v=20261104-directory-share1','/world-festival-schedule.js?v=20261104-directory-share1'],", "festival:['/world-festival-schedule.css?v=20261104-agit-home1','/world-festival-schedule.js?v=20261104-agit-home1'],")
          rep('world-game-assets.js', "'/world-restaurant-guide.css?v=20261103-restaurants-fit2','/world-restaurant-guide.js?v=20261104-directory-share1'", "'/world-restaurant-guide.css?v=20261104-agit-home1','/world-restaurant-guide.js?v=20261104-agit-home1'")
          rep('world.html', '<script src="/world-game-assets.js?v=20261104-directory-share1" defer></script>', '<script src="/world-game-assets.js?v=20261104-agit-home-winter1" defer></script>')

          release_path = Path('game-release.json')
          release = json.loads(release_path.read_text(encoding='utf-8'))
          if release.get('revision') != '20261104-directory-share1':
              raise SystemExit(f"unexpected release revision: {release.get('revision')}")
          release['revision'] = '20261104-agit-home-winter1'
          release_path.write_text(json.dumps(release, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')

          # Officially announced 2027 Hwacheon Sancheoneo Festival.
          events_path = Path('games/festival-schedule/events.json')
          data = json.loads(events_path.read_text(encoding='utf-8'))
          event = {
              'id': 'hwacheon-sancheoneo-2027',
              'title': '얼음나라화천 산천어축제',
              'category': 'local',
              'start': '2027-01-09',
              'end': '2027-01-31',
              'region': '강원',
              'city': '화천군',
              'venue': '화천천 및 화천읍 일원',
              'address': '강원특별자치도 화천군 화천읍 산천어길 137',
              'lat': 38.1043,
              'lng': 127.6982,
              'geoApprox': True,
              'summary': '화천천 얼음판에서 산천어 낚시와 눈·얼음 체험을 즐기는 겨울축제입니다. 2027년 세부 프로그램은 주최 측이 업데이트 중입니다.',
              'scheduleNote': '2027년 1월 9일~31일 / 운영시간·예약·세부 프로그램은 추후 공식 안내 확인',
              'priceNote': '유료 / 2027년 체험료는 공식 안내 확인',
              'accessNote': '결빙과 기상 상황에 따라 운영이 바뀔 수 있으니 방문 전 공식 공지를 확인해 주세요.',
              'sourceUrl': 'https://www.ihc.go.kr/www/selectBbsNttView.do?bbsNo=11&key=2338&nttNo=187602',
              'sourceName': '화천군',
              'sourceCheckedAt': '2026-11-04',
              'verificationSources': ['https://korean.visitkorea.or.kr/kfes/detail/fstvlDetail.do?fstvlCntntsId=02a1c2ab-bce7-404a-9c8f-4eb4ac69acb3'],
              'tags': ['산천어축제', '얼음낚시', '겨울축제', '가족'],
              'status': 'scheduled'
          }
          events = [item for item in data.get('events', []) if item.get('id') != event['id']]
          index = next((i for i, item in enumerate(events) if item.get('start') is None or item.get('start') > event['start']), len(events))
          events.insert(index, event)
          data['events'] = events
          data['updatedAt'] = '2026-11-04'
          events_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Update the existing integration fixture from a close button to a home link.
          rep('tests/festival-entry.test.cjs',
              "  set innerHTML(html){this.button=new Element('button');this.frame=new Element('iframe');this.frame.src=html.match(/<iframe[^>]*src=\"([^\"]+)\"/)[1];}\n  querySelector(selector){return selector==='iframe'?this.frame:selector==='button'?this.button:null;}",
              "  set innerHTML(html){this.homeLink=new Element('a');this.homeLink.href='/world.html';this.frame=new Element('iframe');this.frame.src=html.match(/<iframe[^>]*src=\"([^\"]+)\"/)[1];}\n  querySelector(selector){return selector==='iframe'?this.frame:selector==='.agit-home-link'?this.homeLink:null;}")
          rep('tests/festival-entry.test.cjs',
              "assert.equal(f.focused(),first.button,'the return button receives initial focus');",
              "assert.equal(f.focused(),first.homeLink,'the Agit home link receives initial focus');")
          rep('tests/festival-entry.test.cjs',
              "first.button.click();assert.equal(first.isConnected,false);assert.equal(first.open,false);",
              "assert.equal(first.homeLink.href,'/world.html','the logo links to Agit home');f.api.close();assert.equal(first.isConnected,false);assert.equal(first.open,false);")
          rep('tests/festival-entry.test.cjs',
              "assert.equal(boot.window.OjjudaGameAssets.version('festival'),'1.2.0');",
              "assert.equal(boot.window.OjjudaGameAssets.version('festival'),'1.2.1');")

          Path('tests/directory-home-logo.test.cjs').write_text(r'''const assert=require('node:assert/strict'),fs=require('node:fs');
          const read=file=>fs.readFileSync(file,'utf8');
          for(const source of [read('world-festival-schedule.js'),read('world-restaurant-guide.js')]){
            assert.match(source,/class="agit-home-link" href="\/world\.html"/);
            assert.match(source,/aria-label="오쭈다 아지트 홈으로 이동"/);
            assert.match(source,/querySelector\('\.agit-home-link'\)\.focus/);
          }
          assert.doesNotMatch(read('world-festival-schedule.js'),/← 게임 목록/);
          assert.doesNotMatch(read('world-restaurant-guide.js'),/← 오락실/);
          assert.equal(JSON.parse(read('game-release.json')).revision,'20261104-agit-home-winter1');
          assert.ok(JSON.parse(read('games/festival-schedule/events.json')).events.some(event=>event.id==='hwacheon-sancheoneo-2027'&&event.start==='2027-01-09'&&event.end==='2027-01-31'));
          console.log('directory home logo and winter festival checks passed');
          ''',encoding='utf-8')
          PY
      - name: Validate changes
        run: |
          node --check world-festival-schedule.js
          node --check world-restaurant-guide.js
          node --check world-game-assets.js
          node tests/directory-home-logo.test.cjs
          node games/festival-schedule/validate.mjs
          node tests/festival-core.test.mjs
          node tests/festival-entry.test.cjs
          node tests/game-release-refresh.test.cjs
      - name: Commit verified update
        shell: bash
        run: |
          rm .github/workflows/temp-agit-home-winter-festival.yml
          git config user.name 'ojjuda-note'
          git config user.email 'mj830417@naver.com'
          git add -A
          git commit -m 'Link directory headers to Agit home and add winter festival'
          git push origin HEAD:fix-agit-home-logo-winter-festival-20261104
