name: Verify and stage king result layout
on:
  push:
    branches: [release/king-reveal-layout-stage]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Integrate verified room entry
        shell: bash
        run: |
          set -euo pipefail
          git apply --unidiff-zero --check .release/king-reveal.patch
          git apply --unidiff-zero .release/king-reveal.patch
          test "$(git hash-object world.html)" = '1b8a08d8253fd0b5b1e9ddc272006e381acfa3bb'
          node --check games/king/room.js
          node --check features/arcade/arcade-rooms.js
          node scripts/check-source-layout.mjs
      - run: npm ci --prefix tests --ignore-scripts --no-audit --no-fund
      - run: node tests/staged-king-reveal.cjs
      - name: Stage verified king integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- world.html
          git commit -m 'Update arcade cache for king result layout'
          git push origin HEAD:refs/heads/release/king-reveal-layout-stage
