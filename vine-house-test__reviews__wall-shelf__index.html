<!doctype html><html lang="ko"><meta charset="utf-8"><base href="/house-test/"><title>원목 벽선반 · 우리집</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4efe7;color:#43382d;font:17px/1.55 system-ui,sans-serif}main{width:min(1240px,100%);margin:auto;padding:30px 36px}h1{font-size:29px;margin:0}p{margin:5px 0 22px;color:#746452}.badge{font-size:13px;background:#eadbca;border-radius:30px;padding:5px 12px;float:right}.comparison{display:grid;grid-template-columns:220px 1fr;gap:22px}.card{background:#fffcf7;border:1px solid #e7dbcd;border-radius:18px;padding:18px}h2{font-size:17px;margin:0 0 10px}.ref{display:block;height:260px;max-width:100%;margin:auto;object-fit:contain}.views{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;height:260px;align-items:center}.views canvas{width:100%;height:150px;object-fit:contain}.views div{text-align:center}.views small{display:block;color:#816f5d}.room-card{margin-top:20px}.room{display:block;width:100%;height:auto;border-radius:12px}.note{font-size:13px;margin:14px 2px 0;color:#776958}button{font:inherit;padding:7px 13px;border:1px solid #d8c4ad;border-radius:10px;background:#f5ede3;color:#614b35;margin-right:7px;cursor:pointer}button[aria-pressed=true]{background:#a37b50;color:white}header{margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}header h2{margin:0}
@media(max-width:650px){main{padding:20px 12px}.comparison{grid-template-columns:1fr}.ref{height:150px}.views{height:170px}.views canvas{height:110px}header{display:block}nav{margin-top:10px}button{font-size:14px;padding:6px}.badge{float:none;display:inline-block;margin-bottom:8px}}</style>
<main><span class="badge">우리집 소품</span><h1>원목 벽선반</h1><p>방 꾸미기 → 소품 → 벽선반 놓기에서 사용할 수 있어요.</p>
<div class="comparison"><section class="card"><h2>기준 사진 확대</h2><img class="ref" src="/house-test/reviews/wall-shelf/reference.png"></section><section class="card"><h2>같은 선반의 세 방향</h2><div class="views"><div><canvas id="left"></canvas><small>왼쪽 벽</small></div><div><canvas id="center"></canvas><small>뒤쪽 벽</small></div><div><canvas id="right"></canvas><small>오른쪽 벽</small></div></div></section></div>
<section class="card room-card"><header><h2>실제 방에서 크기 확인</h2><nav><button data-view="left">왼쪽 벽</button><button data-view="center">뒤쪽 벽</button><button data-view="right" aria-pressed="true">오른쪽 벽</button></nav></header><canvas id="room" class="room" width="3014" height="2088"></canvas><p class="note">선반 크기 1.2 × 0.4칸 · 판 두께 0.12칸 · 바닥에서 높이 2.65칸. 화분은 별도로 놓습니다.</p></section></main>
<script type="module">
import {loadBuiltInItems} from '/house-test/custom-furniture.js?v=20261006-vine1';
import {FURNITURE} from '/house-test/furniture-catalog.js?v=20261006-vine1';
import {furnitureGeometry} from '/house-test/furniture.js?v=20261006-vine1';
import {paintFurniture} from '/house-test/furniture-painter.js?v=20261006-vine1';
import {canPlaceFurniture} from '/house-test/model.js?v=20261006-vine1';
const id='item-oak-wall-shelf';
await loadBuiltInItems(['sofa',id]);
if(!FURNITURE[id]?.wallMounted)throw new Error('벽선반 목록을 불러오지 못했어요.');
const placements=FURNITURE[id].preferredViews;
async function drawItem(id,p){
 const g=furnitureGeometry(id,p),host=document.createElement('div'),canvas=document.createElement('canvas');host.hidden=true;host.append(canvas);document.body.append(host);
 try{await paintFurniture(canvas,g);return {g,canvas};}finally{host.remove();}
}
for(const d of ['left','center','right']){const {canvas}=await drawItem(id,placements[d]),c=document.getElementById(d);c.width=canvas.width;c.height=canvas.height;c.getContext('2d').drawImage(canvas,0,0);}
const scene=[{id:'sofa',direction:'left',x:0,y:3},{id:'bookshelf',direction:'right',x:9,y:.5},{id:'desk',direction:'right',x:9,y:3.5}];
const background=new Image();background.src='/house-test/assets/room-day-v3.webp';await background.decode();
const canvas=document.getElementById('room'),ctx=canvas.getContext('2d');let rendering=false;
async function render(direction){
 if(rendering)return;rendering=true;
 try{
 const p=placements[direction];if(!canPlaceFurniture(id,p,scene))throw new Error('선반 위치를 확인해 주세요.');
 ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(background,0,0,canvas.width,canvas.height);
 for(const item of [...scene,{id,...p}]){const {g,canvas:part}=await drawItem(item.id,item);ctx.drawImage(part,g.left*2,g.top*2,g.width*2,g.height*2);}
 document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===direction)));document.body.dataset.ready=direction;
 }finally{rendering=false;}
}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>render(b.dataset.view));await render('right');
</script></html>
