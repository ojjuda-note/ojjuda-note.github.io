<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>창작만화 · 오쭈다</title><link rel="stylesheet" href="/comics/style.css?v=20261011-1"><script src="/config.js" defer></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2" defer></script><script src="/comics/app.js?v=20261011-speed1" defer></script></head><body>
<header><a class="back" href="/world.html?tab=board">‹ 오쭈다 게시판</a><strong>창작만화 <span class="badge">19</span></strong><button id="uploadOpen" hidden>＋ 만화 올리기</button></header>
<main><section id="gate" class="gate"><span class="badge large">19</span><h1>창작만화</h1><p id="gateMessage" role="status">이용 가능 여부를 확인하고 있어요.</p><a id="login" class="button" href="/?auth=login&next=world" hidden>로그인하기</a><button id="retry" hidden>다시 확인</button><small>가입 생년월일 기준, 만 19세 이상 회원만 볼 수 있어요.</small></section>
<section id="shelf" hidden><div class="heading"><div><span class="eyebrow">OJJUDA COMICS</span><h1>한 장씩, 새로운 이야기.</h1><p>오쭈다에서 만나는 창작만화</p></div><button id="refresh">새로고침</button></div><div id="books" class="books"></div></section>
<section id="editor" hidden><div class="heading"><h1>만화 올리기</h1><button id="cancelUpload">취소</button></div><form id="uploadForm"><label>만화 제목<input id="title" required maxlength="120" placeholder="제목 또는 회차를 입력하세요"></label><label>소개<textarea id="description" maxlength="1000" rows="3" placeholder="짧은 소개 (선택)"></textarea></label><label class="pick">만화 이미지 선택<input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp" multiple required><small>PNG · JPG · WEBP, 한 장 최대 20MB, 최대 500장</small></label><div class="heading"><p id="fileCount">파일을 선택해 주세요.</p><button id="sort" type="button">번호순 정렬</button></div><p class="hint">1 → 1-1 → 2 순으로 정렬돼요. 화살표로 순서를 바꿀 수 있어요.</p><ol id="fileList"></ol><progress id="uploadProgress" max="100" value="0" hidden></progress><p id="uploadStatus" role="status"></p><button id="publish" class="primary" type="submit">업로드 후 공개</button></form></section>
</main>
<section id="reader" hidden aria-label="만화 뷰어"><div class="readerbar"><button id="readerBack">‹ 목록</button><strong id="readerTitle"></strong><select id="viewMode" aria-label="보기 방식"><option value="single">한 장</option><option value="spread">두 장</option><option value="scroll">세로 스크롤</option></select><button id="zoomOut" aria-label="축소">−</button><button id="fit">맞춤</button><button id="zoomIn" aria-label="확대">＋</button></div><div id="viewport" tabindex="0"><div id="pages"></div></div><div class="readerfoot"><button id="prev">이전</button><input id="page" aria-label="페이지 번호" type="number" min="1"><span id="total"></span><span id="zoomValue">100%</span><button id="next">다음</button></div></section>
<div id="toast" role="status" aria-live="polite"></div></body></html>
