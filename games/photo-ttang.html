async function personMask(img){ // 사람일 확률 (배경 확률의 반대) → 0/1 마스크, 가장 큰 덩어리만

  const redraw=()=>{ for(let i=0;i<m.length;i++){ td.data[i*4]=28; td.data[i*4+1]=20; td.data[i*4+2]=56; td.data[i*4+3]=m[i]?0:190; } tx.putImageData(td,0,0);
    ex.clearRect(0,0,ed.width,ed.height); ex.drawImage(canvas,crop.L,crop.T,crop.cw,crop.ch,0,0,ed.width,ed.height); ex.drawImage(tint,crop.L/sx,crop.T/sy,crop.cw/sx,crop.ch/sy,0,0,ed.width,ed.height);
    const pct=gridFor(src,crop).pct, ok=pct>=SIL_MIN&&pct<=SIL_MAX; const f=box.querySelector('#fmsg');
    f.innerHTML=`칠한 부분 <b>${pct.toFixed(0)}%</b> · `+(ok?'좋아요! 넘어갈 수 있어요':pct<SIL_MIN?`${SIL_MIN}% 이상 칠해야 넘어갈 수 있어요 (더 칠하거나 🔍 가까이)`:`${SIL_MAX}%보다 적어야 해요 · 배경을 지워 주세요`); f.className='hint '+(ok?'ok':'bad');
    const pf=box.querySelector('#pfill'); pf.style.width=Math.min(100,pct/90*100)+'%'; pf.className=ok?'ok':'bad'; box.querySelector('#done').disabled=!ok;
    box.querySelector('#zin').disabled=crop.a<=VIEW_MIN+.001; box.querySelector('#zout').disabled=crop.a>=VIEW_MAX-.001; };
  let pend=false; const schedule=()=>{ if(pend) return; pend=true; requestAnimationFrame(()=>{ pend=false; redraw(); }); };
  const zoom=d=>{ const a=Math.max(VIEW_MIN,Math.min(VIEW_MAX,Math.round((crop.a+d)*100)/100)); crop=cropFor(src,a,crop.L+crop.cw/2,crop.T+crop.ch/2); redraw(); };
  box.querySelectorAll('.fb').forEach(b=>b.onclick=()=>{ modeV=+b.dataset.m; box.querySelectorAll('.fb').forEach(x=>x.classList.toggle('on',x===b)); });
  box.querySelector('#zin').onclick=()=>zoom(-.05); box.querySelector('#zout').onclick=()=>zoom(.05);
  let drawing=false; const paint=ev=>{ const r=ed.getBoundingClientRect(); const u=(ev.clientX-r.left)/r.width, v=(ev.clientY-r.top)/r.height; const X=(crop.L+u*crop.cw)/sx, Y=(crop.T+v*crop.ch)/sy, R=.045*Math.max(crop.cw/sx,crop.ch/sy);
    for(let y=Math.max(0,Math.floor(Y-R));y<=Math.min(mh-1,Math.ceil(Y+R));y++) for(let x=Math.max(0,Math.floor(X-R));x<=Math.min(mw-1,Math.ceil(X+R));x++) if((x-X)**2+(y-Y)**2<=R*R) m[y*mw+x]=modeV; schedule(); };
  ed.addEventListener('pointerdown',ev=>{ drawing=true; ed.setPointerCapture&&ed.setPointerCapture(ev.pointerId); paint(ev); });
  ed.addEventListener('pointermove',ev=>{ if(drawing) paint(ev); }); const up=()=>{ drawing=false; redraw(); }; ed.addEventListener('pointerup',up); ed.addEventListener('pointercancel',up);
  redraw(); box.querySelector('#done').onclick=()=>{ const pct=gridFor(src,crop).pct; if(pct<SIL_MIN||pct>SIL_MAX) return; src.crop=crop; stepPreview(box,src,o); }; }
$('uploadBtn').onclick=()=>uploadPanel();
$('snd').onclick=()=>{ sound=!sound; $('snd').textContent=sound?'🔊':'🔇'; };
$('pause').onclick=()=>{ if(over||mode!=='play') return; paused=true; panel(`<h2>잠깐 쉬는 중</h2><button class="big a" id="go">계속하기</button><button class="big g" id="list">${menuLabel()}</button>`,{go:()=>{ paused=false; },list:()=>{ paused=false; toMenu(); }}); };
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&mode==='play'&&!paused&&!over) $('pause').click(); });
// ---------- 루프 ----------
let last=performance.now(), hudT=0;
function loop(now){ if(mode==='closed')return;if(mode==='play'&&!photoAllowed())lockPhotoGame();const dt=Math.min(.05,(now-last)/1000); last=now;
  if(world) world.setViewScale(view().S);
  if(world&&mode==='play'&&!paused&&photoImg?.naturalWidth>0){ if(startWait>0){ startWait-=dt; const n=Math.ceil(startWait); if(n!==cdLast&&n>0){ cdLast=n; tone(660,.12,'triangle',.07); } if(startWait<=0){ startWait=0; tone(990,.25,'triangle',.08); toast('시작!','#F2C14E'); } } else if(revealT>=0) revealT+=dt; else { world.step(dt); if(me&&me.freezeT>0){ const n=Math.ceil(me.freezeT); if(n!==frzLast){ frzLast=n; tone(660,.1,'triangle',.06); } } updateMobs(dt); handleEvents(); if(!over&&me.alive&&mySil/silTotal>=GOAL){ win(); }
      if(!over){ const left=endAt-world.time; if(left<=10&&Math.ceil(left)!==tick){ tick=Math.ceil(left); if(tick>0){ tone(tick<=3?990:740,.08,'square',.05); try{ navigator.vibrate&&navigator.vibrate(15); }catch{} } }
        if(left<=0) timeUp(); } } }
  draw(paused?0:dt); if(now-hudT>120){ hudT=now; hud(); } requestAnimationFrame(loop); }
function disposePhotoGame(){ ++gridEpoch;mode='closed';over=true;paused=true;world=me=null;uploadTrial=null;photoImg=fullImg=blurredPhoto=null;joys.clear();document.querySelectorAll('.joy').forEach(e=>e.remove());releasePhotoAccess?.(); }
window.OjjudaPhotoTtang={menu:toMenu,dispose:disposePhotoGame,demo:()=>{if(!PUBLIC_DEMO)return false;resize();renderGrid();lives=LIVES;return startStage(0);}};
addEventListener('keydown',e=>{if(e.key==='Escape'&&parent!==window){e.preventDefault();parent.postMessage({type:'ojjuda:photottang:close'},location.origin);}});
const releasePhotoAccess=PUBLIC_DEMO?null:photoAccess?.subscribe(lockPhotoGame);
addEventListener('pagehide',disposePhotoGame,{once:true});
addEventListener('pageshow',event=>{if(event.persisted)location.reload();});
if(PUBLIC_DEMO){mode='demo-ready';$('menu').style.display='none';}else if(photoAllowed())toMenu();else Promise.resolve(photoAccess?.check()).then(()=>photoAllowed()?toMenu():lockPhotoGame()).catch(lockPhotoGame);
requestAnimationFrame(loop);
