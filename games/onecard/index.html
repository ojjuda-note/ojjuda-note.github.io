<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#123c34">
  <meta name="description" content="부드럽게 나눠지는 카드, 조용한 테이블. 혼자서도 친구와도 항상 5명, 빈자리는 컴퓨터가 채우는 오쭈다 원카드.">
  <title>원카드 · 오쭈다 오락실</title>
  <link rel="icon" href="./cover.svg?v=20261120-onecard3" type="image/svg+xml">
  <link rel="stylesheet" href="/shared/games/game-entry.css?v=20261109-unified-multiplayer-ui2">
  <link rel="stylesheet" href="/shared/games/game-results.css?v=20261116-yut-destinations">
  <link rel="stylesheet" href="./style.css?v=20261120-onecard3">
  <script defer src="/config.js"></script>
  <script type="module" src="./app.mjs?v=20261120-onecard3"></script>
</head>
<body>
<div id="onecard-app" class="app" data-view="welcome">
  <header class="topbar">
    <a id="arcade-back" class="icon-btn back-link" href="/world.html?tab=arcade" aria-label="오락실로 돌아가기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6M8 12h12"/></svg><span>오락실</span></a>
    <div class="brand"><h1>원카드</h1></div>
    <div class="topbar-actions">
      <button id="sound-toggle" class="icon-btn" type="button" aria-label="효과음 끄기" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m11 5-5 4H3v6h3l5 4V5Zm4 4a5 5 0 0 1 0 6m3-9a9 9 0 0 1 0 12"/></svg></button>
      <button id="menu-button" class="icon-btn" type="button" aria-label="게임 메뉴" aria-haspopup="dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14"/></svg></button>
    </div>
  </header>
  <main class="table" id="game-table" aria-label="원카드 테이블" inert>
    <div class="table-line" aria-hidden="true"></div>
    <div class="table-watermark" aria-hidden="true"><span>ONE CARD</span><small>즐거움이 모이는 자리</small></div>
    <div id="opponents" class="opponents" aria-label="상대 플레이어"></div>
    <div class="center-piles">
      <button id="draw-pile" class="pile stock" type="button" aria-label="카드 한 장 받기" disabled><span id="stock-card" class="pile-card"></span><span class="pile-label">가져오기 <b id="deck-count">54</b></span></button>
      <div class="pile discard"><span id="discard-card" class="pile-card"></span><span class="pile-label">펼친 카드</span></div>
    </div>
    <div class="table-status"><span id="suit-indicator" class="suit-indicator" hidden></span><span id="direction" class="direction" aria-label="진행 방향">시계 방향</span></div>
    <div id="turn-timer" class="turn-timer" hidden><span></span></div>
  </main>
  <section id="hand-area" class="hand-area" aria-label="내 카드" inert>
    <div class="hand-meta"><span class="my-name"><span class="my-dot" aria-hidden="true"></span><b id="my-name">나</b><span id="my-count">7장</span></span><strong id="turn-label">같은 무늬나 숫자를 이어 보세요</strong><span id="hand-pager" class="hand-pager" hidden><button id="previous-cards" class="icon-btn" type="button" aria-label="앞쪽 카드">‹</button><span id="hand-page"></span><button id="next-cards" class="icon-btn" type="button" aria-label="뒤쪽 카드">›</button></span></div>
    <div id="hand" class="hand" role="group" aria-label="내 카드 목록"></div>
    <p id="status" class="status" role="status" aria-live="polite">같은 무늬나 숫자를 내면 돼요.</p>
  </section>
  <footer id="game-controls" class="controls" inert>
    <button id="rules-button" class="icon-btn rules-button" type="button" aria-label="원카드 규칙" aria-haspopup="dialog">?<span>규칙</span></button>
    <button id="draw-button" class="btn btn-secondary" type="button" disabled>한 장 받기</button>
    <button id="onecard-button" class="btn btn-primary onecard-button" type="button" aria-pressed="false" disabled>원카드!</button>
  </footer>
  <p id="connection" class="connection" role="status" hidden></p>
  <section id="entry" class="overlay welcome" aria-labelledby="entry-title">
    <div class="dialog welcome-card game-entry">
      <span class="ge-kicker">오쭈다 오락실</span>
      <h2 id="entry-title" class="ge-title">원카드</h2>
      <div id="hero-cards" class="hero-cards" aria-hidden="true"></div>
      <p class="ge-copy welcome-copy">같은 무늬나 숫자를 이어 내고,<br>카드를 먼저 없애면 승리!</p>
      <p class="ge-hint entry-capacity">항상 5명</p>
      <div class="entry-actions"><button id="solo-start" class="ge-primary" type="button">혼자 하기 <span>컴퓨터 4명과 대전</span></button><button id="online-open" class="ge-secondary" type="button">함께 하기 <span>5명 · 빈자리는 컴퓨터</span></button></div>
      <div class="entry-links"><button id="resume-solo" class="ge-secondary resume-button" type="button" hidden>이어서 하기</button><button id="entry-rules" class="ge-secondary" type="button">게임 방법</button><a id="entry-exit" class="ge-secondary" href="/world.html?tab=arcade">오락실로</a></div>
    </div>
  </section>
  <section id="lobby" class="overlay" aria-labelledby="lobby-title" hidden>
    <div class="dialog lobby-card"><h2 id="lobby-title">함께하는 원카드</h2><p class="lobby-caption">빈자리는 컴퓨터가 채워요.</p>
      <div id="room-entry"><button id="create-room" class="btn btn-primary" type="button">새 방 만들기</button><div class="entry-divider"><span>또는</span></div><form id="join-form"><label for="room-code">초대받은 방 코드</label><div class="join-row"><input id="room-code" name="code" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="8" placeholder="8자리 코드" pattern="[A-Fa-f0-9]{8}" required><button id="join-room" class="btn btn-secondary" type="submit">참여</button></div></form><p class="small-note">멀티는 오쭈다 로그인 후 이용할 수 있어요.</p><a id="login-link" class="btn btn-secondary" href="/?auth=login&amp;next=world" hidden>오쭈다 로그인하기</a></div>
      <div id="room-waiting" hidden><div class="room-code-row"><div><span class="small-note">우리 방 코드</span><strong id="room-code-display"></strong></div><button id="copy-invite" class="btn btn-secondary" type="button">초대 링크</button></div><ol id="room-players" class="room-players" aria-label="참여한 사람"></ol><p id="lobby-note" class="small-note" role="status"></p><button id="start-room" class="btn btn-primary" type="button" disabled>게임 시작</button></div>
      <p id="lobby-error" class="inline-error" role="alert" hidden></p><button id="lobby-back" class="text-btn" type="button">돌아가기</button>
    </div>
  </section>
</div>
<div id="motion-layer" class="motion-layer" aria-hidden="true"></div>
<dialog id="sheet" class="sheet" aria-labelledby="sheet-title"><div class="sheet-header"><h2 id="sheet-title"></h2><button id="sheet-close" class="icon-btn" type="button" aria-label="닫기">×</button></div><div id="sheet-body" class="sheet-body"></div></dialog>
<div id="toast" class="toast" role="status" hidden></div>
<noscript>원카드를 즐기려면 브라우저에서 JavaScript를 켜 주세요.</noscript>
</body>
</html>
