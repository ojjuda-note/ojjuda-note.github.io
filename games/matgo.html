  await Promise.all(flies.map((f,i)=>{ const r=src[i].r; const tx=cx-w/2+(i-1)*w*.62-r.left, ty=cy-h/2-r.top; const rot=(i-1)*14; if(!mine) setTimeout(()=>{ f.innerHTML=cardSVG(cards[i]); },230); return f.animate([{transform:`translate(0,0) scale(${r.width/w}) rotateY(0deg)`},{transform:`translate(${tx*.5}px,${ty*.5-40}px) scale(.9) rotateY(${mine?0:90}deg)`,offset:.5},{transform:`translate(${tx}px,${ty}px) scale(1) rotate(${rot}deg)`}],{duration:520,delay:i*70,easing:'cubic-bezier(.25,.7,.3,1)',fill:'forwards'}).finished; }));
  // 2) 흔들흔들 (부채꼴 유지)
  Sound.play('shake');
  const wob=flies.map((f,i)=>{ const r=src[i].r; const tx=cx-w/2+(i-1)*w*.62-r.left, ty=cy-h/2-r.top; const rot=(i-1)*14; const base=`translate(${tx}px,${ty}px)`; return f.animate([0,1,2,3,4,5,6].map(k=>({transform:`${base} rotate(${rot+(k%2?10:-10)*(k===6?0:1)}deg) translateY(${k%2?-6:0}px)`})),{duration:760,easing:'ease-in-out',fill:'forwards'}).finished; });
  banner(mine?'흔들기!':'상대 흔들기!',`${cards[0].m}월 세 장 · 이기면 점수 ×2`,mine?'brag':'warn',1300); try{ navigator.vibrate&&navigator.vibrate([25,35,25,35,25]); }catch{}
  await Promise.all(wob); await sleep(260);
  // 3) 다시 손으로
  await Promise.all(flies.map((f,i)=>{ const r=src[i].r; const tx=cx-w/2+(i-1)*w*.62-r.left, ty=cy-h/2-r.top; const rot=(i-1)*14; if(!mine) setTimeout(()=>{ f.innerHTML=backSVG; },200); return f.animate([{transform:`translate(${tx}px,${ty}px) scale(1) rotate(${rot}deg)`},{transform:`translate(0,0) scale(${r.width/w}) rotate(0deg)`}],{duration:420,delay:i*60,easing:'cubic-bezier(.4,.1,.3,1)',fill:'forwards'}).finished; }));
  flies.forEach(f=>f.remove()); src.forEach(x=>{ if(x.el) x.el.style.visibility=''; });
}
async function resolveChongtong(){
  for(let pending;access.allowed()&&(pending=game.pendingChongtong());){
    const {p,months}=pending;let decision='win';
    if(p===ME){
      Sound.play('prompt');
      decision=await new Promise(res=>modal(`<h2>총통!</h2><p>${months.join('월 · ')}월 네 장이 모두 모였어요.<br>7점으로 이기거나 게임을 계속할 수 있어요.</p><div class="chongtong-cards">${game.hand[p].filter(c=>c.m===months[0]).map(cardSVG).join('')}</div><div class="row"><button class="btn gold" id="chongtong-win">7점으로 승리</button><button class="btn g" id="chongtong-continue">계속하기</button></div>`,{'chongtong-win':()=>res('win'),'chongtong-continue':()=>res('continue')}));
    }else await banner('상대 총통!',`${months[0]}월 네 장 · 7점 승리`,'warn',1300);
    if(!access.allowed()||game.over)return;
    await game.declareChongtong(p,decision);render();
  }
}
async function doTurn(card,bomb){
  if(!access.allowed())return;
  ui.busy=true;render();
  try{await game.play(ME,card,bomb);await resolveChongtong();if(!game.over)await cpuTurn();}
  finally{ui.busy=false;render();}
}
async function cpuTurn(){
  if(ui.autoRunning)return;ui.autoRunning=true;ui.busy=true;render();
  try{
    // 내 폭탄 뒤집기는 손패가 없어도 사용자가 버튼으로 선택한다.
    while(access.allowed()&&!game.over){
      await resolveChongtong();if(game.over||game.turn!==CPU)break;
      const p=game.turn;
      if(!game.canMove(p)){await game.endTurn(p);continue;}
      await sleep(p===CPU?650:180);
      let card=p===CPU?aiChooseCard(game,CPU):null,bomb=null;
      if(card){
        const same=game.hand[p].filter(c=>c.m===card.m),matches=game.matches(card.m);
        if(same.length>=3){
          if(matches.length===1&&matches[0][0].length===1)bomb=same.filter(c=>c!==card).slice(0,2);
          else if(!game.shake[p]){game.shakeCards(p,card.m);await shakeAnim(p,same.slice(0,3));}
        }
      }
      await game.play(p,card,bomb);
    }
  }finally{ui.autoRunning=false;ui.busy=false;render();}
}
async function showRefill(){
  if(refilling||settling||ui.busy||roundCheck)return;
  ui.busy=true;
  let state;
  try{state=await wallet.status();game.bank[ME]=state.gold;render();}
  catch(error){toast(error.message,3500);return;}finally{ui.busy=false;}
  const empty=state.gold<1000&&!state.round,paid=state.free_left===0;
  modal(`<h2>골드 충전</h2><p>보유 ${state.gold.toLocaleString()}G<br>오늘 무료 리필 ${state.free_left}회 남음 · 보유 ${state.coins} ZU</p><p>${empty?(paid?'5 ZU를 사용하면 남은 골드에 5,000G가 더해져요.':'무료로 남은 골드에 5,000G를 더할 수 있어요.'):state.round?'진행 중인 판을 마친 뒤 충전할 수 있어요.':'골드가 1,000G 미만일 때 충전할 수 있어요.'}<br>무료 리필은 한국시간 자정에 2회로 초기화돼요.</p><div class="row">${empty?`<button class="btn ${paid?'ju-paid-action':'gold'}" id="refill-gold">${paid?'5 ZU 사용 · 5,000G':'무료 5,000G 리필'}</button>`:''}<button class="btn g" id="close-gold">닫기</button></div>`,{'refill-gold':()=>refillGold(paid),'close-gold':()=>{}});
}
async function refillGold(paid){
  if(refilling)return;refilling=true;ui.busy=true;
  try{const state=await wallet.refill(paid);game.bank[ME]=state.gold;render();toast('5,000G가 충전됐어요.');}
  catch(error){modal(`<h2>충전 확인</h2><p id="gold-error"></p><div class="row"><button class="btn" id="retry-gold">다시 확인</button></div>`,{'retry-gold':()=>showRefill()});document.getElementById('gold-error').textContent=error.message;return;}
  finally{refilling=false;ui.busy=false;}
  await startRound();
}
async function finishRound(type,d){
  if(settling)return;settling=true;pendingResult={type,d};
  try{
    const state=await wallet.settle(currentRound,game.actions);game.bank[ME]=state.gold;currentRound=null;pendingResult=null;render();
    if(type==='nagari'){const bonus=d.firstPpukGold?.[ME]||0;modal(`<div class="result-details"><h2>나가리</h2><p>아무도 7점을 못 냈어요. 다음 판은 점수 ×${game.carry}!</p>${bonus?`<div class="big ${bonus>0?'win':'lose'}"><span class="gold-amount">${bonus>0?'+':''}${bonus.toLocaleString()}</span><small class="gold-unit">G</small></div><p>첫뻑 정산</p>`:''}<p class="result-balance">내 골드 <strong>${state.gold.toLocaleString()}</strong></p></div><div class="row result-actions"><button class="btn" id="next">${state.gold<1000?'골드 충전':'다음 판'}</button><button class="btn g" id="result-exit">나가기</button></div>`,{next:()=>state.gold<1000?showRefill():startRound(),'result-exit':()=>$('#exit').click()},true);}
    else{
      const won=d.winner===ME,bonus=d.firstPpukGold?.[ME]||0,net=d.goldDelta?.[ME]??(won?d.money:-d.money);
      Bridge.result({win:won,delta:net,points:d.total,detail:d.det});
      modal(`<div class="result-details"><h2>${d.tazzaSaved?'탄쓰기로 이겼어요!':won?'내가 이겼어요!':'상대가 이겼어요'}</h2><div class="big ${won?'win':'lose'}"><span class="gold-amount">${net>=0?'+':''}${net.toLocaleString()}</span><small class="gold-unit">G</small></div><table class="sc">${d.det.map(x=>`<tr><td>${x[0]}</td><td>${typeof x[1]==='number'?x[1]+'점':x[1]}</td></tr>`).join('')}<tr><td><b>합계</b></td><td><b>${d.total}점</b><small class="score-formula">${d.pts}점 × ${d.mult}</small></td></tr></table>${bonus?`<div class="gold-breakdown"><div><span>승패 정산</span> <strong>${won?'+':'-'}${d.money.toLocaleString()}G</strong></div><div><span>첫뻑 정산</span> <strong>${bonus>0?'+':''}${bonus.toLocaleString()}G</strong></div></div>`:''}<p>이번 판 · 점당 ${game.rate.toLocaleString()}G</p><p class="result-balance">내 골드 <strong>${state.gold.toLocaleString()}</strong></p>${state.gold===0?'<p class="result-note">골드를 모두 잃어 판돈이 점당 100G로 초기화됐어요. 충전하면 다시 할 수 있어요.</p>':''}</div><div class="row result-actions"><button class="btn" id="next">${state.gold<1000?'골드 충전':'다음 판'}</button><button class="btn g" id="result-exit">나가기</button></div>`,{next:()=>state.gold<1000?showRefill():startRound(),'result-exit':()=>$('#exit').click()},true);
    }
  }catch(error){modal('<h2>결과 저장</h2><p id="save-error"></p><div class="row"><button class="btn" id="retry-save">다시 저장</button></div>',{'retry-save':()=>finishRound(type,d)});document.getElementById('save-error').textContent=error.message;}
  finally{settling=false;}
}
async function startRound(){
  if(currentRound&&!game.over)return false; // A reservation must never restart the current hand.
  if(roundCheck||ui.dealing||ui.busy||game._playing||settling||refilling)return false;
  if(pendingResult){await finishRound(pendingResult.type,pendingResult.d);return false;}
  roundCheck=true;
  const assisted=tazza.begin();syncTazza();vent.clear();vent.sync();
  let state;
  try{await access.check();state=await wallet.start({tazza:assisted});}
  catch(error){
    roundCheck=false;tazza.finish(false);syncTazza();vent.sync();
    if(error.code==='gold_empty'){render();await showRefill();}
    else if(error.code==='client_update_required'){
      modal('<h2>맞고 업데이트</h2><p>맞고가 업데이트됐어요. 최신 화면으로 다시 열어 주세요.</p><div class="row"><button class="btn gold" id="refresh-start">업데이트하고 시작</button></div>',{'refresh-start':()=>{const url=new URL(location.href);url.searchParams.set('update',String(Date.now()));location.replace(url.href);}});
    }else{toast(error.message,3500);modal('<h2>게임 시작</h2><p id="start-error"></p><div class="row"><button class="btn" id="retry-start">다시 시작</button></div>',{'retry-start':()=>startRound()});document.getElementById('start-error').textContent=error.message;}
    return false;
  }
  finally{roundCheck=false;}
  if(document.body.classList.contains('matgo-locked')){tazza.finish(false);syncTazza();return false;}
  currentRound=state.round.id;game.roundCpuLevel=state.round.cpu_level;game.rate=state.round.rate??100;game.bank=[state.gold,5000];game.first=state.round.first;game.carry=state.round.carry;
  Sound.cancel();ui.chooseStacks=null;ui.resolveChoose=null;ui.holdRect=null;ui.lastHandRect=null;ui.dealing=true;ui.busy=true;ui.warned={};LAYOUT_N=-1;dealSoloRound(game,state.round,{Game,seededRandom});tazza.finish(true);stackEls.forEach(el=>el.remove());stackEls=new Map();
  if($('#fl'))document.querySelectorAll('#capsOp .cap .c,#capsMe .cap .c,#handMe .c,#handOp .c').forEach(e=>e.remove());
  render();if(game.cpuMode!=='standard')toast('이전에 시작한 판을 이어갑니다. 이 판을 끝내고 다음 판을 누르면 새 난이도가 적용돼요.',6000);else if(game.tazzaMode)toast(TAZZA_MODES[game.tazzaMode]+' · '+TAZZA_DETAILS[game.tazzaMode],3500);await dealAnim();ui.dealing=false;await resolveChongtong();ui.busy=false;render();if(!game.over&&game.turn===CPU)await cpuTurn();return true;
}
async function dealAnim(){
  const dk=$('.deck .back').getBoundingClientRect(),flights=[];
  stackEls.forEach(el=>el.querySelectorAll('.c').forEach(card=>card.style.visibility='hidden'));
  for(const st of game.floor){
    for(let i=0;i<st.length;i++){
      const card=st[i],target=stackEls.get(st)?.querySelector(`.c[data-id="${card.id}"]`),to=cardScreenPos(st,i);
      flights.push(throwCard(card,{x:dk.left,y:dk.top,w:dk.width,h:dk.height,rot:0},to,{back:true,dur:380,dealing:true,onCards:i>0}).then(()=>{if(target?.isConnected)target.style.visibility='';}));
      await sleep(90);
    }
  }
  await Promise.all(flights);render();
}
startRound();
})();
</script>
