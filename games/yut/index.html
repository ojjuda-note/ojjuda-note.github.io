<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#aee5e5"><title>섬마을 윷놀이 · 오쭈다 오락실</title>
<link rel="stylesheet" href="./style.css?v=2">
<script defer src="/config.js"></script><script type="module" src="./play.mjs?v=2"></script></head>
<body>
<main class="tabletop">
  <header class="rail">
    <a class="rail-btn" href="/world.html?tab=arcade" aria-label="오락실로 돌아가기"><span aria-hidden="true">‹</span> 오락실</a>
    <h1>섬마을 윷놀이</h1>
    <button id="settings" class="rail-btn" aria-haspopup="dialog"><span aria-hidden="true">☰</span> 메뉴</button>
  </header>
  <section class="scene" aria-label="섬마을 윷놀이판">
    <canvas id="board" role="img" aria-label="스무 칸의 섬길과 대각선 지름길이 있는 3D 윷놀이판"></canvas>
  </section>
  <section class="dock" aria-label="게임 조작">
    <div class="playbar">
      <div class="info"><button id="team-title" title="팀별 말 현황" aria-haspopup="dialog">산호 팀 차례</button>
        <span id="outcome"></span></div>
      <div id="actions"></div>
    </div>
    <p id="note" role="status"></p>
  </section>
</main>
<div id="toss-layer" class="toss-layer" hidden aria-hidden="true">
  <div class="toss-card"><canvas id="toss-canvas" width="600" height="400"></canvas><div id="toss-label"></div></div>
</div>
<dialog id="sheet" aria-labelledby="dialog-title"><div class="dialog-title"><h2 id="dialog-title"></h2><button id="close" aria-label="닫기">×</button></div><div id="dialog-body"></div></dialog>
</body></html>
