<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f5ed"><title>윷놀이 · 오쭈다 오락실</title>
<link rel="icon" href="./cover.webp?v=1" type="image/webp">
<link rel="stylesheet" href="./style.css?v=20261120-service-actions1">
<link rel="stylesheet" href="/shared/games/game-entry.css?v=20261109-unified-multiplayer-ui2">
<link rel="stylesheet" href="/shared/games/multiplayer-entry.css?v=20261109-unified-multiplayer-ui2">
<link rel="stylesheet" href="/features/arcade/arcade-rooms.css?v=20261120-service-actions2">
<link rel="stylesheet" href="/shared/games/arcade-return.css?v=20261112-arcade-entry-return1">
<link rel="stylesheet" href="/shared/games/game-results.css?v=20261120-service-actions1">
<script defer src="/config.js"></script>
<script defer src="/features/arcade/arcade-rooms.js?v=20261120-service-actions1"></script>
<script defer src="/shared/games/guest-game-scores.js?v=20261117-arcade-score-repair1"></script>
<script defer src="/shared/games/game-results.js?v=20261120-service-actions1"></script>
<script type="module" src="./play.mjs?v=20261121-yut-capture1"></script></head>
<body data-mp-entry="true">
<header class="mp-entry-bar"><a class="mp-entry-back arcade-return" href="/world.html?tab=arcade">← 오쭈다 오락실</a><span>오쭈다 오락실</span></header>
<main id="setup">
  <section id="yut-entry" class="game-entry mp-entry" aria-labelledby="entry-title">
    <div class="ge-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><g transform="rotate(23 12 12)"><rect x="3" y="4" width="4" height="16" rx="2"/><rect x="10" y="2" width="4" height="17" rx="2"/><rect x="17" y="5" width="4" height="16" rx="2"/><path d="m4 10 2 2m0-2-2 2m7-5 2 2m0-2-2 2"/></g></svg></div>
    <span class="ge-kicker">오쭈다 오락실 · 멀티게임</span>
    <h1 class="ge-title" id="entry-title">윷놀이</h1>
    <p class="ge-copy">우리 팀 동물 말을 먼저 모두 골인시키세요.</p>
    <div id="entry-controls"></div>
  </section>
  <section id="online-lobby" class="game-entry mp-entry" aria-labelledby="online-lobby-title" hidden>
    <span class="ge-kicker">오쭈다 오락실 · 윷놀이</span>
    <h2 class="ge-title" id="online-lobby-title">온라인 대기실</h2>
    <div id="online-lobby-body"></div>
  </section>
</main>
<main class="tabletop" id="tabletop" hidden>
  <header class="rail">
    <a class="rail-btn back" href="/world.html?tab=arcade" aria-label="오락실로 돌아가기"><i aria-hidden="true"></i><span>오락실</span></a>
    <h1><i class="moon-mark" aria-hidden="true"></i>윷놀이</h1>
    <button id="settings" class="rail-btn" aria-haspopup="dialog"><i class="menu-mark" aria-hidden="true"></i><span>메뉴</span></button>
  </header>
  <section class="scene" aria-label="윷판">
    <canvas id="board" role="img" aria-describedby="note" aria-label="팀 이름과 번호가 붙은 십이지 동물 말"></canvas>
    <div id="first-seat" class="first-seat" hidden>
      <div class="first-seat-card" role="status" aria-atomic="true">
        <strong id="first-seat-heading"></strong>
        <div id="first-seat-circle" class="first-seat-circle" aria-hidden="true"><span id="first-seat-stick"><canvas width="320" height="92"></canvas></span></div>
        <span id="first-seat-order"></span>
      </div>
    </div>
  </section>
  <section class="reserve" id="reserve" aria-labelledby="reserve-title">
    <div class="reserve-inner">
      <div class="reserve-caption"><h2 id="reserve-title">말 대기석</h2><span id="reserve-team"></span></div>
      <div id="reserve-pawns" role="group" aria-label="출발을 기다리는 말"></div>
    </div>
  </section>
  <section class="station" id="station" aria-label="현재 차례와 게임 조작">
    <div class="turn-info">
      <div class="turn-line">
        <button id="team-title" title="팀별 말 현황" aria-haspopup="dialog">산호 팀 차례</button>
        <span id="goals" class="goals"></span>
      </div>
      <p id="note" role="status"></p>
    </div>
    <div class="rack" id="stick-rack">
      <span id="outcome" role="status"></span>
      <div class="rack-well"><canvas id="rack-canvas" role="img" aria-label="던질 윷 네 가락"></canvas></div>
    </div>
    <div id="move-tools" hidden>
      <div class="move-heading"><strong id="move-result" role="status"></strong><div id="result-picker" role="group" aria-label="쓸 결과 선택" hidden></div><span id="field-label">판 위의 말</span></div>
      <div id="pawn-picker" role="group" aria-label="판 위의 말"></div>
    </div>
    <div class="dock"><div id="actions"></div></div>
  </section>
</main>
<div id="toss-layer" class="toss-layer" hidden aria-hidden="true">
  <canvas id="toss-canvas"></canvas><div id="toss-label"></div>
</div>
<div id="bonus-roll" aria-hidden="true" hidden>
  <div class="game-result-effects"></div>
  <strong>한 번 더!!</strong>
</div>
<dialog id="sheet" aria-labelledby="dialog-title"><div class="dialog-title"><h2 id="dialog-title"></h2><button id="close" aria-label="닫기">×</button></div><div id="dialog-body"></div></dialog>
</body></html>
