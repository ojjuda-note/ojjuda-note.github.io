<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#091c23"><title>섬마을 윷놀이 · 오쭈다 오락실</title>
<link rel="icon" href="./cover.svg?v=4" type="image/svg+xml">
<link rel="stylesheet" href="./style.css?v=4">
<script defer src="/config.js"></script><script type="module" src="./play.mjs?v=4"></script></head>
<body>
<main class="tabletop">
  <header class="rail">
    <a class="rail-btn back" href="/world.html?tab=arcade" aria-label="오락실로 돌아가기"><i aria-hidden="true"></i><span>오락실</span></a>
    <h1><i class="moon-mark" aria-hidden="true"></i>섬마을 윷놀이</h1>
    <button id="settings" class="rail-btn" aria-haspopup="dialog"><i class="menu-mark" aria-hidden="true"></i><span>메뉴</span></button>
  </header>
  <section class="scene" aria-label="섬마을 윷놀이판">
    <canvas id="board" role="img" aria-label="밤바다에 놓인 자개 윷판. 스무 칸의 바깥길과 가운데를 지나는 두 지름길이 있어요."></canvas>
  </section>
  <section class="station" aria-label="윷과 게임 조작">
    <div class="rack">
      <div class="rack-heading"><span id="rack-title">던질 윷</span><span id="outcome"></span></div>
      <div class="rack-well"><canvas id="rack-canvas" role="img" aria-label="던질 윷 네 가락"></canvas></div>
    </div>
    <div class="dock">
    <div class="playbar">
      <div class="turn-info">
        <div class="turn-line">
          <button id="team-title" title="팀별 말 현황" aria-haspopup="dialog">산호 팀 차례</button>
          <span id="goals" class="goals"></span>
        </div>
        <p id="note" role="status"></p>
      </div>
      <div id="actions"></div>
    </div>
    </div>
  </section>
</main>
<div id="toss-layer" class="toss-layer" hidden aria-hidden="true">
  <canvas id="toss-canvas"></canvas><div id="toss-label"></div>
</div>
<dialog id="sheet" aria-labelledby="dialog-title"><div class="dialog-title"><h2 id="dialog-title"></h2><button id="close" aria-label="닫기">×</button></div><div id="dialog-body"></div></dialog>
</body></html>
