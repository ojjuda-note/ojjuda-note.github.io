<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f8f2">
  <meta name="description" content="미쉐린·블루리본 가이드 선정 식당과 우체국 추천 맛집을 음식 종류와 지역별로 찾아보는 오쭈다 맛집 지도.">
  <title>인증맛집 · 오쭈다</title>
  <link rel="stylesheet" href="./vendor/leaflet.css">
  <link rel="stylesheet" href="./style.css?v=20261103-restaurants-audit1">
  <script src="./vendor/leaflet.js" defer></script>
  <script src="./app.js?v=20261103-restaurants-audit1" defer></script>
</head>
<body>
  <a class="skip-link" href="#results">가게 목록으로 이동</a>
  <main class="app">
    <header class="page-header">
      <div class="heading-copy"><h1>인증맛집</h1><p class="subtitle">미쉐린 · 블루리본 · 우체국 추천</p></div>
      <a id="back-link" class="back-link" href="/world.html?tab=arcade">← 오락실</a>
    </header>

    <section class="search-area" aria-label="맛집 검색과 필터">
      <form id="search-form" class="search-row" role="search">
        <label class="search-box"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span class="sr-only">가게 이름, 주소, 음식 검색</span><input id="search" type="search" placeholder="가게 이름, 지역, 음식 검색" autocomplete="off" maxlength="160"></label>
        <button id="nearby" class="nearby-button" aria-pressed="false" type="button"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="10" cy="10" r="5" stroke="currentColor" stroke-width="1.5"/><circle cx="10" cy="10" r="1.5" fill="currentColor"/><path d="M10 1v3m0 12v3M1 10h3m12 0h3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span id="nearby-label">내 주변</span></button>
      </form>
      <div id="location-bar" class="location-bar" hidden><p id="location-status" role="status"></p><button id="choose-region" type="button" hidden>지역 선택</button></div>
      <div id="categories" class="category-row" role="group" aria-label="음식 종류">
        <button type="button" class="category is-active" data-category="" aria-pressed="true">전체</button>
        <button type="button" class="category" data-category="한식" aria-pressed="false">한식</button>
        <button type="button" class="category" data-category="중식" aria-pressed="false">중식</button>
        <button type="button" class="category" data-category="일식" aria-pressed="false">일식</button>
        <button type="button" class="category" data-category="양식" aria-pressed="false">양식</button>
        <button type="button" class="category" data-category="분식" aria-pressed="false">분식</button>
        <button type="button" class="category" data-category="디저트" aria-pressed="false">디저트</button>
        <button type="button" class="category" data-category="기타" aria-pressed="false">기타</button>
      </div>
    </section>

    <div class="results-toolbar">
      <p id="result-count" class="result-count" aria-live="polite">맛집을 불러오는 중…</p>
      <button id="filter-toggle" class="filter-toggle" type="button" aria-expanded="false" aria-controls="filter-options"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.5"/><circle cx="7" cy="5" r="2" fill="currentColor"/><circle cx="13" cy="10" r="2" fill="currentColor"/><circle cx="8" cy="15" r="2" fill="currentColor"/></svg><span id="filter-label">필터</span></button>
      <div class="view-switch" role="group" aria-label="보기 방식"><button id="show-list" type="button" aria-pressed="true">목록</button><button id="show-map" type="button" aria-pressed="false">지도</button></div>
    </div>
    <p id="filter-summary" class="filter-summary" hidden></p>

    <section id="filter-options" class="filter-options" aria-label="상세 검색 조건" hidden>
      <div class="filter-heading"><label class="region-box"><span>지역</span><select id="region"><option value="">전국</option></select></label><button id="reset" class="text-button" type="button">초기화</button></div>
      <div id="guides" class="guide-filters" role="group" aria-label="선정 가이드">
          <button type="button" class="guide-filter is-active" data-guide="" aria-pressed="true">전체 가이드</button>
          <button type="button" class="guide-filter" data-guide="michelin" aria-pressed="false"><span class="guide-dot michelin-dot" aria-hidden="true"></span>미쉐린</button>
          <button type="button" class="guide-filter" data-guide="blue-ribbon" aria-pressed="false"><span class="guide-dot ribbon-dot" aria-hidden="true"></span>블루리본</button>
          <button type="button" class="guide-filter" data-guide="post-office" aria-pressed="false"><span class="guide-dot post-office-dot" aria-hidden="true"></span>우체국 추천</button>
          <button type="button" class="guide-filter" data-guide="both" aria-pressed="false">미쉐린·블루리본 모두</button>
      </div>
      <div class="toolbar-actions">
        <button id="saved-only" class="utility-button" type="button" aria-pressed="false"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M5 3h10v14l-5-3-5 3V3Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>저장한 곳</button>
      </div>
    </section>

    <section id="collections" class="collection-links" aria-label="공식 전체 지도" hidden></section>
    <p id="status" class="status" role="status" hidden></p>
    <section id="workspace" class="workspace" data-view="list" aria-label="맛집 지도와 목록">
      <div id="map-panel" class="map-panel">
        <div id="map" role="region" aria-label="선정 식당 지역 지도"><div class="map-loading">지도를 준비하고 있어요.</div></div>
        <div id="map-message" class="map-message" hidden><span id="map-message-text"></span><button id="retry-map" type="button">다시 불러오기</button></div>
        <div class="map-caption"><span id="map-caption-text">지역 지도 · 자세한 위치는 가게 정보에서 확인</span></div>
      </div>
      <div id="results" class="results-panel" tabindex="-1" aria-label="선정 식당 목록">
        <div id="cards" class="cards"><div class="loading-state"><span class="loading-ring" aria-hidden="true"></span><p>확인된 맛집을 불러오고 있어요.</p></div></div>
        <button id="load-more" class="load-more" type="button" hidden>더 보기</button>
      </div>
    </section>

    <footer class="page-footer"><details><summary>자료 안내</summary><p id="coverage">공식 출처로 확인한 일부 식당부터 제공합니다.</p><p><span id="updated"></span> · 선정·발행 연도와 출처는 가게 정보에서 확인할 수 있어요.</p><div id="collection-sources"></div><p>지역 지도: KOSTAT 2018 시도 경계 · <a href="https://github.com/southkorea/southkorea-maps" target="_blank" rel="noopener noreferrer">지도 출처</a></p></details></footer>
  </main>

  <dialog id="detail" class="detail-dialog" aria-labelledby="detail-title"><div class="detail-shell"><button id="close-detail" class="close-detail" type="button" aria-label="가게 정보 닫기">×</button><div id="detail-content"></div></div></dialog>
  <noscript><p class="no-script">검색과 지도를 보려면 자바스크립트를 켜 주세요.</p></noscript>
</body>
</html>
