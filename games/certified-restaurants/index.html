<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#faf9f5">
  <meta name="description" content="미쉐린·블루리본·우체국 추천과 지자체 지정 맛집을 음식 종류와 지역별로 찾아보는 오쭈다 맛집 지도.">
  <title>인증맛집 · 오쭈다</title>
  <link rel="stylesheet" href="./vendor/leaflet.css">
  <link rel="stylesheet" href="/restaurant-ratings.css?v=20261103-restaurants-ratings1">
  <link rel="stylesheet" href="./style.css?v=20261103-restaurants-regional1">
  <script src="./vendor/leaflet.js" defer></script>
  <script src="/restaurant-ratings.js?v=20261103-restaurants-ratings1" defer></script>
  <script src="./app.js?v=20261103-restaurants-regional1" defer></script>
</head>
<body>
  <a class="skip-link" href="#results">가게 목록으로 이동</a>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 3v6m-3-6v4a3 3 0 0 0 6 0V3M6 10v11M17 3c-3 3-4 6-4 10h5V3Zm1 10v8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span><h1>인증맛집</h1></div>
      <nav class="header-actions" aria-label="맛집 메뉴">
        <button id="saved-only" class="saved-toggle" type="button" aria-pressed="false" aria-label="저장한 곳"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M5 3h10v14l-5-3-5 3V3Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg><span class="saved-label">저장한 곳</span><span class="saved-label-short" aria-hidden="true">저장</span></button>
        <a id="recommendations-link" class="member-menu-link" href="/world.html?game=restaurants&amp;restaurantView=recommendations" target="_top"><span class="member-menu-title">추천맛집</span><span class="member-menu-arrow" aria-hidden="true">→</span></a>
        <a id="back-link" class="back-link" href="/world.html?tab=arcade" aria-label="오락실로 돌아가기" title="오락실로 돌아가기">←</a>
      </nav>
    </div>
  </header>

  <main class="app explore wrap">
    <section class="search-area" aria-label="맛집 검색과 필터">
      <form id="search-form" class="search-bar" role="search">
        <label class="search-input"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span class="sr-only">가게 이름, 주소, 음식 검색</span><input id="search" type="search" placeholder="가게 이름, 지역, 음식 검색" autocomplete="off" maxlength="160"></label>
        <label class="select-wrap"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M15.5 8c0 4-5.5 9-5.5 9S4.5 12 4.5 8a5.5 5.5 0 0 1 11 0Z" stroke="currentColor" stroke-width="1.4"/><circle cx="10" cy="8" r="1.8" stroke="currentColor" stroke-width="1.4"/></svg><span class="sr-only">지역</span><select id="region"><option value="">전국</option></select><span class="select-chevron" aria-hidden="true">⌄</span></label>
        <button id="nearby" class="nearby-button" aria-pressed="false" type="button"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="10" cy="10" r="5" stroke="currentColor" stroke-width="1.5"/><circle cx="10" cy="10" r="1.5" fill="currentColor"/><path d="M10 1v3m0 12v3M1 10h3m12 0h3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span id="nearby-label">내 주변</span></button>
        <button id="reset" class="reset-button" type="button" aria-label="검색 조건 초기화" title="검색 조건 초기화"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M4 7a6 6 0 1 1-.1 6M4 3v4h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </form>
      <div id="location-bar" class="location-bar" hidden><p id="location-status" role="status"></p><button id="choose-region" type="button" hidden>지역 선택</button></div>
      <div class="filter-row">
      <div id="categories" class="category-row" role="group" aria-label="음식 종류">
        <button type="button" class="category is-active" data-category="" aria-pressed="true">전체</button>
        <button type="button" class="category" data-category="한식" aria-pressed="false">한식</button>
        <button type="button" class="category" data-category="중식" aria-pressed="false">중식</button>
        <button type="button" class="category" data-category="일식" aria-pressed="false">일식</button>
        <button type="button" class="category" data-category="양식" aria-pressed="false">양식</button>
        <button type="button" class="category" data-category="분식" aria-pressed="false">분식</button>
        <button type="button" class="category" data-category="디저트" aria-pressed="false">디저트</button>
        <button type="button" class="category" data-category="기타" aria-pressed="false">기타</button>
      </div>
      <button id="filter-toggle" class="filter-toggle" type="button" aria-expanded="false" aria-controls="filter-options"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.5"/><circle cx="7" cy="5" r="2" fill="currentColor"/><circle cx="13" cy="10" r="2" fill="currentColor"/><circle cx="8" cy="15" r="2" fill="currentColor"/></svg><span id="filter-label">가이드</span></button>
      </div>
    </section>
    <section id="filter-options" class="filter-options" aria-label="상세 검색 조건" hidden>
      <div id="guides" class="guide-filters" role="group" aria-label="선정 가이드">
          <button type="button" class="guide-filter is-active" data-guide="" aria-pressed="true">전체 가이드</button>
          <button type="button" class="guide-filter" data-guide="michelin" aria-pressed="false"><span class="guide-dot michelin-dot" aria-hidden="true"></span>미쉐린</button>
          <button type="button" class="guide-filter" data-guide="blue-ribbon" aria-pressed="false"><span class="guide-dot ribbon-dot" aria-hidden="true"></span>블루리본</button>
          <button type="button" class="guide-filter" data-guide="post-office" aria-pressed="false"><span class="guide-dot post-office-dot" aria-hidden="true"></span>우체국 추천</button>
          <button type="button" class="guide-filter" data-guide="local-guide" aria-pressed="false"><span class="guide-dot local-guide-dot" aria-hidden="true"></span>지자체 지정</button>
          <button type="button" class="guide-filter" data-guide="both" aria-pressed="false">미쉐린·블루리본 모두</button>
      </div>
    </section>
    <p id="filter-summary" class="filter-summary" hidden></p>
    <div class="results-toolbar">
      <h2 id="result-count" class="result-count" aria-live="polite">맛집을 불러오는 중…</h2>
      <div class="view-switch" role="group" aria-label="보기 방식"><button id="show-map" type="button" aria-pressed="true"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="m3 4 4-1 6 2 4-1v12l-4 1-6-2-4 1V4Zm4-1v12m6-10v12" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>지도</button><button id="show-list" type="button" aria-pressed="false"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M7 5h10M7 10h10M7 15h10M3 5h.01M3 10h.01M3 15h.01" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>목록</button></div>
      <p id="result-coverage" class="result-coverage" aria-live="polite" hidden></p>
    </div>
    <section id="collections" class="collection-links" aria-label="공식 전체 지도" hidden></section>
    <p id="status" class="status" role="status" hidden></p>
    <section id="workspace" class="workspace" data-view="map" aria-label="맛집 지도와 목록">
      <div id="map-panel" class="map-panel">
        <div id="map" role="region" aria-label="선정 식당 지역 지도"><div class="map-loading">지도를 준비하고 있어요.</div></div>
        <div id="map-message" class="map-message" hidden><span id="map-message-text"></span><button id="retry-map" type="button">다시 불러오기</button></div>
        <nav id="map-pagination" class="map-pagination" aria-label="지도 맛집 넘기기" hidden>
          <button id="map-prev" type="button" aria-controls="map" disabled>이전 50곳</button>
          <span id="map-page-status" role="status" aria-live="polite"></span>
          <button id="map-next" type="button" aria-controls="map">더 보기 · 50곳</button>
        </nav>
      </div>
      <div id="results" class="results-panel" tabindex="-1" aria-label="선정 식당 목록">
        <div class="list-toolbar"><strong id="list-label">가게 이름순</strong><span>선정·추천 출처 표시</span></div>
        <div id="cards" class="cards"><div class="loading-state"><span class="loading-ring" aria-hidden="true"></span><p>확인된 맛집을 불러오고 있어요.</p></div></div>
        <button id="load-more" class="load-more" type="button" hidden>더 보기</button>
      </div>
    </section>

    <footer class="page-footer data-note"><details><summary>자료 안내</summary><p id="coverage">공식 출처로 확인한 일부 식당부터 제공합니다.</p><p><span id="updated"></span> · 선정·발행 연도와 출처는 가게 정보에서 확인할 수 있어요.</p><div id="collection-sources"></div><p>지역 지도: KOSTAT 2018 시도 경계 · <a href="https://github.com/southkorea/southkorea-maps" target="_blank" rel="noopener noreferrer">지도 출처</a></p></details></footer>
  </main>

  <dialog id="detail" class="detail-dialog" aria-labelledby="detail-title"><div class="detail-shell"><button id="close-detail" class="close-detail" type="button" aria-label="가게 정보 닫기">×</button><div id="detail-content"></div></div></dialog>
  <noscript><p class="no-script">검색과 지도를 보려면 자바스크립트를 켜 주세요.</p></noscript>
</body>
</html>
