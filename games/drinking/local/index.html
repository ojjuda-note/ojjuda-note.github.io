<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf7ed">
  <title>오쭈다</title>
  <link rel="stylesheet" href="style.css?v=20261114-drink-prompts1">
  <link rel="stylesheet" href="/games/party-live/truth-settings.css?v=20261114-truth-flavors1">
  <link rel="stylesheet" href="/games/drinking/access.css?v=20261114-drinks-afterdark1">
  <script defer src="/config.js"></script>
  <script defer src="/games/matgo/matgo-access.js?v=20261114-drinks-adult1"></script>
  <script defer src="/games/drinking/access.js?v=20261114-drinks-reconnect1"></script>
</head>
<body>
  <section id="access-screen" data-state="pending" aria-label="회원 확인">
    <p id="access-message" role="status">회원 정보를 확인하고 있어요…</p>
    <a id="access-login" href="/?auth=login&amp;next=world" target="_blank" rel="noopener" hidden>오쭈다 로그인</a>
    <button id="access-retry" type="button" hidden>다시 확인</button>
    <a href="/world.html?tab=arcade">오쭈다 오락실로</a>
  </section>
  <div id="access-content" hidden></div>
  <template id="access-page" data-title="한 대로 플레이 · 오쭈다 술게임">
<header class="mast"><div class="wrap mast-inner">
  <a class="arcade-return" href="/world.html?tab=arcade"><span aria-hidden="true">←</span> 오쭈다 오락실로</a>
  <div class="header-actions"><a class="mode-back" href="../">방식 선택</a><button id="effects" class="icon-button" aria-label="소리와 진동 설정" title="소리와 진동 설정"></button></div>
</div>
</header>
<main id="app" class="wrap" tabindex="-1"></main>
<dialog id="settings" aria-labelledby="settings-title"><form id="player-form">
  <div class="dialog-head"><h2 id="settings-title">참가자 설정</h2><button class="icon-button" type="button" id="dismiss" aria-label="닫기">✕</button></div>
  <p>한 대로 함께할 사람의 이름을 적어 주세요. </p>
  <div class="stepper"><strong>참가 인원</strong><button type="button" id="less" aria-label="한 명 줄이기">−</button><b id="draft-count"></b><button type="button" id="more" aria-label="한 명 늘리기">＋</button></div>
  <div id="name-fields"></div>
  <button class="big-button" type="submit">설정 완료</button>
</form></dialog>
<dialog id="truth-editor" aria-labelledby="truth-editor-title">
  <div class="dialog-head"><h2 id="truth-editor-title">질문 카드 등록</h2><button class="icon-button" type="button" id="truth-close" aria-label="닫기">✕</button></div>
  <p>추가한 질문은 이 기기에서 바로 뽑을 수 있어요. 직접 쓴 내용은 관리자 검토 후 공용 목록에 등록될 수 있어요.</p>
  <form id="truth-form">
    <label for="truth-flavor">카드 맛</label>
    <select id="truth-flavor" class="field"><option value="mild">순한맛</option><option value="spicy">빨간맛</option></select>
    <label for="truth-question">질문</label>
    <textarea id="truth-question" class="field" rows="3" maxlength="240" required placeholder="카드를 뒤집으면 나올 질문을 적어 주세요."></textarea>
    <button type="submit" id="truth-submit" class="big-button">이 기기에 추가</button>
  </form>
  <p id="truth-message" role="status"></p>
</dialog>
<dialog id="feedback" aria-labelledby="fx-title"><div class="dialog-head"><h2 id="fx-title">소리와 진동</h2><button class="icon-button" id="fx-close" aria-label="닫기">✕</button></div>
<label class="pref"><span>게임 효과음</span><input id="audio-check" type="checkbox"></label>
<label class="pref"><span>게임 진동</span><input id="haptic-check" type="checkbox"></label>
<p id="haptic-note"></p><button class="big-button" id="fx-test">효과 체험하기</button></dialog>
    <span data-module="/games/drinking/community-prompts.js?v=20261114-drink-prompts1"></span>
    <span data-module="/games/drinking/prompt-submissions.js?v=20261114-drinks-afterdark1"></span>
    <span data-module="feedback.js?v=20261114-drinks-local1"></span>
    <span data-module="/games/party-live/truth.js?v=20261114-drinks-content1"></span>
    <span data-module="app.js?v=20261114-drinks-afterdark1"></span>
  </template>
</body>
</html>
