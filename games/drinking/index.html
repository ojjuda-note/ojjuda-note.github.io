<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf7ed">
  <title>오쭈다</title>
  <link rel="stylesheet" href="hub.css?v=20261116-drinking-entry-scenes1">
  <link rel="stylesheet" href="/games/drinking/access.css?v=20261116-drinking-3d-art1">
  <script defer src="/config.js"></script>
  <script defer src="/games/matgo/matgo-access.js?v=20261114-drinks-adult1"></script>
  <script defer src="/games/drinking/access.js?v=20261115-pub-table1"></script>
</head>
<body>
  <section id="access-screen" data-state="pending" aria-label="회원 확인">
    <p id="access-message" role="status">술집 들어가는 중</p>
    <a id="access-login" href="/?auth=login&amp;next=world" target="_blank" rel="noopener" hidden>오쭈다 로그인</a>
    <button id="access-retry" type="button" hidden>다시 확인</button>
    <a href="/world.html?tab=arcade">오쭈다로 돌아가기</a>
  </section>
  <div id="access-content" hidden></div>
  <template id="access-page" data-title="술게임 · 오쭈다">
  <header class="top"><a id="hub-back" href="/world.html?tab=arcade">← 오락실</a></header>
  <main>
    <section id="play-modes" hidden aria-labelledby="modes-title">
      <div class="mode-intro">
        <img src="assets/mode-entrance.webp" width="1344" height="507" alt="">
        <h1 id="modes-title">술게임</h1>
      </div>
      <nav class="mode-options" aria-label="플레이 방식">
        <a id="resume-drinks" hidden><strong>참여 중인 방으로 돌아가기</strong></a>
        <a class="mode-card" id="local-play" href="local/?v=20261116-drinking-entry-scenes2">
          <img src="assets/mode-local.webp" width="720" height="480" alt="">
          <div class="mode-copy"><strong>한 대로 플레이</strong><span>휴대폰 한 대를 함께 써요.</span></div>
        </a>
        <a class="mode-card" href="?mode=multi">
          <img src="assets/mode-multi.webp" width="720" height="480" alt="">
          <div class="mode-copy"><strong>멀티플레이</strong><span>각자 휴대폰으로 같은 방에 모여요.</span></div>
        </a>
      </nav>
    </section>
    <section id="welcome" hidden>
      <div id="account" class="panel" hidden><p id="account-message"></p><a id="login" href="/?auth=login&amp;next=world" target="_blank" rel="noopener" hidden>오쭈다 로그인</a><button id="retry" type="button" hidden>다시 연결</button></div>
      <div id="entry" hidden>
        <section id="directory" aria-labelledby="directory-heading">
          <div class="directory-head">
            <div><h1 id="directory-heading">술게임 멀티</h1><p>친구들과 같은 방에 모여 게임을 즐겨요.</p></div>
            <a class="create-link" id="open-create" href="?mode=multi&amp;view=create"><span aria-hidden="true">＋</span> 방 만들기</a>
          </div>
          <section class="panel rooms" id="rooms" aria-labelledby="rooms-title">
            <div class="room-head"><h2 id="rooms-title">방 목록</h2><button id="refresh" type="button">새로고침</button></div>
            <label class="search-label" for="room-search">방 제목 검색</label>
            <div class="search-box"><input id="room-search" type="search" placeholder="찾고 싶은 방 제목" maxlength="40" autocomplete="off"></div>
            <p id="room-message" role="status"></p>
            <ul id="room-list"></ul>
          </section>
        </section>
        <section class="entry-detail" id="detail" hidden>
          <a class="text-link" id="all-rooms" href="?mode=multi">← 방 목록</a>
          <form id="create-form" class="panel room-form" hidden>
            <h1>방 만들기</h1><p>방 제목은 자동으로 정해져요. 원하는 이름으로 바꿔도 돼요.</p>
            <label>방 제목<input name="title" maxlength="40" placeholder="자동으로 정한 제목 사용"></label>
            <label>최대 인원<select name="capacity"></select></label>
            <label>방 비밀번호<input type="password" name="password" required minlength="4" maxlength="32" autocomplete="new-password" placeholder="4자 이상"></label>
            <button type="submit" class="primary">방 만들기</button>
          </form>
          <form id="join-form" class="panel room-form" hidden>
            <h1 id="join-title">초대받은 방</h1><p>방 비밀번호를 입력하면 입장할 수 있어요.</p>
            <label>방 비밀번호<input name="password" type="password" required minlength="4" maxlength="32" autocomplete="current-password" placeholder="방장이 정한 비밀번호"></label>
            <button type="submit" class="primary">입장하기</button>
          </form>
        </section>
      </div>
    </section>
    <section id="lobby" hidden aria-labelledby="room-title">
      <div class="room-head"><h1 id="room-title" tabindex="-1"></h1><button id="leave" type="button">방 나가기</button></div>
      <section class="panel roster">
        <div class="room-head"><h2 id="member-count"></h2><button id="invite" type="button" aria-haspopup="dialog">친구 초대</button></div>
        <ul id="members"></ul>
      </section>
      <div class="pick">
        <div class="room-head">
          <h2>게임 선택</h2>
          <button id="random-start" type="button" hidden disabled>랜덤 게임</button>
        </div>
        <p id="selected-game" role="status"></p>
        <button id="start" class="primary" type="button">게임 시작</button>
        <div id="games" aria-label="술게임 목록"></div>
      </div>
    </section>
    <dialog id="friend-invite" aria-labelledby="invite-title">
      <div class="room-head"><h2 id="invite-title">친구 초대</h2><button id="invite-close" type="button" autofocus>닫기</button></div>
      <p id="invite-status" role="status"></p>
      <ul id="invite-list" aria-label="초대할 친구"></ul>
    </dialog>
    <p id="notice" role="status" aria-live="polite"></p>
    <noscript>술게임을 이용하려면 자바스크립트를 켜 주세요.</noscript>
  </main>
    <span data-module="/games/drinking/table-view.js?v=20261116-drinking-3d-art1"></span>
    <span data-module="/games/drinking/connection.js?v=20261114-drinks-stability1"></span>
    <span data-module="entry-refresh.js?v=20261115-shapematch1"></span>
    <span data-module="hub.js?v=20261115-drinking-menu2"></span>
  </template>
</body>
</html>
